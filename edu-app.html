,156.5 L145.2,158.7 L151.4,161.0 L157.6,163.3 L163.8,165.5 L170.0,167.8 L176.2,170.1 L182.4,172.4 L188.6,174.6 L194.8,176.9 L201.0,179.2 L207.2,181.5 L213.4,183.7 L219.6,186.0 L225.8,188.3 L232.0,190.5 L238.2,192.8 L244.4,195.1 L250.6,197.4 L256.8,199.6 L263.0,201.9 L269.2,204.2 L275.4,206.5 L281.6,208.7 L287.8,211.0 L294.0,213.3 L300.2,215.5 L306.4,217.8 L312.6,220.1 L318.8,222.4 L325.0,224.6 L331.2,226.9 L337.4,229.2 L343.6,231.5 L349.8,233.7 L356.0,236.0\" stroke=\"#1b7a43\" fill=\"none\" stroke-width=\"2.5\" />\u003ctext x=\"354.0\" y=\"123.5\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"end\" font-weight=\"normal\" >최대\u003c/text>\u003ctext x=\"354.0\" y=\"195.8\" font-size=\"11\" fill=\"#1f3a5f\" text-anchor=\"end\" font-weight=\"normal\" >평균\u003c/text>\u003ctext x=\"296.0\" y=\"226.4\" font-size=\"11\" fill=\"#1b7a43\" text-anchor=\"end\" font-weight=\"normal\" >최소\u003c/text>\u003cline x1=\"232.0\" y1=\"236.0\" x2=\"232.0\" y2=\"154.2\" stroke=\"#e07b00\" stroke-width=\"1\" stroke-dasharray=\"3 3\" />\u003cline x1=\"294.0\" y1=\"236.0\" x2=\"294.0\" y2=\"154.2\" stroke=\"#e07b00\" stroke-width=\"1\" stroke-dasharray=\"3 3\" />\u003ctext x=\"235.0\" y=\"148.2\" font-size=\"10\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"normal\" >40세 5.0/6.5/9.0\u003c/text>\u003ctext x=\"297.0\" y=\"184.5\" font-size=\"10\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"normal\" >50세 2.5/3.5/5.0\u003c/text>\u003ctext x=\"201.0\" y=\"270.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >나이(세)\u003c/text>\u003ctext x=\"14.0\" y=\"136.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >D\u003c/text>\u003ctext x=\"52.0\" y=\"26.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"start\" font-weight=\"bold\" >조절력(D)  최대 · 평균 · 최소\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 5-1.\u003c/b> Hofstetter 공식에 따른 나이별 조절력 기대값\u003c/figcaption>\u003c/figure>\u003cp>측정한 단안 조절력이 연령 최소값보다 \u003cb>2D 이상 낮으면\u003c/b> 조절 부족을 의심하는 기준이 문헌에서 흔히 사용됩니다(Review of Optometry, PMC 논문). 단, 푸시업 방법은 조절력을 과대평가하는 경향이 보고되어 있습니다.\u003c/p>"},{"id":"s5-2","title":"5.2 근점·조절력 측정","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>조절력을 측정해 노안 정도와 가입도(ADD) 필요량 추정\u003c/li>\u003cli>젊은 층의 조절 부족(근거리 피로 원인) 선별\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>원용 최종 처방을 착용한 상태, 충분한 조명\u003c/li>\u003cli>\u003cb>푸시업법\u003c/b>: 단안으로 작은 근용 글자(최고 근거리 시력보다 1~2줄 큰 글자)를 40cm에서 천천히 눈 쪽으로 가져오며 &#x27;처음으로 계속 흐려지는 지점&#x27; 측정 → 조절력(D) = 100 ÷ 근점거리(cm)\u003c/li>\u003cli>\u003cb>마이너스 렌즈법\u003c/b>: 40cm(또는 33cm) 시표에서 −0.25D씩 추가해 처음 흐려지는 렌즈량 + 작업거리 디옵터(40cm면 2.50D) = 조절력\u003c/li>\u003cli>R, L, 양안 측정 후 Hofstetter 값과 비교\u003c/li>\u003c/ol>\u003cfigure class=\"gf\" id=\"fig5-2\">\u003csvg class=\"fig\" viewBox=\"0 0 380 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"푸시업법으로 근점·조절력 재기\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g32c0392b\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/>\u003c/marker>\u003cmarker id=\"g32e07b00\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#e07b00\"/>\u003c/marker>\u003c/defs>\u003ccircle cx=\"340.0\" cy=\"80.0\" r=\"18.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ccircle cx=\"330.0\" cy=\"80.0\" r=\"6.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003crect x=\"60.0\" y=\"66.0\" width=\"12.0\" height=\"28.0\" rx=\"2\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" />\u003ctext x=\"66.0\" y=\"60.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >근용 글자\u003c/text>\u003cline x1=\"80.0\" y1=\"80.0\" x2=\"200.0\" y2=\"80.0\" stroke=\"#e07b00\" stroke-width=\"2\" marker-end=\"url(#g32e07b00)\" />\u003ctext x=\"140.0\" y=\"72.0\" font-size=\"10.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"normal\" >천천히 눈 쪽으로\u003c/text>\u003cline x1=\"210.0\" y1=\"80.0\" x2=\"322.0\" y2=\"80.0\" stroke=\"#666\" stroke-width=\"1\" stroke-dasharray=\"3 3\" />\u003ccircle cx=\"210.0\" cy=\"80.0\" r=\"4.0\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003cline x1=\"210.0\" y1=\"104.0\" x2=\"322.0\" y2=\"104.0\" stroke=\"#c0392b\" stroke-width=\"1.2\" marker-end=\"url(#g32c0392b)\" marker-start=\"url(#g32c0392b)\" />\u003ctext x=\"266.0\" y=\"120.0\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >근점 33 cm(예)\u003c/text>\u003crect x=\"10.0\" y=\"136.0\" width=\"360.0\" height=\"38.0\" rx=\"8\" fill=\"#fff8ec\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003ctext x=\"190.0\" y=\"160.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >조절력(D) = 100 ÷ 근점(cm) → 100 ÷ 33 ≈ 3.0 D\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 5-2.\u003c/b> 푸시업법으로 근점·조절력 재기\u003c/figcaption>\u003c/figure>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>근점이 가까울수록 조절력이 크다(1/거리 관계).\u003c/li>\u003cli>푸시업은 시표가 가까워지며 상이 커져(확대) 과대평가, 마이너스 렌즈법은 상이 작아져(축소) 과소평가 경향이 보고됨 → 방법을 기록하고 일관되게 사용.\u003c/li>\u003c/ul>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>원용 처방을 착용시켰다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>단안별로 측정했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>측정 방법(푸시업/마이너스 렌즈)을 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>Hofstetter 기대값과 비교했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>측정 속도를 천천히 일정하게 했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s5-3","title":"5.3 노안 가입도(ADD) 결정","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>고객의 실제 근거리 작업 거리에서 편안하게 볼 수 있는 가입도 결정\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>\u003cb>작업 거리 확인\u003c/b>: 독서·스마트폰·PC 거리 실측(예: 40cm → 필요 조절 2.50D, 33cm → 3.00D, 60cm → 약 1.67D)\u003c/li>\u003cli>\u003cb>잠정 가입도\u003c/b>: &#x27;조절력의 절반은 여유로 남긴다&#x27; 원칙 → ADD = (1/작업거리) − (조절력 ÷ 2). 예) 작업거리 40cm(2.50D), 조절력 3.00D → 2.50 − 1.50 = +1.00D\u003c/li>\u003cli>(선택) 융합 크로스실린더(FCC), 상대조절(NRA/PRA) 균형: ADD를 NRA와 PRA의 중간으로 미세조정\u003c/li>\u003cli>\u003cb>선명 범위 확인\u003c/b>: 잠정 ADD로 시표를 가까이·멀리 움직여 선명한 범위가 작업 거리를 가운데 포함하는지 확인\u003c/li>\u003cli>시험테에 넣어 실제 스마트폰·서류로 착용 테스트 → 범위가 너무 좁거나 가까우면 ADD 감량 고려(과도한 ADD는 흔한 실수)\u003c/li>\u003cli>용도별 렌즈 상담: 단초점 돋보기, 중근용(사무용), 누진다초점 등\u003c/li>\u003c/ol>\u003cfigure class=\"gf\" id=\"fig5-3\">\u003csvg class=\"fig\" viewBox=\"0 0 380 210\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"가입도(ADD) 계산: 조절력의 절반은 여유로 남기기\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003ctext x=\"190.0\" y=\"22.0\" font-size=\"12.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >작업거리 40 cm → 필요 2.50 D, 조절력 3.00 D\u003c/text>\u003crect x=\"40.0\" y=\"50.0\" width=\"250.0\" height=\"30.0\" rx=\"4\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" />\u003ctext x=\"165.0\" y=\"70.0\" font-size=\"12\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >필요 2.50 D\u003c/text>\u003crect x=\"40.0\" y=\"100.0\" width=\"150.0\" height=\"30.0\" rx=\"4\" fill=\"#e6f6ea\" stroke=\"#1b7a43\" stroke-width=\"1.5\" />\u003ctext x=\"115.0\" y=\"120.0\" font-size=\"11.5\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"normal\" >조절 사용 1.50\u003c/text>\u003crect x=\"190.0\" y=\"100.0\" width=\"100.0\" height=\"30.0\" rx=\"4\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"1.5\" />\u003ctext x=\"240.0\" y=\"120.0\" font-size=\"11.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >ADD +1.00\u003c/text>\u003crect x=\"40.0\" y=\"140.0\" width=\"150.0\" height=\"26.0\" rx=\"4\" fill=\"#fff\" stroke=\"#bbb\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\u003ctext x=\"115.0\" y=\"158.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >여유 1.50 (조절력의 절반)\u003c/text>\u003ctext x=\"190.0\" y=\"196.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >ADD = 1 ÷ 작업거리(m) − 조절력 ÷ 2 = 2.50 − 1.50 = +1.00 D\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 5-3.\u003c/b> 가입도(ADD) 계산: 조절력의 절반은 여유로 남기기\u003c/figcaption>\u003c/figure>\u003cp class=\"link1\">🔗 \u003ca href=\"#c/g13\">누진·사무용·피로감소 렌즈는 새로 추가한 10~12장\u003c/a>에서 볼 수 있어요.\u003c/p>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>필요 이상 조절을 오래 쓰면 피로해지므로 조절력의 일부를 여유로 남기는 것이 편안함의 원리.\u003c/li>\u003cli>ADD가 크면 선명한 근거리 범위가 가까워지고 좁아짐 → &#x27;가장 강하게&#x27;가 아닌 &#x27;필요한 만큼&#x27;.\u003c/li>\u003c/ul>\u003cfigure class=\"gf\" id=\"fig5-4\">\u003csvg class=\"fig\" viewBox=\"0 0 380 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"ADD에 따른 선명 범위(조절력 3.0 D 예)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cline x1=\"57.8\" y1=\"40.0\" x2=\"57.8\" y2=\"150.0\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"57.8\" y=\"166.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >20\u003c/text>\u003cline x1=\"93.3\" y1=\"40.0\" x2=\"93.3\" y2=\"150.0\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"93.3\" y=\"166.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >30\u003c/text>\u003cline x1=\"128.9\" y1=\"40.0\" x2=\"128.9\" y2=\"150.0\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"128.9\" y=\"166.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >40\u003c/text>\u003cline x1=\"164.4\" y1=\"40.0\" x2=\"164.4\" y2=\"150.0\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"164.4\" y=\"166.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >50\u003c/text>\u003cline x1=\"200.0\" y1=\"40.0\" x2=\"200.0\" y2=\"150.0\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"200.0\" y=\"166.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >60\u003c/text>\u003cline x1=\"271.1\" y1=\"40.0\" x2=\"271.1\" y2=\"150.0\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"271.1\" y=\"166.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >80\u003c/text>\u003cline x1=\"342.2\" y1=\"40.0\" x2=\"342.2\" y2=\"150.0\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"342.2\" y=\"166.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >100\u003c/text>\u003ctext x=\"200.0\" y=\"186.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >눈에서 거리(cm)\u003c/text>\u003crect x=\"75.6\" y=\"60.0\" width=\"266.7\" height=\"18.0\" rx=\"4\" fill=\"#1b7a43\" stroke=\"#1b7a43\" stroke-width=\"0\" fill-opacity=\".22\"/>\u003ctext x=\"36.0\" y=\"74.0\" font-size=\"11.5\" fill=\"#1b7a43\" text-anchor=\"end\" font-weight=\"bold\" >+1.00\u003c/text>\u003ctext x=\"208.9\" y=\"92.0\" font-size=\"10.5\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"normal\" >이론 범위 약 25~100 cm\u003c/text>\u003crect x=\"65.7\" y=\"108.0\" width=\"158.0\" height=\"18.0\" rx=\"4\" fill=\"#e07b00\" stroke=\"#e07b00\" stroke-width=\"0\" fill-opacity=\".22\"/>\u003ctext x=\"36.0\" y=\"122.0\" font-size=\"11.5\" fill=\"#e07b00\" text-anchor=\"end\" font-weight=\"bold\" >+1.50\u003c/text>\u003ctext x=\"144.7\" y=\"140.0\" font-size=\"10.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"normal\" >이론 범위 약 22~67 cm\u003c/text>\u003cline x1=\"128.9\" y1=\"36.0\" x2=\"128.9\" y2=\"150.0\" stroke=\"#c0392b\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\" />\u003ctext x=\"128.9\" y=\"32.0\" font-size=\"10.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >폰 40 cm\u003c/text>\u003ctext x=\"360.0\" y=\"24.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >ADD가 클수록 범위가 가깝고 좁아져요\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 5-4.\u003c/b> ADD에 따른 선명 범위(조절력 3.0 D 예)\u003c/figcaption>\u003c/figure>\u003cdiv class=\"box term\">\u003cb>🧪 직접 해 보기: 잠정 가입도(ADD) 계산\u003c/b>\u003cp>숫자를 바꿔 보는 실습은 교재 페이지에서 할 수 있어요.\u003c/p>\u003cp>\u003ca class=\"btn l\" href=\"g08.html#lab-add\">교재 페이지에서 실습 열기 →\u003c/a>\u003c/p>\u003c/div>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>실제 작업 거리를 측정했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>조절력 기반 잠정 ADD를 계산했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>선명 범위를 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>실물(폰·서류)로 착용 테스트를 했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>렌즈 종류별 장단점을 설명했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>누진 렌즈는 아이포인트·피팅 높이 측정을 계획했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>\u003cdiv class=\"box must\">\u003cb>노안 상담 시 주의\u003c/b>\u003cul>\u003cli>노안은 생리적 변화라는 점을 부드럽게 설명하되, 40대 이후에는 정기적인 안과 검진도 함께 권유합니다(안경원 검사는 눈 건강 검진을 대신하지 않음).\u003c/li>\u003cli>갑자기 근거리만 심하게 안 보이거나 시력 변동이 크면(예: 혈당 변화 등 전신 요인 가능) 안과·내과 상담을 안내합니다.\u003c/li>\u003c/ul>\u003c/div>"}],"questions":[{"id":"g08-q1","question":"Hofstetter 최소 조절력: 44세는?","choices":["4.0 D","5.0 D","2.5 D","6.5 D"],"answer_index":0,"explanation":"15 − 0.25 × 44 = 4.0 D.","page":"g08.html"},{"id":"g08-q2","question":"작업거리 40 cm, 조절력 3.00 D. 잠정 ADD는?","choices":["+0.50","+1.00","+1.50","+2.50"],"answer_index":1,"explanation":"2.50 − 3.00/2 = +1.00 D.","page":"g08.html"},{"id":"g08-q3","question":"푸시업 근점 25 cm면 조절력은?","choices":["2.5 D","4.0 D","25 D","0.25 D"],"answer_index":1,"explanation":"100 ÷ 25 = 4.0 D.","page":"g08.html"}]},{"id":"g09","no":"6","title":"검사 장비 사용법·한계","page":"g09.html","intro":"\u003cp>장비는 &#x27;정확한 숫자를 주는 기계&#x27;가 아니라 &#x27;조건이 맞을 때 믿을 만한 숫자를 주는 도구&#x27;입니다. 각 장비의 한계를 알아야 결과를 올바르게 해석할 수 있습니다. 세부 조작은 반드시 \u003cb>각 제조사 사용설명서\u003c/b>를 따르십시오.\u003c/p>","key_points":["장비는 '조건이 맞을 때 믿을 만한 숫자'를 주는 도구 – 한계와 오차 원인을 안다.","머리 기울임 = 축 오차, 깜빡임 부족 = 값 변동, PD 미세팅 = 원치 않는 프리즘.","포롭터 결과는 시험테로 최종 확인. 시력표 거리·거울 보정 확인."],"sections":[{"id":"s6-1","title":"6.1 자동굴절검사기 (오토레프랙터)","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>무엇을 측정하나\u003c/td>\u003ctd>눈에 적외선을 비춰 망막 반사광을 분석해 굴절값(S/C/Ax)을 자동 계산\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사용 순서\u003c/td>\u003ctd>· 소독 → 턱·이마받침 위치 → 높이 조절\u003cbr>· 내부 시표를 편하게 보도록 안내\u003cbr>· 정렬(동공 중심, 초점) 확인 후 측정, 눈당 3회 이상\u003cbr>· 신뢰도 지수 확인, 대표값 기록\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한계\u003c/td>\u003ctd>· 조절 개입으로 근시 과대 측정 경향(특히 아동·청년, 기계 근시)\u003cbr>· 작은 동공·매질 혼탁(백내장 등) 시 측정 불가 또는 부정확\u003cbr>· 불규칙 각막(원추각막·수술 후)에서 신뢰도 저하\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주요 오차 원인\u003c/td>\u003ctd>· 머리 기울임 → 축 오차\u003cbr>· 깜빡임 부족·눈물막 불안정 → 값 변동\u003cbr>· 콘택트렌즈 착용 상태에서 측정\u003cbr>· 정렬 불량(동공 중심 이탈)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig6-1\">\u003csvg class=\"fig\" viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"자동굴절검사기(오토레프·오토케라토) 구조(개략도)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g35c0392b\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"au &#x27;의심&#x27;만 가능)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주요 오차 원인\u003c/td>\u003ctd>· 눈물막 건조, 깜빡임 직후 불안정\u003cbr>· 정렬 오류, 주시 불량\u003cbr>· 각막난시로 전체난시를 추정하는 Javal 규칙 등은 근사식일 뿐(IACLE 자료)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig6-2\">\u003csvg class=\"fig\" viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"각막곡률계: 각막에 비친 마이어(링) 상으로 곡률 측정\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003ccircle cx=\"100.0\" cy=\"110.0\" r=\"70.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"100.0\" cy=\"110.0\" r=\"26.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cellipse cx=\"100.0\" cy=\"110.0\" rx=\"44.0\" ry=\"36.0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.5\" />\u003cellipse cx=\"100.0\" cy=\"110.0\" rx=\"22.0\" ry=\"18.0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" />\u003cline x1=\"44.0\" y1=\"110.0\" x2=\"156.0\" y2=\"110.0\" stroke=\"#e07b00\" stroke-width=\"1\" stroke-dasharray=\"3 2\" />\u003cline x1=\"100.0\" y1=\"60.0\" x2=\"100.0\" y2=\"160.0\" stroke=\"#2a6fdb\" stroke-width=\"1\" stroke-dasharray=\"3 2\" />\u003ctext x=\"160.0\" y=\"106.0\" font-size=\"10.5\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"normal\" >K1(약)\u003c/text>\u003ctext x=\"100.0\" y=\"56.0\" font-size=\"10.5\" fill=\"#2a6fdb\" text-anchor=\"middle\" font-weight=\"normal\" >K2(강)\u003c/text>\u003ctext x=\"100.0\" y=\"200.0\" font-size=\"12\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >규칙적인 마이어\u003c/text>\u003ccircle cx=\"300.0\" cy=\"110.0\" r=\"70.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"300.0\" cy=\"110.0\" r=\"26.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cpath d=\"M260,110 Q264,70 304,76 Q346,82 340,116 Q330,154 294,146 Q256,140 260,110 Z\" stroke=\"#fff\" fill=\"none\" stroke-width=\"2.5\" />\u003cpath d 력 측정 및 자각 검사용 시표(문자·숫자·그림·란돌트 고리, 적록, 난시표, 편광 시표 등)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사용 순서\u003c/td>\u003ctd>· 규격 거리(예: 5m/6m, 거울 이용 시 광학적 거리) 보정 확인\u003cbr>· 밝기·대비 정기 점검, 실내 조명 일정\u003cbr>· 시표 무작위 제시(암기 방지)\u003cbr>· 아동·문자 미숙·외국인용 시표 준비\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한계\u003c/td>\u003ctd>· 시표 종류(문자 vs 고리)에 따라 결과 차이\u003cbr>· 소형 매장은 거울 사용 → 좌우 반전·거리 보정 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주요 오차 원인\u003c/td>\u003ctd>· 거리 미보정 → 근시 교정량 판단 오류\u003cbr>· 시표 노후·흐림, 반사광\u003cbr>· 같은 줄 반복으로 외움\u003cbr>· 글자 간격(밀집 효과) 차이\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig6-7\">\u003csvg class=\"fig\" viewBox=\"0 0 400 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"시력표와 검사 거리(거울을 쓰면 광학적 거리로 보정)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g411f3a5f\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f3a5f\"/>\u003c/marker>\u003cmarker id=\"g41e07b00\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#e07b00\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"200.0\" y=\"18.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >위에서 본 좁은 검사실(거울 사용 예)\u003c/text>\u003crect x=\"14.0\" y=\"34.0\" width=\"372.0\" height=\"96.0\" rx=\"6\" fill=\"#f7f9fc\" stroke=\"#bcc7d8\" stroke-width=\"1.5\" />\u003crect x=\"18.0\" y=\"52.0\" width=\"10.0\" height=\"60.0\" rx=\"1\" fill=\"#fff\" stroke=\"#3a4656\" stroke-width=\"2\" />\u003ctext x=\"32.0\" y=\"48.0\" font-size=\"10\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >시력표(모니터·스크린)\u003c/text>\u003ccircle cx=\"70.0\" cy=\"92.0\" r=\"13.0\" fill=\"#f6dcc6\" stroke=\"#3a4656\" stroke-width=\"1.5\" />\u003cellipse cx=\"80.0\" cy=\"92.0\" rx=\"3.0\" ry=\"2. /th>\u003cth>내용\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>무엇을 측정하나\u003c/td>\u003ctd>각막 반사점을 기준으로 단안 PD(원/근) 측정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사용 순서\u003c/td>\u003ctd>· 측정 거리(∞/40cm 등) 설정\u003cbr>· 고객이 내부 광점 주시, 커서를 각막 반사점에 정렬\u003cbr>· 2회 이상 측정, R/L 단안값 기록\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한계\u003c/td>\u003ctd>· 사시·주시 불량 시 부정확\u003cbr>· 아동은 협조도에 따라 오차\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주요 오차 원인\u003c/td>\u003ctd>· 코받침 위치 비대칭 → 단안값 오차\u003cbr>· 거리 설정 실수(원용을 근용으로 측정)\u003cbr>· 검사자 시차\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig6-8\">\u003csvg class=\"fig\" viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"PD 측정기(동공거리계)와 각막 반사점 정렬\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cpath d=\"M40,80 Q40,50 80,50 L220,50 Q260,50 260,80 L260,130 Q260,160 220,160 L80,160 Q40,160 40,130 Z\" stroke=\"#3a4656\" fill=\"#e9edf3\" stroke-width=\"2\" />\u003cpath d=\"M130,160 Q150,130 170,160\" stroke=\"#3a4656\" fill=\"#ddd\" stroke-width=\"2\" />\u003ccircle cx=\"100.0\" cy=\"100.0\" r=\"22.0\" fill=\"#2b3442\" stroke=\"#3a4656\" stroke-width=\"2\" />\u003ccircle cx=\"200.0\" cy=\"100.0\" r=\"22.0\" fill=\"#2b3442\" stroke=\"#3a4656\" stroke-width=\"2\" />\u003crect x=\"110.0\" y=\"60.0\" width=\"80.0\" height=\"22.0\" rx=\"4\" fill=\"#bfe3c0\" stroke=\"#3a4656\" stroke-width=\"1.5\" />\u003ctext x=\"150.0\" y=\"76.0\" font-size=\"10.5\" fill=\"#173\" text-anchor=\"middle\" font-weight=\"normal\" >R 32.0 L 31.5\u003c/text>\u003ccircle cx=\"150.0\" cy=\"140.0\" r=\"6.0\" fill=\"#e07b00\" stroke=\"#3a4656\" stroke-width=\"1\" />\u003ccircle cx=\"240.0\" cy=\"70.0\" r=\"7.0\" fill=\"#f3f3f3\" stroke=\"#3a4656\" stroke-width=\"1.5\" />\u003cline x1=\"150.0\" y1=\"62.0\" x2=\"118.0\" y2=\"32.0\" stroke=\"#1f3a5f\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"150.0\" cy=\"62.0\" r=\"2.2\" fill=\"#1f3a5f\" stroke=\"#1f3a5f\" stroke-width=\"1\" />\u003ctext x=\"11.3\" y=\"30.0\" font-size=\"11\" fill=\"#1f3a5f\" text-anchor=\"start\" font-weight=\"normal\" >표시창(단안 PD R/L)\u003c/text>\u003cline x1=\"150.0\" y1=\"150.0\" x2=\"58.0\" y2=\"196.0\" stroke=\"#1f3a5f\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"150.0\" cy=\"150.0\" r=\"2.2\" fill=\"#1f3a5f\" stroke=\"#1f3a5f\" stroke-width=\"1\" />\u003ctext x=\"26.7\" y=\"210.0\" font-size=\"11\" fill=\"#1f3a5f\" text-anchor=\"start\" font-weight=\"normal\" >코받침\u003c/text>\u003cline x1=\"240.0\" y1=\"70.0\" x2=\"291.3\" y2=\"42.0\" stroke=\"#1f3a5f\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"240.0\" cy=\"70.0\" r=\"2.2\" fill=\"#1f3a5f\" stroke=\"#1f3a5f\" stroke-width=\"1\" />\u003ctext x=\"291.3\" y=\"40.0\" font-size=\"11\" fill=\"#1f3a5f\" text-anchor=\"start\" font-weight=\"normal\" >거리 설정(∞/40 cm)\u003c/text>\u003cline x1=\"150.0\" y1=\"140.0\" x2=\"272.0\" y2=\"186.0\" stroke=\"#e07b00\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"150.0\" cy=\"140.0\" r=\"2.2\" fill=\"#e07b00\" stroke=\"#e07b00\" stroke-width=\"1\" />\u003ctext x=\"272.0\" y=\"200.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"normal\" >커서 조절\u003c/text>\u003ccircle cx=\"330.0\" cy=\"120.0\" r=\"40.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"330.0\" cy=\"120.0\" r=\"16.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003ccircle cx=\"333.0\" cy=\"116.0\" r=\"3.0\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\" />\u003cline x1=\"333.0\" y1=\"84.0\" x2=\"333.0\" y2=\"156.0\" stroke=\"#2fd0ff\" stroke-width=\"1.5\" />\u003ctext x=\"330.0\" y=\"176.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >커서를 각막\u003c/text>\u003ctext x=\"330.0\" y=\"190.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >반사점에 맞춤\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 6-8.\u003c/b> PD 측정기(동공거리계)와 각막 반사점 정렬\u003c/figcaption>\u003c/figure>"},{"id":"s6-9","title":"6.9 장비 일일·정기 점검표","html":"\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>(매일) 오토레프·포롭터·턱받침 소독, 렌즈 창 청소\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>(매일) 시표 밝기·초점, 시력표 거리 표시 확인\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>(매일) 렌즈미터 영점 확인\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>(주간) 시험렌즈 세트 누락·흠집 점검\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>(월간) 포롭터 수평·PD 눈금 점검\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>(정기) 제조사 권장 주기에 따른 교정(캘리브레이션) 기록\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>고장·이상값 발생 시 사용 중지 표시 후 원장 보고\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"}],"questions":[{"id":"g09-q1","question":"오토레프 측정 시 머리가 기울면 생기는 오차는?","choices":["구면 오차","난시 축 오차","PD 오차","ADD 오차"],"answer_index":1,"explanation":"기울임 → 축 오차.","page":"g09.html"},{"id":"g09-q2","question":"포롭터 결과를 시험테로 최종 확인하는 이유는?","choices":["더 빨라서","포롭터는 눈에서 멀고 경사각이 없어 실제 안경과 달라서","시험테가 더 정확한 렌즈라서","규정이라서"],"answer_index":1,"explanation":"실제 안경 조건에 가까운 시험테로 착용 테스트를 해요.","page":"g09.html"},{"id":"g09-q3","question":"좁은 매장에서 거울로 시력표를 볼 때 확인할 것은?","choices":["좌우 반전·광학적 거리 보정","조명 끄기","ADD 추가","PD 측정"],"answer_index":0,"explanation":"거울은 거리를 두 배로 만들고 좌우를 바꿔요.","page":"g09.html"}]},{"id":"g10","no":"7","title":"고객 응대 주의사항","page":"g10.html","intro":"","key_points":["설명 원칙: 결론 먼저 · 비유 하나 · 숫자는 필요할 때만 · 불안 주는 단어 피하기.","불편 호소: 조제 → 피팅 → 처방 순서로 점검, 기록.","진단명 단정·효과 보장 금지. 개인정보·민감정보는 별도 동의."],"sections":[{"id":"s7-1","title":"7.1 문진 질문 예시","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>목적\u003c/th>\u003cth>질문 예시\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>방문 이유\u003c/td>\u003ctd>&quot;오늘은 어떤 점이 불편하셔서 오셨어요?&quot; / &quot;먼 곳, 가까운 곳 중 어디가 더 불편하세요?&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시작·경과\u003c/td>\u003ctd>&quot;언제부터 그러셨어요? 서서히 그랬나요, 갑자기 그랬나요?&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>생활\u003c/td>\u003ctd>&quot;하루에 컴퓨터·휴대폰은 몇 시간 정도 보세요?&quot; / &quot;운전, 특히 밤 운전 하세요?&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>안경·렌즈 경험\u003c/td>\u003ctd>&quot;지금 안경은 언제 맞추셨어요? 쓰면서 불편한 점이 있었나요?&quot; / &quot;콘택트렌즈는 하루 몇 시간 끼세요?&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>병력\u003c/td>\u003ctd>&quot;눈 수술이나 안과 치료 받으신 적 있으세요?&quot; / &quot;당뇨나 혈압 약 등 드시는 약이 있으세요?&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>위험 신호\u003c/td>\u003ctd>&quot;눈이 아프거나 빨개진 적 있으세요?&quot; / &quot;번쩍이는 빛이나 날파리 같은 게 갑자기 많이 보이세요?&quot; / &quot;사물이 두 개로 보이거나 시야 일부가 가려 보이세요?&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기대\u003c/td>\u003ctd>&quot;새 안경으로 가장 잘 보고 싶은 게 뭐예요? (운전, 독서, 모니터 등)&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"s7-2","title":"7.2 설명 화법: 전문용어를 쉬운 말로","html":"\u003cp>고객은 디옵터나 축을 몰라도 됩니다. \u003cb>&#x27;무엇이 보이는지&#x27;와 &#x27;생활에서 무엇이 달라지는지&#x27;\u003c/b>로 설명합니다. 원칙: ① 결론 먼저 ② 비유 하나 ③ 숫자는 꼭 필요할 때만 ④ 불안을 주는 단어(예: &#x27;심하다&#x27;, &#x27;많이 나빠졌다&#x27;) 대신 사실 중심 표현.\u003c/p>\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>전문용어\u003c/th>\u003cth>쉬운 우리말 설명 (고객용)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>굴절이상\u003c/td>\u003ctd>눈이 초점을 정확히 못 맞추는 상태예요. 카메라 초점이 살짝 어긋난 것과 비슷해요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>근시\u003c/td>\u003ctd>가까운 건 잘 보이는데 먼 것이 흐린 눈이에요. 초점이 조금 앞쪽에 맺혀요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>원시\u003c/td>\u003ctd>초점이 뒤쪽에 맺혀서 눈이 계속 힘을 써야 하는 눈이에요. 그래서 가까운 걸 오래 보면 피곤할 수 있어요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>난시\u003c/td>\u003ctd>눈 앞면이 완전한 공 모양이 아니라 럭비공처럼 조금 갸름해서, 방향에 따라 선명도가 달라요. 글자가 겹치거나 번져 보일 수 있어요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>혼합난시\u003c/td>\u003ctd>한 방향은 근시, 다른 방향은 원시처럼 초점이 맺히는 난시예요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>노안\u003c/td>\u003ctd>나이가 들면서 눈 속 렌즈가 덜 말랑해져 가까운 곳에 초점을 맞추는 힘이 줄어드는 자연스러운 변화예요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>디옵터(D), 도수\u003c/td>\u003ctd>렌즈가 초점을 얼마나 바꾸는지 나타내는 단위예요. 숫자가 클수록 렌즈 힘이 커요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>구면도수(S)\u003c/td>\u003ctd>전체적으로 초점을 맞추는 기본 도수예요. 마이너스는 근시용, 플러스는 원시·돋보기용이에요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>원주도수(C)·축(Ax)\u003c/td>\u003ctd>난시를 바로잡는 도수와 그 방향이에요. 축은 &#x27;방향 각도&#x27;라서 숫자가 크다고 나쁜 게 아니에요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>가입도(ADD)\u003c/td>\u003ctd>가까운 곳 볼 때 더해 주는 돋보기 힘이에요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조절(력)\u003c/td>\u003ctd>가까운 곳을 볼 때 눈이 초점을 당겨 맞추는 힘이에요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사위\u003c/td>\u003ctd>두 눈이 쉬고 있을 때 살짝 벌어지거나 모이려는 경향이에요. 대부분 큰 문제는 아니지만 피로와 관련될 수 있어요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PD\u003c/td>\u003ctd>두 눈동자 사이 거리예요. 렌즈 중심을 눈동자 위치에 정확히 맞추려고 재요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>운무(fogging)\u003c/td>\u003ctd>일부러 살짝 흐리게 해서 눈의 긴장을 풀어 주는 과정이에요. 잠깐 흐린 건 정상이에요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>적록검사\u003c/td>\u003ctd>빨간색·초록색 바탕 글자를 비교해 도수가 너무 강하거나 약하지 않은지 확인하는 검사예요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>누진다초점\u003c/td>\u003ctd>한 렌즈 안에서 위는 먼 곳, 아래로 갈수록 가까운 곳이 보이도록 도수가 자연스럽게 바뀌는 렌즈예요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>정점간거리\u003c/td>\u003ctd>렌즈와 눈 사이 거리예요. 도수가 높을수록 이 거리에 따라 보이는 느낌이 달라져요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자동굴절검사(오토)\u003c/td>\u003ctd>기계로 눈의 대략적인 도수를 재는 검사예요. 시작점으로 쓰고, 직접 비교하는 검사로 최종 확인해요\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig7-1\">\u003csvg class=\"fig\" viewBox=\"0 0 380 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"고객 설명용 비유: 정상 각막(축구공) vs 난시 각막(럭비공)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003ccircle cx=\"95.0\" cy=\"95.0\" r=\"52.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2.5\" />\u003cline x1=\"43.0\" y1=\"95.0\" x2=\"147.0\" y2=\"95.0\" stroke=\"#cfd8e6\" stroke-width=\"1\" />\u003cline x1=\"50.0\" y1=\"69.0\" x2=\"140.0\" y2=\"121.0\" stroke=\"#cfd8e6\" stroke-width=\"1\" />\u003cline x1=\"69.0\" y1=\"50.0\" x2=\"121.0\" y2=\"140.0\" stroke=\"#cfd8e6\" stroke-width=\"1\" />\u003cline x1=\"95.0\" y1=\"43.0\" x2=\"95.0\" y2=\"147.0\" stroke=\"#cfd8e6\" stroke-width=\"1\" />\u003cline x1=\"121.0\" y1=\"50.0\" x2=\"69.0\" y2=\"140.0\" stroke=\"#cfd8e6\" stroke-width=\"1\" />\u003cline x1=\"140.0\" y1=\"69.0\" x2=\"50.0\" y2=\"121.0\" stroke=\"#cfd8e6\" stroke-width=\"1\" />\u003cellipse cx=\"285.0\" cy=\"95.0\" rx=\"78.0\" ry=\"44.0\" fill=\"#fff\" stroke=\"#e07b00\" stroke-width=\"2.5\" />\u003cpath d=\"M215,95 Q285,70 355,95\" stroke=\"#e07b00\" fill=\"none\" stroke-width=\"1\" />\u003cpath d=\"M215,95 Q285,120 355,95\" stroke=\"#e07b00\" fill=\"none\" stroke-width=\"1\" />\u003ctext x=\"95.0\" y=\"170.0\" font-size=\"12\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >축구공: 방향마다 같은 굴곡\u003c/text>\u003ctext x=\"285.0\" y=\"170.0\" font-size=\"12\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >럭비공: 방향마다 굴곡이 달라요\u003c/text>\u003ctext x=\"285.0\" y=\"24.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >→ 방향에 따라 선명도가 달라 번져 보임\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 7-1.\u003c/b> 고객 설명용 비유: 정상 각막(축구공) vs 난시 각막(럭비공)\u003c/figcaption>\u003c/figure>\u003ch3>상황별 설명 스크립트 예시\u003c/h3>\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>상황\u003c/th>\u003cth>스크립트 예시\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>검사 시작\u003c/td>\u003ctd>&quot;지금부터 먼 곳·가까운 곳이 가장 편하고 선명하게 보이는 도수를 찾아볼게요. 렌즈를 두 개씩 보여 드리면 더 선명한 쪽을 말씀해 주시고, 비슷하면 비슷하다고 하시면 돼요. 정답은 없으니 편하게 답해 주세요.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>운무 중 불안해할 때\u003c/td>\u003ctd>&quot;지금 일부러 살짝 흐리게 해 둔 거예요. 눈의 힘을 빼려는 과정이라 곧 다시 선명해져요.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>근시 도수가 올랐을 때\u003c/td>\u003ctd>&quot;먼 곳 초점이 지난번보다 조금 앞쪽에 맺혀서 도수를 조금 조정하면 잘 보이세요. 너무 강하게 하면 눈이 피곤하니까 가장 편하게 잘 보이는 정도로 맞췄어요.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>처음 난시 교정\u003c/td>\u003ctd>&quot;눈 앞면이 방향에 따라 굴곡이 조금 달라서 글자가 번져 보였던 거예요. 난시를 넣으면 또렷해지지만 처음 며칠은 바닥이 살짝 기울어 보이거나 어색할 수 있어요. 대부분 적응되시는데, 불편이 계속되면 꼭 다시 오세요.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>노안 설명\u003c/td>\u003ctd>&quot;40대 무렵부터 누구나 가까운 초점을 맞추는 힘이 서서히 줄어요. 병이 아니라 자연스러운 변화라서, 생활 거리에 맞는 렌즈로 편하게 보실 수 있어요.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>안과 안내\u003c/td>\u003ctd>&quot;검사해 보니 안경 도수만으로 설명되지 않는 부분이 있어요. 눈 건강 확인은 안과에서 하셔야 정확하니, 안경 맞추시기 전에 안과 진료를 먼저 받아 보시길 권해 드려요. 진료 후 오시면 바로 도와드릴게요.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>오토 값을 물을 때\u003c/td>\u003ctd>&quot;기계 값은 시작점이에요. 기계는 눈에 힘이 들어간 상태로 재기도 해서, 직접 비교하는 검사로 실제 편한 도수를 찾았어요.&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"box err\">\u003cb>하지 말아야 할 말\u003c/b>\u003cul>\u003cli>&quot;녹내장 같아요&quot;, &quot;백내장이에요&quot; 등 진단명 단정 (진단은 의사 영역)\u003c/li>\u003cli>&quot;이 안경 쓰면 근시가 멈춰요/좋아져요&quot; 등 효과 보장·과장성 발언\u003c/li>\u003cli>&quot;이 정도는 그냥 쓰셔도 돼요&quot;라며 위험 신호를 무시\u003c/li>\u003cli>다른 고객의 검사 결과·개인정보 언급\u003c/li>\u003c/ul>\u003c/div>"},{"id":"s7-3","title":"7.3 불편 호소 대응 (새 안경 착용 후)","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>호소\u003c/th>\u003cth>가능한 원인\u003c/th>\u003cth>확인·대응\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>어지럽다, 바닥이 기울어 보인다\u003c/td>\u003ctd>원주도수·축 변화, 사난시, 첫 난시 교정, 정점간거리·경사각 변화\u003c/td>\u003ctd>렌즈미터로 처방대로 조제됐는지 확인 → 피팅 확인 → 축 재확인 → 필요 시 원주 감량(구면등가 유지)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>먼 곳은 잘 보이는데 눈이 아프고 피곤하다\u003c/td>\u003ctd>과마이너스(과교정), 근거리 조절 부담\u003c/td>\u003ctd>MPMVA·적록 재검, 구면 +0.25D 비교\u003c/td>\u003c/tr>\u003ctr>\u003ctd>가까운 글씨가 흐리다\u003c/td>\u003ctd>가입도 부족, 근용 PD 불일치, 누진 피팅 높이 부적합, 과마이너스\u003c/td>\u003ctd>ADD·작업거리·피팅 높이 확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한쪽만 흐리다\u003c/td>\u003ctd>조제 오류(좌우 바뀜), 축 오류, 광학중심 이탈\u003c/td>\u003ctd>렌즈미터로 좌우 확인 → 재조제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사물이 겹쳐 보인다\u003c/td>\u003ctd>PD·광학중심 오류에 의한 프리즘, 사위 보상 실패, 새로운 복시\u003c/td>\u003ctd>PD·광학중심 확인. 안경을 벗어도 겹치거나 갑자기 생겼으면 안과 의뢰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>누진 렌즈 옆이 흐리다\u003c/td>\u003ctd>누진 렌즈 구조상 주변부 수차\u003c/td>\u003ctd>고개를 돌려 보는 사용법 교육, 피팅 확인, 설계 변경 상담\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig7-2\">\u003csvg class=\"fig\" viewBox=\"0 0 360 258\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"새 안경 불편 호소 점검 순서\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g441f3a5f\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f3a5f\"/>\u003c/marker>\u003c/defs>\u003crect x=\"14.0\" y=\"8.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"28.0\" font-size=\"14\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >① 조제 확인\u003c/text>\u003ctext x=\"180.0\" y=\"45.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >렌즈미터: 도수·축·좌우·광학중심\u003c/text>\u003cline x1=\"180.0\" y1=\"54.0\" x2=\"180.0\" y2=\"68.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g441f3a5f)\" />\u003crect x=\"14.0\" y=\"70.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"90.0\" font-size=\"14\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >② 피팅 확인\u003c/text>\u003ctext x=\"180.0\" y=\"107.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >정점간거리·경사각·높이·코받침\u003c/text>\u003cline x1=\"180.0\" y1=\"116.0\" x2=\"180.0\" y2=\"130.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g441f3a5f)\" />\u003crect x=\"14.0\" y=\"132.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"152.0\" font-size=\"14\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >③ 처방 재확인\u003c/text>\u003ctext x=\"180.0\" y=\"169.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >MPMVA·적록·축·원주량\u003c/text>\u003cline x1=\"180.0\" y1=\"178.0\" x2=\"180.0\" y2=\"192.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g441f3a5f)\" />\u003crect x=\"14.0\" y=\"194.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#e6f6ea\" stroke=\"#1b7a43\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"214.0\" font-size=\"14\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >기록·재방문 예약\u003c/text>\u003ctext x=\"180.0\" y=\"231.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >적응 기간 안내(예: 1~2주)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 7-2.\u003c/b> 새 안경 불편 호소 점검 순서\u003c/figcaption>\u003c/figure>\u003cdiv class=\"box must\">\u003cb>원칙:\u003c/b> 불편 호소 시 &#x27;적응하세요&#x27;로 끝내지 말고 ① 조제 확인 ② 피팅 확인 ③ 처방 재확인 순서로 점검하고 기록을 남깁니다. 적응 안내 기간(예: 1~2주)은 매장 정책으로 정하고 재방문 예약을 잡습니다.\u003c/div>\u003cp class=\"link1\">🔗 \u003ca href=\"#c/g16\">새로 추가한 13장 &#x27;완성 안경 불편사항 대응&#x27;에서 증상별 원인·점검표를 자세히\u003c/a>에서 볼 수 있어요.\u003c/p>"},{"id":"s7-4","title":"7.4 안과 의뢰 기준","html":"\u003cp>안경사는 질환을 진단하지 않습니다. 아래 신호가 있으면 굴절 교정보다 \u003cb>안과 진료 안내를 우선\u003c/b>합니다. 아래 표는 영국 College of Optometrists의 의뢰 긴급도 표·응급 지침을 참고해 안경원 실무용으로 단순화한 \u003cb>내부 기준 예시\u003c/b>이며, 최종 판단은 원장(안경사)이 합니다. (한국 의료기사법에 안경사의 의뢰 의무 조항이 따로 있는 것은 아니며, 이는 업무범위와 고객 안전을 위한 직업적 기준입니다.)\u003c/p>\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>신호\u003c/th>\u003cth>안내 수준(예시)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>급격한 시력저하\u003c/td>\u003ctd>갑자기(수 시간~수일 내) 한쪽 또는 양쪽이 안 보임, 시야 일부가 커튼처럼 가림\u003c/td>\u003ctd>즉시 안과(야간·휴일은 응급실) 안내\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통증\u003c/td>\u003ctd>눈 통증, 특히 두통·구역·구토 동반, 눈 움직일 때 통증\u003c/td>\u003ctd>즉시 안과 안내\u003c/td>\u003c/tr>\u003ctr>\u003ctd>충혈\u003c/td>\u003ctd>심한 충혈, 눈부심·분비물 동반, 콘택트렌즈 착용 중 충혈·통증\u003c/td>\u003ctd>렌즈 착용 중단 안내 + 당일 안과 안내\u003c/td>\u003c/tr>\u003ctr>\u003ctd>섬광·비문증\u003c/td>\u003ctd>새로 생긴 번쩍임, 날파리(비문)가 갑자기 많아짐, 시야 가림 동반\u003c/td>\u003ctd>당일(늦어도 24시간 내) 안과 안내 (망막 열공·박리 가능성)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>복시·눈 움직임\u003c/td>\u003ctd>새로 생긴 겹쳐 보임, 갑작스러운 사시·눈꺼풀 처짐\u003c/td>\u003ctd>당일 안과 안내\u003c/td>\u003c/tr>\u003ctr>\u003ctd>교정시력 미달\u003c/td>\u003ctd>최대 교정해도 기대 시력에 못 미침(예: 매장 기준 0.8 미만 또는 좌우 차이 2줄 이상), 핀홀로도 개선 없음\u003c/td>\u003ctd>안과 진료 권유 후 처방\u003c/td>\u003c/tr>\u003ctr>\u003ctd>측정 이상\u003c/td>\u003ctd>오토레프/케라토 값이 매우 불규칙, 마이어 왜곡, 빠른 난시 증가(원추각막 의심)\u003c/td>\u003ctd>안과 진료 권유\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기타\u003c/td>\u003ctd>변시증(직선이 휘어 보임), 외상, 화학물질 노출, 6세 이하 아동 처방\u003c/td>\u003ctd>외상·화학물질은 즉시(화학물질은 흐르는 물로 충분히 세척 후). 6세 이하는 의사 처방 필요\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig7-3\">\u003csvg class=\"fig\" viewBox=\"0 0 380 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"안과 의뢰 긴급도(내부 기준 예시)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003ccircle cx=\"40.0\" cy=\"44.0\" r=\"22.0\" fill=\"#c0392b\" stroke=\"#333\" stroke-width=\"1.5\" />\u003ctext x=\"76.0\" y=\"36.0\" font-size=\"13.5\" fill=\"#c0392b\" text-anchor=\"start\" font-weight=\"bold\" >즉시\u003c/text>\u003ctext x=\"76.0\" y=\"56.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >• 급격한 시력저하·커튼 가림\u003c/text>\u003ctext x=\"76.0\" y=\"72.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >• 눈 통증(두통·구토)\u003c/text>\u003ctext x=\"76.0\" y=\"88.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >• 외상·화학물질\u003c/text>\u003ccircle cx=\"40.0\" cy=\"132.0\" r=\"22.0\" fill=\"#e07b00\" stroke=\"#333\" stroke-width=\"1.5\" />\u003ctext x=\"76.0\" y=\"124.0\" font-size=\"13.5\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"bold\" >당일(24시간 내)\u003c/text>\u003ctext x=\"76.0\" y=\"144.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >• 새 섬광·비문증\u003c/text>\u003ctext x=\"76.0\" y=\"160.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >• 새 복시·사시·눈꺼풀 처짐\u003c/text>\u003ctext x=\"76.0\" y=\"176.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >• CL 중 충혈·통증\u003c/text>\u003ccircle cx=\"40.0\" cy=\"220.0\" r=\"22.0\" fill=\"#d4a400\" stroke=\"#333\" stroke-width=\"1.5\" />\u003ctext x=\"76.0\" y=\"212.0\" font-size=\"13.5\" fill=\"#9a7a00\" text-anchor=\"start\" font-weight=\"bold\" >진료 권유 후 처방\u003c/text>\u003ctext x=\"76.0\" y=\"232.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >• 교정시력 미달·핀홀 무개선\u003c/text>\u003ctext x=\"76.0\" y=\"248.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >• 불규칙 측정·마이어 왜곡\u003c/text>\u003ctext x=\"76.0\" y=\"264.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >• 변시증\u003c/text>\u003ctext x=\"190.0\" y=\"292.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >최종 판단은 원장(안경사). 기록: 측정값·증상·안내 내용·긴급도\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 7-3.\u003c/b> 안과 의뢰 긴급도(내부 기준 예시)\u003c/figcaption>\u003c/figure>\u003cp>의뢰 시 고객에게 긴급도를 분명히 전달하고, 측정값·증상·안내 내용을 기록합니다(College of Optometrists 의뢰 지침: 의뢰 사유와 긴급도를 환자가 이해하도록 할 것).\u003c/p>"},{"id":"s7-5","title":"7.5 법적 업무범위 (2026-11-09 기준 확인)","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>근거\u003c/th>\u003cth>내용 (요지)\u003c/th>\u003cth>현장 의미\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>의료기사법 제1조의2 제3호 (2025.12.30 개정, 2026.7.1 시행)\u003c/td>\u003ctd>안경사 = 안경 조제·판매, 콘택트렌즈 판매, 안경·콘택트렌즈 도수 조정을 위한 약제를 사용하지 아니하는 굴절검사의 시행을 주된 업무로 하는 사람\u003c/td>\u003ctd>굴절검사가 법률상 안경사 업무로 명시됨. 구체 범위는 시행령에 따름\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시행령 제2조 [별표 1] 제8호\u003c/td>\u003ctd>① 안경 조제·판매(6세 이하 아동 안경은 의사 처방에 따라) ② 콘택트렌즈 판매(6세 이하는 의사 처방) ③ 약제 미사용 자각적 굴절검사 ④ 약제 미사용 타각적 굴절검사 중 자동굴절검사기기를 이용한 검사 ⑤ 그 밖의 관련 업무\u003c/td>\u003ctd>검영기 등 자동굴절검사기 외 타각적 검사, 산동·조절마비 약제 사용 불가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>제9조\u003c/td>\u003ctd>의료기사등이 아니면 그 업무를 하지 못함, 면허 대여 금지\u003c/td>\u003ctd>비면허 직원의 굴절검사·조제 금지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>제10조\u003c/td>\u003ctd>업무상 알게 된 비밀 누설 금지\u003c/td>\u003ctd>고객 검사 결과·건강정보 비밀 유지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>제12조\u003c/td>\u003ctd>안경사만 안경업소 개설(1개소), 안경·콘택트렌즈는 안경업소에서만 판매, 전자상거래·통신판매 금지, 콘택트렌즈 판매 시 사용방법·유통기한·부작용 정보 제공 의무\u003c/td>\u003ctd>위탁 운영 시에도 개설 안경사 명의·책임 구조 준수\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"note\">※ 2026년 9월 보도 기준 대한안경사협회는 시행령의 타각적 굴절검사 제한 완화를 요구하고 있으나, 본 교재 작성 시점에 확인된 현행 시행령은 위와 같습니다. 개정 여부를 주기적으로 확인하십시오.\u003c/p>"},{"id":"s7-6","title":"7.6 개인정보 보호","html":"\u003cul>\u003cli>고객 성명·연락처 등 개인정보와 \u003cb>건강 관련 정보(검사 결과, 병력)\u003c/b>를 다룹니다. 건강 정보는 「개인정보 보호법」상 \u003cb>민감정보\u003c/b>(제23조)에 해당하므로 별도 동의 등 법정 요건을 지켜야 합니다.\u003c/li>\u003cli>수집 최소화: 처방·사후관리에 필요한 항목만 수집. 목적·항목·보유기간을 동의서에 명시.\u003c/li>\u003cli>보관: 종이 기록지는 잠금 보관, 전산은 계정별 접근권한·비밀번호, 화면 노출 주의(대기 고객이 보지 않도록).\u003c/li>\u003cli>파기: 보유기간 경과 시 지체 없이 파기(분쇄·영구삭제).\u003c/li>\u003cli>마케팅 활용(문자·이벤트 안내)은 \u003cb>별도 동의\u003c/b>를 받은 고객에게만. 위탁 운영·마케팅 담당자도 동의 범위 밖 활용 금지.\u003c/li>\u003cli>전화 문의 시 본인 확인 후 정보 제공. 가족이라도 본인 동의 없이 검사 결과 제공 자제.\u003c/li>\u003cli>SNS·후기 이벤트에 고객 얼굴·처방이 노출되지 않도록 사전 동의 필수.\u003c/li>\u003cli>의료기사법 제10조(비밀누설 금지)도 함께 적용됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>개인정보 수집·이용 동의서와 민감정보 별도 동의 양식을 비치했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>마케팅 수신 동의를 분리해 받았다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>기록지 잠금 보관·전산 접근권한을 설정했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>보유기간·파기 절차를 문서화했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>직원 개인정보 교육을 정기적으로 실시했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"}],"questions":[{"id":"g10-q1","question":"고객에게 하지 말아야 할 말은?","choices":["지금 일부러 살짝 흐리게 해 둔 거예요","녹내장 같아요","1~2주 써 보시고 불편하면 오세요","가장 편하게 잘 보이는 정도로 맞췄어요"],"answer_index":1,"explanation":"진단명 단정은 의사 영역이에요.","page":"g10.html"},{"id":"g10-q2","question":"새 안경이 어지럽다는 고객, 첫 점검은?","choices":["바로 원주 감량","렌즈미터로 조제 확인","적응하라고 안내","새 테 추천"],"answer_index":1,"explanation":"조제 → 피팅 → 처방 순서.","page":"g10.html"},{"id":"g10-q3","question":"마케팅 문자에 검사 결과를 써도 되나요?","choices":["동의 없이도 된다","민감정보라 동의 범위 밖 활용 금지","원장이 허락하면 된다","이름만 빼면 된다"],"answer_index":1,"explanation":"건강정보는 민감정보(개인정보 보호법 제23조).","page":"g10.html"}]},{"id":"g11","no":"8","title":"교육용 가상 사례","page":"g11.html","intro":"\u003cdiv class=\"box bg\">\u003cb>사례 고지\u003c/b>\u003cul>\u003cli>아래 사례는 교육을 위해 여러 전형적 상황을 조합해 새로 구성한 가상의 복합 사례입니다. 실제 고객 기록이 아니며, 실제 개인정보를 포함하지 않습니다. 수치는 설명용 예시입니다.\u003c/li>\u003c/ul>\u003c/div>","key_points":["오토레프 값을 그대로 쓰면 젊은 근시는 과마이너스.","첫 난시 교정의 왜곡은 SE를 유지하며 원주를 줄여 해결.","ADD는 작업거리·조절력에 맞춰 필요한 만큼."],"sections":[{"id":"s8-1","title":"사례 1. 진행성 근시가 의심되는 청소년 (가상 '학생 A', 14세)","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>단계\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>방문 사유\u003c/td>\u003ctd>&quot;칠판 글씨가 다시 흐려요.&quot; 1년 전 맞춘 안경 사용. 보호자 동반\u003c/td>\u003c/tr>\u003ctr>\u003ctd>문진\u003c/td>\u003ctd>하루 근거리 학습·스마트폰 사용 시간이 길고, 실외활동이 적다고 함. 부모 모두 안경 착용. 통증·충혈·섬광 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기존 안경\u003c/td>\u003ctd>R −2.00 C −0.50 × 180 / L −2.25 (렌즈미터)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시력\u003c/td>\u003ctd>기존 안경 착용 R 0.6, L 0.6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>오토레프\u003c/td>\u003ctd>R −3.25 C −0.50 × 178 / L −3.50 C −0.25 × 5 (3회 값 변동 큼: 조절 개입 의심)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자각 검사\u003c/td>\u003ctd>운무 후 MPMVA: R −2.75 C −0.50 × 180 (1.0), L −2.75 (1.0). 적록: 양안 &#x27;같음&#x27;. 양안균형 후 양안 1.0. −0.25D 추가 시 &#x27;더 진함&#x27;이라 답했으나 읽는 줄은 늘지 않음 → 추가하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판단\u003c/td>\u003ctd>오토레프보다 약 0.50D 적은 값에서 최고 시력 → 기계 근시/조절 개입 가능성. 1년 사이 약 0.50~0.75D 변화\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상담\u003c/td>\u003ctd>&quot;먼 곳 초점이 지난번보다 조금 앞으로 와서 도수를 조정하면 잘 보여요. 성장기에는 근시가 바뀌는 경우가 있어서 안과에서 정밀 검사(필요하면 눈의 긴장을 푸는 약을 쓰는 검사)와 근시 관리 상담을 받아 보시는 걸 권해 드려요. 6개월~1년마다 다시 확인하면 좋아요.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>처방·후속\u003c/td>\u003ctd>R −2.75 C −0.50 × 180 / L −2.75. 착용 테스트 이상 없음. 근시 진행 관리 방법(약물·특수렌즈 등)은 안과 상담 안내. 재검 시기 기록\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig8-1\">\u003csvg class=\"fig\" viewBox=\"0 0 380 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"사례 1: 오른눈 구면(SE) 비교 – 오토레프 값을 그대로 쓰면 과마이너스\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003ctext x=\"102.0\" y=\"52.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"end\" font-weight=\"normal\" >기존 안경\u003c/text>\u003crect x=\"110.0\" y=\"34.0\" width=\"112.5\" height=\"26.0\" rx=\"4\" fill=\"#666\" stroke=\"#666\" stroke-width=\"0\" fill-opacity=\".75\"/>\u003ctext x=\"228.5\" y=\"52.0\" font-size=\"11.5\" fill=\"#666\" text-anchor=\"start\" font-weight=\"normal\" >SE −2.25 D\u003c/text>\u003ctext x=\"102.0\" y=\"96.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"end\" font-weight=\"normal\" >오토레프\u003c/text>\u003crect x=\"110.0\" y=\"78.0\" width=\"175.0\" height=\"26.0\" rx=\"4\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"0\" fill-opacity=\".75\"/>\u003ctext x=\"291.0\" y=\"96.0\" font-size=\"11.5\" fill=\"#c0392b\" text-anchor=\"start\" font-weight=\"normal\" >SE −3.50 D\u003c/text>\u003ctext x=\"102.0\" y=\"140.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"end\" font-weight=\"normal\" >최종(MPMVA)\u003c/text>\u003crect x=\"110.0\" y=\"122.0\" width=\"150.0\" height=\"26.0\" rx=\"4\" fill=\"#1b7a43\" stroke=\"#1b7a43\" stroke-width=\"0\" fill-opacity=\".75\"/>\u003ctext x=\"266.0\" y=\"140.0\" font-size=\"11.5\" fill=\"#1b7a43\" text-anchor=\"start\" font-weight=\"normal\" >SE −3.00 D\u003c/text>\u003ctext x=\"190.0\" y=\"184.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >SE = S + C/2 · 오토레프보다 약 0.50 D 적은 값에서 최고 시력\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 8-1.\u003c/b> 사례 1: 오른눈 구면(SE) 비교 – 오토레프 값을 그대로 쓰면 과마이너스\u003c/figcaption>\u003c/figure>\u003ch4 class=\"lbl\">교육 포인트\u003c/h4>\u003cul>\u003cli>오토레프 값을 그대로 쓰면 과마이너스가 됨(젊을수록 주의).\u003c/li>\u003cli>&#x27;더 진하다&#x27; ≠ &#x27;더 잘 읽는다&#x27;. 과마이너스 방지 질문을 사용.\u003c/li>\u003cli>근시 진행 억제 &#x27;치료&#x27;는 의료 영역 → 효과를 보장하는 표현 없이 안과 상담 안내.\u003c/li>\u003cli>6세 이하였다면 의사 처방에 따라야 함.\u003c/li>\u003c/ul>"},{"id":"s8-2","title":"사례 2. 난시 교정 후 적응 문제 (가상 '고객 B', 34세 사무직)","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>단계\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>방문 사유\u003c/td>\u003ctd>모니터 글씨 번짐, 오후 눈 피로. 기존 안경: R −1.00 / L −1.25 (난시 미교정)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>오토레프·케라토\u003c/td>\u003ctd>R −1.50 C −1.50 × 20 / L −1.75 C −1.25 × 160. 각막난시와 축이 비슷하고 마이어 규칙적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자각 검사\u003c/td>\u003ctd>JCC: R −1.25 C −1.50 × 20 (1.0), L −1.50 C −1.25 × 160 (1.0) → 복합 근시성 난시, 사난시(축 20°/160°는 직난시 범위 경계 근처). 양안균형 정상\u003c/td>\u003c/tr>\u003ctr>\u003ctd>착용 테스트 1\u003c/td>\u003ctd>전체 교정으로 보행 시 &quot;바닥이 기울고 어지럽다&quot; 호소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조정\u003c/td>\u003ctd>구면등가를 유지하며 원주를 일부 감량: R −1.50 C −1.00 × 20 (SE −2.00 유지), L −1.75 C −0.75 × 160 (SE −2.13 유지) → 시력 R/L 0.9~1.0, 어지러움 크게 감소. 시험테 정점간거리·경사각을 실제 안경테에 맞춰 재확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상담\u003c/td>\u003ctd>&quot;난시를 처음 교정하면 공간이 조금 다르게 느껴질 수 있어요. 이번에는 편하게 적응하실 수 있는 양으로 넣었고, 적응되면 다음 검사 때 더 선명하게 조정할 수 있어요. 1~2주 써 보시고 불편하면 언제든 오세요.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사후\u003c/td>\u003ctd>2주 후 재방문: 적응 양호, 모니터 번짐 개선. 기록에 &#x27;부분 교정, 추후 증량 검토&#x27; 메모\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig8-2\">\u003csvg class=\"fig\" viewBox=\"0 0 380 206\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"사례 2: 구면등가를 유지하며 원주를 줄이기(오른눈)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g471b7a43\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1b7a43\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"33.6\" y1=\"130.5\" x2=\"146.4\" y2=\"89.5\" stroke=\"#2a6fdb\" stroke-width=\"3\" />\u003cline x1=\"107.1\" y1=\"157.0\" x2=\"72.9\" y2=\"63.0\" stroke=\"#c0392b\" stroke-width=\"3\" />\u003ctext x=\"150.1\" y=\"84.1\" font-size=\"10.5\" fill=\"#2a6fdb\" text-anchor=\"start\" font-weight=\"normal\" >−1.25\u003c/text>\u003ctext x=\"71.5\" y=\"53.3\" font-size=\"10.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >−2.75\u003c/text>\u003ctext x=\"90.0\" y=\"30.0\" font-size=\"12\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >전체 교정 −1.25 −1.50×20\u003c/text>\u003ctext x=\"90.0\" y=\"184.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >SE −2.00 D\u003c/text>\u003cline x1=\"223.6\" y1=\"130.5\" x2=\"336.4\" y2=\"89.5\" stroke=\"#2a6fdb\" stroke-width=\"3\" />\u003cline x1=\"297.1\" y1=\"157.0\" x2=\"262.9\" y2=\"63.0\" stroke=\"#c0392b\" stroke-width=\"3\" />\u003ctext x=\"340.1\" y=\"84.1\" font-size=\"10.5\" fill=\"#2a6fdb\" text-anchor=\"start\" font-weight=\"normal\" >−1.50\u003c/text>\u003ctext x=\"261.5\" y=\"53.3\" font-size=\"10.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >−2.50\u003c/text>\u003ctext x=\"280.0\" y=\"30.0\" font-size=\"12\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >조정 −1.50 −1.00×20\u003c/text>\u003ctext x=\"280.0\" y=\"184.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >SE −2.00 D\u003c/text>\u003cline x1=\"176.0\" y1=\"110.0\" x2=\"206.0\" y2=\"110.0\" stroke=\"#1b7a43\" stroke-width=\"2\" marker-end=\"url(#g471b7a43)\" />\u003ctext x=\"190.0\" y=\"198.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >파랑 = 20° 경선(S), 빨강 = 110° 경선(S+C)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 8-2.\u003c/b> 사례 2: 구면등가를 유지하며 원주를 줄이기(오른눈)\u003c/figcaption>\u003c/figure>\u003ch4 class=\"lbl\">교육 포인트\u003c/h4>\u003cul>\u003cli>첫 난시 교정·사난시·높은 원주는 경선별 배율 차이로 공간 왜곡을 일으킬 수 있음.\u003c/li>\u003cli>원주 감량 시 \u003cb>구면등가 유지\u003c/b>가 핵심(원주 +0.50D 감량마다 구면 −0.25D).\u003c/li>\u003cli>불편 호소 시 조제 → 피팅 → 처방 순서로 점검.\u003c/li>\u003cli>각막 측정이 불규칙했다면(원추각막 의심) 안경 조정 대신 안과 의뢰가 먼저.\u003c/li>\u003c/ul>"},{"id":"s8-3","title":"사례 3. 노안 시작 (가상 '고객 C', 44세)","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>단계\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>방문 사유\u003c/td>\u003ctd>&quot;휴대폰 글씨를 멀리 떼어야 보여요. 저녁에 더 심해요.&quot; 원거리 불편 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>문진\u003c/td>\u003ctd>하루 스마트폰·서류 작업 많음. 휴대폰 거리 약 35~40cm. 당뇨 등 질환 없음, 위험 신호 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>원거리 굴절\u003c/td>\u003ctd>R +0.50 / L +0.50 (1.0), 양안균형 정상 → 경도 원시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조절력\u003c/td>\u003ctd>원용 교정 상태 푸시업: 근점 약 33cm → 조절력 약 3.0D. Hofstetter 최소(15 − 0.25×44) = 4.0D 보다 낮음 → 노안 시작에 부합\u003c/td>\u003c/tr>\u003ctr>\u003ctd>가입도 계산\u003c/td>\u003ctd>작업거리 40cm → 필요 2.50D. 조절력 절반(1.50D)을 여유로 → ADD = 2.50 − 1.50 = +1.00D (근용 합계 R/L +1.50)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>착용 테스트\u003c/td>\u003ctd>+1.00 ADD로 휴대폰·서류 선명, 선명 범위 약 30~60cm 내외 확인. +1.50 ADD 비교 시 &#x27;너무 가까이 봐야 한다&#x27;고 하여 +1.00 선택\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상담\u003c/td>\u003ctd>&quot;나이가 들면 누구나 가까운 초점을 맞추는 힘이 줄어요. 지금은 시작 단계라 약한 도수로 편하게 보실 수 있어요. 원거리도 약간 원시가 있어서, 생활 패턴에 따라 누진다초점이나 근거리 전용 안경을 고르실 수 있어요. 40대 이후에는 안과 정기 검진도 함께 받으시길 권해 드려요.&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>처방·후속\u003c/td>\u003ctd>용도 상담 후 렌즈 선택. 누진 선택 시 피팅 높이 측정. 1~2년 후 ADD 재평가 안내\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 class=\"lbl\">교육 포인트\u003c/h4>\u003cul>\u003cli>ADD는 &#x27;강할수록 좋은 것&#x27;이 아니라 작업거리·조절력에 맞춘 &#x27;필요한 만큼&#x27;.\u003c/li>\u003cli>원시가 있으면 노안 증상을 더 일찍 느낄 수 있음.\u003c/li>\u003cli>노안 상담은 안과 정기 검진 권유와 함께.\u003c/li>\u003c/ul>"}],"questions":[{"id":"g11-q1","question":"사례 1에서 오토레프보다 약한 도수가 최종이 된 이유는?","choices":["기계 고장","조절 개입(기계 근시)","난시 때문","PD 오류"],"answer_index":1,"explanation":"젊은 층은 조절이 개입해 오토레프가 근시 쪽으로 나와요.","page":"g11.html"},{"id":"g11-q2","question":"사례 2에서 원주를 0.50 D 줄일 때 구면은?","choices":["+0.25 D","−0.25 D","그대로","−0.50 D"],"answer_index":1,"explanation":"원주 +0.50 감량마다 구면 −0.25로 SE 유지.","page":"g11.html"},{"id":"g11-q3","question":"사례 3에서 +1.50 ADD 대신 +1.00을 고른 이유는?","choices":["가격","+1.50은 너무 가까이 봐야 해서","시력이 더 좋아서","나이표 때문"],"answer_index":1,"explanation":"ADD가 크면 선명 범위가 가까워져요.","page":"g11.html"}]},{"id":"g12","no":"9","title":"자주 하는 실수와 Q&A","page":"g12.html","intro":"","key_points":["실수 TOP 12는 대부분 '조절 개입'과 '순서 생략'에서 생긴다.","질문은 중립적으로, 단계 크기를 키워(0.50 D) 비교하는 방법도 있다.","6세 이하는 의사 처방 필요."],"sections":[{"id":"s9-1","title":"9.1 자주 하는 실수 TOP 12","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>실수\u003c/th>\u003cth>왜 문제인가\u003c/th>\u003cth>예방법\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>오토레프 값을 그대로 처방\u003c/td>\u003ctd>조절 개입으로 과마이너스 → 피로·두통\u003c/td>\u003ctd>자각 검사로 반드시 확인, MPMVA 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>마이너스를 &#x27;더 진하다&#x27;는 말에 추가\u003c/td>\u003ctd>읽는 줄은 그대로인데 과교정\u003c/td>\u003ctd>&#x27;한 줄 더 읽는가&#x27; 확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>운무 없이 바로 마이너스 쪽부터\u003c/td>\u003ctd>조절이 개입된 채 종료\u003c/td>\u003ctd>플러스 쪽에서 접근\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>JCC에서 축보다 도수 먼저\u003c/td>\u003ctd>축이 틀리면 도수가 정확히 안 나옴\u003c/td>\u003ctd>축 → 도수 순서\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>원주 변경 시 구면등가 미보정\u003c/td>\u003ctd>최소착란원 이탈로 비교 왜곡\u003c/td>\u003ctd>−0.50 C당 +0.25 S\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>적록검사에서 &#x27;선명한 쪽&#x27; 질문\u003c/td>\u003ctd>해석 혼동\u003c/td>\u003ctd>&#x27;검고 진한 쪽&#x27; 질문\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>운무 없이 양안균형\u003c/td>\u003ctd>우세안이 지배 → 비우세안 과마이너스\u003c/td>\u003ctd>+0.75D 운무 후 균형\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>PD 대충 측정\u003c/td>\u003ctd>고도수에서 프리즘 유발\u003c/td>\u003ctd>단안 PD 2회 측정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>포롭터 값만 보고 처방\u003c/td>\u003ctd>실제 안경 조건과 다름\u003c/td>\u003ctd>시험테 착용·보행 테스트\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>교정시력 미달을 &#x27;적응 문제&#x27;로 넘김\u003c/td>\u003ctd>질환 놓칠 위험\u003c/td>\u003ctd>핀홀 확인·안과 의뢰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>11\u003c/td>\u003ctd>ADD 과다 처방\u003c/td>\u003ctd>선명 범위가 너무 가까움\u003c/td>\u003ctd>작업거리 실측, 범위 확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>비면허 직원이 굴절검사 진행\u003c/td>\u003ctd>법 위반(의료기사법 제9조)\u003c/td>\u003ctd>업무 분장표 준수\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"s9-2","title":"9.2 Q&A","html":"\u003cdetails class=\"qa\">\u003csummary>Q. 근시·원시·난시는 각각 다른 검사를 하나요?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 아닙니다. 하나의 굴절검사(오토레프 + 자각적 검사)로 S·C·Ax 값을 얻고, 부호와 크기로 판정합니다(4장).\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 오토레프 값과 최종 처방이 다른 건 잘못된 건가요?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 아닙니다. 오토레프는 시작값이며 조절 개입·정렬 등으로 차이가 납니다. 특히 젊은 층은 오토레프가 더 근시 쪽으로 나오는 경향이 있습니다.\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 난시가 −0.50D 정도로 작으면 꼭 넣어야 하나요?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 시력 개선·증상·기존 안경과 비교해 결정합니다. 기존 안경에 없던 작은 난시는 착용 테스트로 이득이 확인될 때 넣는 것이 일반적인 접근입니다(원장 기준에 따름).\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 고객이 &#x27;1번, 2번 다 똑같아요&#x27;만 반복하면?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 차이가 판별 한계 아래일 수 있습니다. 단계 크기를 0.50D로 키워 비교하거나, 현재 값을 유지하고 다음 단계로 진행합니다. 피로가 보이면 휴식.\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 적록검사에서 계속 빨강이 진하다고 하면?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 빨강이 진하면 마이너스 방향이 필요하다는 의미지만, 과마이너스 위험이 있으므로 MPMVA(시력이 실제로 좋아지는가)를 우선합니다. 고령자는 수정체 변화로 반응이 다를 수 있습니다.\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 6세 아이가 왔는데 오토레프만 재서 안경 맞춰도 되나요?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 안 됩니다. 6세 이하 아동의 안경·콘택트렌즈는 의사 처방에 따라 조제·판매해야 합니다. 안과 처방전을 안내하십시오.\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 검영기로 검사해 달라는 요청이 있으면?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 현행 시행령상 안경사의 타각적 굴절검사는 자동굴절검사기기 이용 검사로 한정됩니다. 검영법·조절마비 굴절검사가 필요하면 안과를 안내합니다.\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 새 안경을 쓰고 어지럽다고 하면 무조건 적응하라고 하면 되나요?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 아닙니다. 조제 확인 → 피팅 확인 → 처방 재확인 순서로 점검하고, 필요 시 원주 감량 등 조정합니다(7.3).\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 교정해도 0.6밖에 안 나와요. 어떻게 하나요?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 핀홀 시력을 확인하고, 개선이 없거나 원인이 불분명하면 안과 진료를 먼저 권합니다. 처방은 진료 후 결정하는 것이 안전합니다.\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 비면허 직원은 어디까지 도와줄 수 있나요?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 접수, 문진표 배부·회수, 안내, 세척·포장 등 단순 보조입니다. 굴절검사·조제·처방 설명은 안경사가 합니다(0장 역할 구분).\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 마케팅 문자에 검사 결과를 활용해도 되나요?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 검사 결과는 민감정보입니다. 동의 범위를 벗어난 활용은 금지되며, 마케팅은 별도 수신 동의를 받은 고객에게만 일반 안내로 보냅니다.\u003c/p>\u003c/details>\u003cdetails class=\"qa\">\u003csummary>Q. 노안 가입도는 나이표대로 주면 되나요?\u003c/summary>\u003cp>\u003cb>A.\u003c/b> 나이는 출발점일 뿐입니다. 조절력, 작업거리, 착용 테스트로 결정하고 선명 범위를 꼭 확인합니다.\u003c/p>\u003c/details>"}],"questions":[{"id":"g12-q1","question":"양안균형을 운무 없이 하면?","choices":["더 정확","우세안이 지배해 비우세안 과마이너스","차이 없음","ADD 증가"],"answer_index":1,"explanation":"+0.75 D 운무 후 균형을 맞춰요.","page":"g12.html"},{"id":"g12-q2","question":"고객이 계속 '똑같아요'라고 하면?","choices":["무조건 마이너스","단계 크기를 0.50 D로 키워 비교하거나 현재 값 유지","검사 중단","오토레프 값 처방"],"answer_index":1,"explanation":"판별 한계 아래일 수 있어요.","page":"g12.html"}]},{"id":"g13","no":"10","title":"누진다초점 렌즈","page":"g13.html","intro":"\u003cp class=\"note\">이 장은 웹 교재판에서 새로 추가했어요. 공개된 제조사 가이드·표준·교육 자료를 바탕으로 정리했고, 출처 번호[ ]를 누르면 부록 C로 이동해요. 제품별 수치는 예시이므로 실제 주문 시 해당 제조사 자료를 확인하세요.\u003c/p>","key_points":["누진 = 원용부·누진대·근용부 + 양옆 아래 왜곡부.","테 먼저 맞추고 (정점 12~14 mm, 경사각) → 단안 원용 PD·피팅 높이(동공 중심 ~ 렌즈 최저점).","누진대 길이는 최소 피팅 높이와 함께 선택. ADD는 낮게 시작.","적응 안내: 눈만 내려 근거리, 옆은 고개를 돌려서, 1~2주."],"sections":[{"id":"s10-1","title":"10.1 누진 렌즈의 구조","html":"\u003cp>누진다초점 렌즈(PAL)는 한 렌즈 안에서 \u003cb>위쪽 원용부 → 가운데 누진대(코리도) → 아래쪽 근용부\u003c/b>로 도수가 연속해서 늘어나는 렌즈입니다. 도수가 위아래로 바뀌는 대가로 \u003cb>누진대 양옆 아래쪽에 원치 않는 비점수차(주변부 왜곡·흐림)\u003c/b>가 생기며, 이것이 “옆이 흐리다·울렁인다”는 호소의 구조적 원인입니다.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref35\">35\u003c/a>, \u003ca href=\"g18.html#ref38\">38\u003c/a>]\u003c/sup>\u003c/p>\n\u003cul>\u003cli>\u003cb>원용부\u003c/b>: 처방 원용 도수. 피팅 크로스 위쪽.\u003c/li>\n\u003cli>\u003cb>누진대\u003c/b>: 도수가 ADD만큼 늘어나는 좁은 길. 길이(누진대 길이)는 설계마다 다름.\u003c/li>\n\u003cli>\u003cb>근용부\u003c/b>: 원용 도수 + ADD. 두 눈이 모이므로 코 쪽으로 약간 들어가 있음(\u003cb>인셋\u003c/b>).\u003c/li>\n\u003cli>\u003cb>주변부\u003c/b>: 누진대 양옆 아래. 하드 설계는 선명 영역이 넓은 대신 왜곡이 급하고, 소프트 설계는 왜곡이 완만해 적응이 쉬운 대신 선명 폭이 좁은 경향.\u003c/li>\u003c/ul>\u003cfigure class=\"gf\" id=\"fig10-1\">\u003csvg class=\"fig\" viewBox=\"0 0 400 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"누진다초점 렌즈의 구조: 원용부·누진대·근용부와 주변부 왜곡\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cclipPath id=\"pcg48120\">\u003cellipse cx=\"120\" cy=\"150\" rx=\"100\" ry=\"110\"/>\u003c/clipPath>\u003cellipse cx=\"120.0\" cy=\"150.0\" rx=\"100.0\" ry=\"110.0\" fill=\"#ffffff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003cg clip-path=\"url(#pcg48120)\">\u003cpath d=\"M20,150 Q108,152 114,156 L100.0,196 L20,216 Z\" stroke=\"none\" fill=\"#f8c9c2\" stroke-width=\"0\" />\u003cpath d=\"M220,150 Q132,152 126,156 L140.0,196 L220,216 Z\" stroke=\"none\" fill=\"#f8c9c2\" stroke-width=\"0\" />\u003cpath d=\"M20,216 L100.0,196 L94.0,260 L20,260 Z\" stroke=\"none\" fill=\"#f8c9c2\" stroke-width=\"0\" fill-opacity=\".8\"/>\u003cpath d=\"M220,216 L140.0,196 L146.0,260 L220,260 Z\" stroke=\"none\" fill=\"#f8c9c2\" stroke-width=\"0\" fill-opacity=\".8\"/>\u003cpath d=\"M20,40 L220,40 L220,150 Q132,152 126,156 L114,156 Q108,152 20,150 Z\" stroke=\"none\" fill=\"#dbeaff\" stroke-width=\"0\" />\u003cpath d=\"M114,156 L126,156 L140.0,196 L100.0,196 Z\" stroke=\"none\" fill=\"#e3f4e1\" stroke-width=\"0\" />\u003cpath d=\"M100.0,196 L140.0,196 L146.0,260 L94.0,260 Z\" stroke=\"none\" fill=\"#fff0d6\" stroke-width=\"0\" />\u003c/g>\u003cellipse cx=\"120.0\" cy=\"150.0\" rx=\"100.0\" ry=\"110.0\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003cline x1=\"114.0\" y1=\"144.0\" x2=\"126.0\" y2=\"144.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cline x1=\"120.0\" y1=\"138.0\" x2=\"120.0\" y2=\"150.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003ctext x=\"120.0\" y=\"88.0\" font-size=\"12.5\" fill=\"#2a6fdb\" text-anchor=\"middle\" font-weight=\"bold\" >원용부(먼 곳)\u003c/text>\u003ctext x=\"120.0\" y=\"184.0\" font-size=\"11.5\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >누진대\u003c/text>\u003ctext x=\"120.0\" y=\"238.0\" font-size=\"12\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >근용부\u003c/text>\u003ctext x=\"58.0\" y=\"202.0\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >왜곡\u003c/text>\u003ctext x=\"182.0\" y=\"202.0\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >왜곡\u003c/text>\u003cline x1=\"120.0\" y1=\"144.0\" x2=\"238.0\" y2=\"96.0\" stroke=\"#c0392b\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"120.0\" cy=\"144.0\" r=\"2.2\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003ctext x=\"238.0\" y=\"94.0\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"start\" font-weight=\"normal\" >피팅 포인트(+) = 동공 중심\u003c/text>\u003cline x1=\"256.0\" y1=\"240.0\" x2=\"380.0\" y2=\"240.0\" stroke=\"#333\" stroke-width=\"1.2\" />\u003cline x1=\"256.0\" y1=\"150.0\" x2=\"256.0\" y2=\"240.0\" stroke=\"#333\" stroke-width=\"1.2\" />\u003cpath d=\"M256,234 L286,234 C316,234 326,162 356,162 L380,162\" stroke=\"#1b7a43\" fill=\"none\" stroke-width=\"2.5\" />\u003ctext x=\"318.0\" y=\"256.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >렌즈 위 → 아래\u003c/text>\u003ctext x=\"252.0\" y=\"236.0\" font-size=\"10\" fill=\"#2a6fdb\" text-anchor=\"end\" font-weight=\"normal\" >원용\u003c/text>\u003ctext x=\"252.0\" y=\"166.0\" font-size=\"10\" fill=\"#e07b00\" text-anchor=\"end\" font-weight=\"normal\" >+ADD\u003c/text>\u003ctext x=\"318.0\" y=\"142.0\" font-size=\"11\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >누진대를 따라 도수 증가\u003c/text>\u003ctext x=\"200.0\" y=\"286.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >※ 개념도. 실제 시야 폭·왜곡 위치는 설계(하드/소프트, 개인맞춤)마다 달라요\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 10-1.\u003c/b> 누진다초점 렌즈의 구조: 원용부·누진대·근용부와 주변부 왜곡\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"box term\">\u003cb>표시(마크) 읽기\u003c/b> 지워지는 마크: 피팅 크로스(동공 중심에 맞추는 점), 원용 측정 원, 프리즘 기준점(PRP), 근용 측정 원. 숨김 각인: PRP 양옆 17 mm(간격 34 mm)의 원·로고, 귀 쪽 각인 아래 ADD 숫자(예: 20 = +2.00). 각인을 다시 찾아 마크를 복원하면 조제·피팅 검증이 가능해요.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref34\">34\u003c/a>, \u003ca href=\"g18.html#ref37\">37\u003c/a>]\u003c/sup>\u003c/div>\n\u003cfigure class=\"gf\" id=\"fig10-2\">\u003csvg class=\"fig\" viewBox=\"0 0 400 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"누진 렌즈의 표시(지워지는 마크와 숨김 각인)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cellipse cx=\"200.0\" cy=\"140.0\" rx=\"170.0\" ry=\"118.0\" fill=\"#f7fbff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ccircle cx=\"200.0\" cy=\"96.0\" r=\"14.0\" fill=\"none\" stroke=\"#2a6fdb\" stroke-width=\"1.8\" />\u003ctext x=\"218.0\" y=\"86.0\" font-size=\"11\" fill=\"#2a6fdb\" text-anchor=\"start\" font-weight=\"normal\" >원용 측정 원\u003c/text>\u003cline x1=\"190.0\" y1=\"126.0\" x2=\"210.0\" y2=\"126.0\" stroke=\"#c0392b\" stroke-width=\"2.5\" />\u003cline x1=\"200.0\" y1=\"116.0\" x2=\"200.0\" y2=\"136.0\" stroke=\"#c0392b\" stroke-width=\"2.5\" />\u003ctext x=\"216.0\" y=\"130.0\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"start\" font-weight=\"normal\" >피팅 크로스\u003c/text>\u003ccircle cx=\"200.0\" cy=\"130.0\" r=\"0.1\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003ccircle cx=\"200.0\" cy=\"140.0\" r=\"3.5\" fill=\"#7b3fb5\" stroke=\"#7b3fb5\" stroke-width=\"1\" />\u003ctext x=\"212.0\" y=\"144.0\" font-size=\"11\" fill=\"#7b3fb5\" text-anchor=\"start\" font-weight=\"normal\" >프리즘 기준점(PRP)\u003c/text>\u003ccircle cx=\"192.0\" cy=\"190.0\" r=\"12.0\" fill=\"none\" stroke=\"#e07b00\" stroke-width=\"1.8\" />\u003ctext x=\"210.0\" y=\"196.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"normal\" >근용 측정 원(안쪽으로 인셋)\u003c/text>\u003cline x1=\"50.0\" y1=\"140.0\" x2=\"160.0\" y2=\"140.0\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"5 3\" />\u003cline x1=\"240.0\" y1=\"140.0\" x2=\"350.0\" y2=\"140.0\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"5 3\" />\u003ccircle cx=\"115.0\" cy=\"140.0\" r=\"6.0\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.5\" stroke-dasharray=\"2 2\"/>\u003ccircle cx=\"285.0\" cy=\"140.0\" r=\"6.0\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.5\" stroke-dasharray=\"2 2\"/>\u003ctext x=\"285.0\" y=\"164.0\" font-size=\"10.5\" fill=\"#555\" text-anchor=\"middle\" font-weight=\"normal\" >ADD 각인(예: 20 = +2.00)\u003c/text>\u003ctext x=\"115.0\" y=\"164.0\" font-size=\"10.5\" fill=\"#555\" text-anchor=\"middle\" font-weight=\"normal\" >숨김 각인\u003c/text>\u003ctext x=\"160.0\" y=\"120.0\" font-size=\"1\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >\u003c/text>\u003ctext x=\"200.0\" y=\"250.0\" font-size=\"10.5\" fill=\"#555\" text-anchor=\"middle\" font-weight=\"normal\" >숨김 각인 간격 34 mm(각 17 mm) · 가운데가 PRP\u003c/text>\u003ctext x=\"200.0\" y=\"20.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >오른눈 렌즈 예(정면) · 수치는 제조사 센터링 차트로 확인\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 10-2.\u003c/b> 누진 렌즈의 표시(지워지는 마크와 숨김 각인)\u003c/figcaption>\u003c/figure>"},{"id":"s10-2","title":"10.2 테 선택과 사전 피팅","html":"\u003col>\u003cli>\u003cb>테 선택\u003c/b>: 제조사 최소 피팅 높이(예: 누진대 짧은 설계 14~18 mm)를 만족하는 깊이. 일반 누진은 렌즈 세로 25~30 mm 이상이 권장되는 경우가 많고, 너무 큰 에비에이터형은 쓸모없는 왜곡부를 늘립니다. 코받침 조절이 되는 테가 높이 미세 조정에 유리.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref35\">35\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>\u003cb>사전 피팅(측정 전에!)\u003c/b>: 정점간거리 약 12~14 mm, 경사각 약 6~8°(바리락스 가이드) 또는 7° 이상(OptiCampus), 얼굴 곡면에 맞는 안면각(랩). 테를 먼저 맞추지 않고 잰 높이는 의미가 없습니다.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref34\">34\u003c/a>, \u003ca href=\"g18.html#ref35\">35\u003c/a>]\u003c/sup>\u003c/li>\u003c/ol>\n\u003cfigure class=\"gf\" id=\"fig10-3\">\u003csvg class=\"fig\" viewBox=\"0 0 400 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"테 맞춤: 경사각(판토스코픽)과 정점간거리\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cpath d=\"M200,20 L270,20 Q300,22 304,60 L302,84 Q306,96 314,112 L334,138 Q330,146 316,146 Q318,166 306,174 Q306,204 286,222 L200,222 Z\" stroke=\"#3a4656\" fill=\"#f6dcc6\" stroke-width=\"1.5\" />\u003cellipse cx=\"296.0\" cy=\"100.0\" rx=\"5.0\" ry=\"4.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cline x1=\"318.7\" y1=\"70.4\" x2=\"309.3\" y2=\"129.6\" stroke=\"#2a6fdb\" stroke-width=\"5\" />\u003cline x1=\"314.0\" y1=\"62.0\" x2=\"314.0\" y2=\"142.0\" stroke=\"#666\" stroke-width=\"1\" stroke-dasharray=\"3 3\" />\u003cpath d=\"M314,130 A30,30 0 0 1 309.3,129.6\" stroke=\"#e07b00\" fill=\"none\" stroke-width=\"1.5\" />\u003ctext x=\"250.0\" y=\"160.0\" font-size=\"1\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"bold\" >\u003c/text>\u003cline x1=\"311.0\" y1=\"124.0\" x2=\"313.9\" y2=\"186.0\" stroke=\"#e07b00\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"311.0\" cy=\"124.0\" r=\"2.2\" fill=\"#e07b00\" stroke=\"#e07b00\" stroke-width=\"1\" />\u003ctext x=\"313.9\" y=\"200.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"normal\" >경사각 약 6~12°\u003c/text>\u003cline x1=\"301.0\" y1=\"96.0\" x2=\"313.0\" y2=\"96.0\" stroke=\"#1b7a43\" stroke-width=\"1.6\" />\u003cline x1=\"306.0\" y1=\"96.0\" x2=\"306.0\" y2=\"54.0\" stroke=\"#1b7a43\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"306.0\" cy=\"96.0\" r=\"2.2\" fill=\"#1b7a43\" stroke=\"#1b7a43\" stroke-width=\"1\" />\u003ctext x=\"291.3\" y=\"52.0\" font-size=\"11\" fill=\"#1b7a43\" text-anchor=\"start\" font-weight=\"normal\" >정점간거리 12~14 mm\u003c/text>\u003ctext x=\"120.0\" y=\"90.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >렌즈 아래쪽이\u003c/text>\u003ctext x=\"120.0\" y=\"106.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >얼굴 쪽으로 기울어요\u003c/text>\u003ctext x=\"200.0\" y=\"236.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >아래 시선(근용)과 렌즈 면이 수직에 가까워져 근용·주변부 성능 유지\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 10-3.\u003c/b> 테 맞춤: 경사각(판토스코픽)과 정점간거리\u003c/figcaption>\u003c/figure>"},{"id":"s10-3","title":"10.3 단안 PD·피팅 높이 측정","html":"\u003col>\u003cli>고객과 \u003cb>같은 눈높이\u003c/b>에서 마주 섬. 고객은 자연스러운 자세로 정면(먼 곳)을 봄.\u003c/li>\n\u003cli>\u003cb>단안 원용 PD\u003c/b>: 각막 반사 PD 측정기로 R/L 따로. 대부분 제조사가 원용 단안 PD를 요구하며, 인셋은 설계가 계산합니다(근용 PD + 2.5 mm 방식은 고도수에서 원용부 프리즘을 만들 수 있음).\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref34\">34\u003c/a>, \u003ca href=\"g18.html#ref35\">35\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>\u003cb>피팅 높이\u003c/b>: 데모 렌즈에 동공 중심을 점찍고 수평선 → 그 선부터 렌즈 가장 아래(테 안쪽 홈/베벨 최저점)까지 R/L 각각 측정.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref34\">34\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>고객을 걷게 하거나 둘러보게 한 뒤 다시 확인. 높이를 “감으로” 고치지 말 것. 키·자세·기존 누진 사용 경험은 참고.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref35\">35\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>\u003cb>컷아웃 확인\u003c/b>: 센터링 차트에 PD·높이를 표시해 렌즈 지름 안에 들어가는지 확인. 안 들어가면 테 변경.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref34\">34\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>개인맞춤(프리폼) 설계는 정점간거리·경사각·안면각도 함께 기록.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref35\">35\u003c/a>, \u003ca href=\"g18.html#ref36\">36\u003c/a>]\u003c/sup>\u003c/li>\u003c/ol>\n\u003cdiv class=\"box must\">\u003cb>현장 기준\u003c/b> 피팅 크로스 높이 ±1.0 mm, 좌우 높이 차 1.0 mm 이내, 단안 PD ±1.0 mm(ANSI Z80.1 누진 허용오차 참고). 측정값이 이 범위를 넘게 흔들리면 다시 잽니다.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref37\">37\u003c/a>]\u003c/sup>\u003c/div>\n\u003cfigure class=\"gf\" id=\"fig10-4\">\u003csvg class=\"fig\" viewBox=\"0 0 400 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"누진 렌즈 피팅 높이와 단안 PD 측정\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g511b7a43\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1b7a43\"/>\u003c/marker>\u003cmarker id=\"g51e07b00\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#e07b00\"/>\u003c/marker>\u003c/defs>\u003crect x=\"58.0\" y=\"70.0\" width=\"124.0\" height=\"90.0\" rx=\"26\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"3\" />\u003ccircle cx=\"120.0\" cy=\"112.0\" r=\"12.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"120.0\" cy=\"112.0\" r=\"4.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cline x1=\"106.0\" y1=\"112.0\" x2=\"134.0\" y2=\"112.0\" stroke=\"#c0392b\" stroke-width=\"1.5\" />\u003cline x1=\"120.0\" y1=\"98.0\" x2=\"120.0\" y2=\"126.0\" stroke=\"#c0392b\" stroke-width=\"1.5\" />\u003crect x=\"218.0\" y=\"70.0\" width=\"124.0\" height=\"90.0\" rx=\"26\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"3\" />\u003ccircle cx=\"280.0\" cy=\"112.0\" r=\"12.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"280.0\" cy=\"112.0\" r=\"4.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cline x1=\"266.0\" y1=\"112.0\" x2=\"294.0\" y2=\"112.0\" stroke=\"#c0392b\" stroke-width=\"1.5\" />\u003cline x1=\"280.0\" y1=\"98.0\" x2=\"280.0\" y2=\"126.0\" stroke=\"#c0392b\" stroke-width=\"1.5\" />\u003cpath d=\"M182,92 Q200,80 218,92\" stroke=\"#1f3a5f\" fill=\"none\" stroke-width=\"3\" />\u003cline x1=\"200.0\" y1=\"60.0\" x2=\"200.0\" y2=\"180.0\" stroke=\"#666\" stroke-width=\"1\" stroke-dasharray=\"4 3\" />\u003ctext x=\"200.0\" y=\"54.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >브리지 중심\u003c/text>\u003cline x1=\"120.0\" y1=\"190.0\" x2=\"200.0\" y2=\"190.0\" stroke=\"#e07b00\" stroke-width=\"1.5\" marker-end=\"url(#g51e07b00)\" marker-start=\"url(#g51e07b00)\" />\u003ctext x=\"160.0\" y=\"206.0\" font-size=\"11.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >단안 PD R\u003c/text>\u003cline x1=\"200.0\" y1=\"190.0\" x2=\"280.0\" y2=\"190.0\" stroke=\"#e07b00\" stroke-width=\"1.5\" marker-end=\"url(#g51e07b00)\" marker-start=\"url(#g51e07b00)\" />\u003ctext x=\"240.0\" y=\"206.0\" font-size=\"11.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >단안 PD L\u003c/text>\u003cline x1=\"350.0\" y1=\"112.0\" x2=\"350.0\" y2=\"160.0\" stroke=\"#1b7a43\" stroke-width=\"1.5\" marker-end=\"url(#g511b7a43)\" marker-start=\"url(#g511b7a43)\" />\u003cline x1=\"342.0\" y1=\"160.0\" x2=\"358.0\" y2=\"160.0\" stroke=\"#1b7a43\" stroke-width=\"1.5\" />\u003cline x1=\"280.0\" y1=\"112.0\" x2=\"352.0\" y2=\"112.0\" stroke=\"#1b7a43\" stroke-width=\"1\" stroke-dasharray=\"2 2\" />\u003cline x1=\"300.0\" y1=\"160.0\" x2=\"352.0\" y2=\"160.0\" stroke=\"#1b7a43\" stroke-width=\"1\" stroke-dasharray=\"2 2\" />\u003ctext x=\"364.0\" y=\"132.0\" font-size=\"11\" fill=\"#1b7a43\" text-anchor=\"start\" font-weight=\"bold\" >피팅\u003c/text>\u003ctext x=\"364.0\" y=\"146.0\" font-size=\"11\" fill=\"#1b7a43\" text-anchor=\"start\" font-weight=\"bold\" >높이\u003c/text>\u003ctext x=\"200.0\" y=\"234.0\" font-size=\"10.2\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >동공 중심(+) ~ 렌즈 테 가장 아래(안쪽 홈) · 자연스러운 자세·정면 주시 · 눈높이 맞추기\u003c/text>\u003ctext x=\"200.0\" y=\"24.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >먼저 테를 맞춘 뒤 측정(정점간거리·경사각·안면각)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 10-4.\u003c/b> 누진 렌즈 피팅 높이와 단안 PD 측정\u003c/figcaption>\u003c/figure>"},{"id":"s10-4","title":"10.4 가입도(ADD) 결정","html":"\u003cp>ADD는 5.3절 원칙(작업거리·조절력·선명 범위·실물 테스트)을 그대로 따릅니다. 누진에서는 추가로 아래를 확인합니다.\u003c/p>\n\u003cul>\u003cli>\u003cb>“필요한 만큼만”\u003c/b>: ADD가 클수록 근용부의 선명 거리가 가까워지고 주변부 비점수차도 커져 적응이 어려워집니다. 같은 고객이라도 첫 누진은 낮은 ADD가 유리한 경우가 많아요.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref35\">35\u003c/a>, \u003ca href=\"g18.html#ref38\">38\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>\u003cb>원용 처방이 먼저 정확해야\u003c/b> 합니다. 원용 과마이너스는 근용을 더 흐리게 만들어 ADD 과다로 이어집니다.\u003c/li>\n\u003cli>두 눈 ADD는 보통 같게. 좌우 차이가 필요해 보이면 원용 처방·양안균형부터 재확인.\u003c/li>\n\u003cli>기존 누진의 ADD·설계·높이를 렌즈미터와 숨김 각인으로 확인하고 변화량을 기록.\u003c/li>\u003c/ul>\n\u003cdiv class=\"box term\">\u003cb>빠른 계산\u003c/b> ADD = 1 ÷ 작업거리(m) − 조절력 ÷ 2. 예) 40 cm(2.50 D), 조절력 2.00 D → +1.50 D. 이후 선명 범위가 작업거리를 가운데 포함하는지 확인.\u003c/div>"},{"id":"s10-5","title":"10.5 누진대 길이 선택","html":"\u003ctable class=\"tbl\">\u003ctr>\u003cth>선택\u003c/th>\u003cth>장점\u003c/th>\u003cth>주의\u003c/th>\u003cth>잘 맞는 고객\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>짧은 누진대\u003c/td>\u003ctd>세로가 낮은 테 가능, 근용부에 빨리 도달(눈을 덜 내림)\u003c/td>\u003ctd>도수 변화가 급해 주변 왜곡이 강하게 느껴질 수 있음\u003c/td>\u003ctd>작은 테 선호, 근거리 위주, 기존 짧은 누진 사용자\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>긴 누진대\u003c/td>\u003ctd>도수 변화가 완만 → 울렁임 적고 중간거리 넓음\u003c/td>\u003ctd>깊은 테 필요, 근용부까지 눈을 더 내려야 함\u003c/td>\u003ctd>첫 누진, 원·중간 사용 많음, 운전·보행 많음\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>제조사 표의 \u003cb>최소 피팅 높이\u003c/b>를 꼭 확인합니다. 예) 한 제조사 설계: 누진대 11 mm → 최소 14 mm, 12 → 15, 13 → 17, 14 → 18, 15 → 19, 16 → 20 mm.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref36\">36\u003c/a>]\u003c/sup> 측정 피팅 높이가 최소값에 겨우 걸치면 근용부가 잘려 “아래가 좁다”는 호소가 납니다.\u003c/p>\n\u003cfigure class=\"gf\" id=\"fig10-5\">\u003csvg class=\"fig\" viewBox=\"0 0 400 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"누진대 길이와 최소 피팅 높이(예: 제조사 표)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g521b7a43\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1b7a43\"/>\u003c/marker>\u003c/defs>\u003crect x=\"25.0\" y=\"60.0\" width=\"160.0\" height=\"110.0\" rx=\"22\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2.5\" />\u003cline x1=\"97.0\" y1=\"112.4\" x2=\"113.0\" y2=\"112.4\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cline x1=\"105.0\" y1=\"104.4\" x2=\"105.0\" y2=\"120.4\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cpath d=\"M100,118.4 L110,118.4 L119,144.4 L91,144.4 Z\" stroke=\"#1b7a43\" fill=\"#e3f4e1\" stroke-width=\"1\" />\u003cellipse cx=\"105.0\" cy=\"154.4\" rx=\"20.0\" ry=\"8.0\" fill=\"#fff0d6\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003cline x1=\"165.0\" y1=\"112.4\" x2=\"165.0\" y2=\"170.0\" stroke=\"#1b7a43\" stroke-width=\"1.4\" marker-end=\"url(#g521b7a43)\" marker-start
