<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f3a5f"><title>검안 교육 학습</title><style>*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","NanumGothic",sans-serif;font-size:17px;line-height:1.65;color:#1d2330;background:#f6f8fb;word-break:keep-all;overflow-wrap:anywhere;padding-bottom:40px}
a{color:#1f5fbf}
header.top{position:sticky;top:0;z-index:20;background:#1f3a5f;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header.top .in{max-width:760px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px}
header.top .ttl{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:760px;margin:0 auto;padding:0 8px 8px;scrollbar-width:none}
nav.tabs a{flex:0 0 auto;color:#fff;text-decoration:none;font-size:14px;padding:6px 11px;border-radius:16px;background:rgba(255,255,255,.14)}
nav.tabs a.on{background:#e07b00}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:1.45em;line-height:1.35;margin:.4em 0 .3em;color:#1f3a5f}
h2{font-size:1.2em;line-height:1.4;margin:1.4em 0 .5em;color:#1f3a5f;border-left:5px solid #1f3a5f;padding-left:8px}
h3{font-size:1.05em;margin:1em 0 .4em}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(20,40,80,.08)}
.core{background:#fff8ec;border:2px solid #e07b00;border-radius:14px;padding:12px 14px;margin:12px 0}
.core h2{border:0;padding:0;margin:.2em 0 .4em;color:#b35f00}
.core ol{margin:0;padding-left:1.3em}
.box{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95em}
.box b:first-child{display:inline-block;margin-right:6px}
.box.term{background:#eef5ff;border-left:5px solid #2a6fdb}
.box.bg{background:#f1f3f6;border-left:5px solid #777}
.box.must{background:#fff1de;border-left:5px solid #e07b00}
.box.must b:first-child{color:#b35f00}
.box.star{background:#fffbe6;border-left:5px solid #d4a400}
.box.err{background:#fdeeee;border-left:5px solid #c0392b}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.two>div{background:#fff;border:2px solid #1f3a5f;border-radius:10px;padding:8px 10px;font-size:.92em}
.two>div:last-child{border-color:#e07b00}
@media (max-width:380px){.two{grid-template-columns:1fr}}
.case{background:#fff;border:1px solid #d7deea;border-radius:10px;padding:10px;margin:10px 0}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{border-collapse:collapse;width:100%;font-size:.88em;margin:8px 0;background:#fff}
table.tbl th,table.tbl td{border:1px solid #cfd8e6;padding:6px 7px;vertical-align:top;text-align:left}
table.tbl th{background:#e9eff8}
svg.fig{display:block;width:100%;max-width:520px;height:auto;margin:10px auto;background:#fff;border-radius:10px}
.sec{background:#fff;border-radius:14px;padding:4px 14px 12px;margin:14px 0;box-shadow:0 1px 3px rgba(20,40,80,.08);scroll-margin-top:96px}
.sec h2{margin-top:.8em}
.meta{font-size:.8em;color:#556}
.stars{color:#d48a00;letter-spacing:1px}
.tier{display:inline-block;font-size:.75em;padding:1px 8px;border-radius:10px;color:#fff;vertical-align:middle}
.t-기본{background:#1b7a43}.t-응용{background:#2a6fdb}.t-심화{background:#7b3fb5}
.tag{display:inline-block;font-size:.72em;padding:1px 7px;border-radius:10px;border:1px solid;vertical-align:middle}
.tag.ok{color:#a3460a;border-color:#e07b00;background:#fff4e6}.tag.est{color:#445;border-color:#99a;background:#f4f5f8}
.note{font-size:.9em;color:#556}.src{font-size:.78em;color:#667;word-break:break-all}
.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border-radius:10px;border:0;background:#1f3a5f;color:#fff;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;margin:4px 4px 4px 0}
.btn.o{background:#e07b00}.btn.g{background:#1b7a43}.btn.l{background:#e9eff8;color:#1f3a5f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid a.tile{display:block;background:#fff;border:2px solid #d7deea;border-radius:12px;padding:10px;text-decoration:none;color:#1d2330;min-height:64px}
.grid a.tile b{display:block;color:#1f3a5f}
.grid a.tile.done{border-color:#1b7a43;background:#effaf2}
.q{background:#fff;border-radius:14px;padding:12px;margin:12px 0;box-shadow:0 1px 3px rgba(20,40,80,.1)}
.qh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.qh .num{font-weight:700;color:#1f3a5f}
.qh .mtl{font-size:.72em;color:#667}
.qt{font-weight:600;margin-bottom:8px}
button.opt{display:block;width:100%;text-align:left;background:#f4f7fb;border:2px solid #d7deea;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:16px;line-height:1.45;color:#1d2330;cursor:pointer;min-height:44px;font-family:inherit}
button.opt:disabled{cursor:default;color:#1d2330}
button.opt.right{background:#e6f6ea;border-color:#1b7a43}
button.opt.wrong{background:#fdeaea;border-color:#c0392b}
button.opt.pick{background:#eef5ff;border-color:#2a6fdb}
.diag{margin-top:8px;border-top:1px dashed #ccd;padding-top:8px;font-size:.94em}
.diag .ok{color:#1b7a43;font-weight:700}.diag .no{color:#c0392b;font-weight:700}
.diag details{margin:6px 0}.diag summary{cursor:pointer;color:#1f5fbf}
.simbox{border-left:4px solid #e07b00;padding-left:8px;margin-top:8px}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctrl select{font-size:15px;min-height:44px;border-radius:10px;border:1px solid #bcc7d8;padding:6px 8px;max-width:100%;background:#fff}
.chip{border:2px solid #1f3a5f;background:#fff;color:#1f3a5f;border-radius:18px;padding:6px 12px;min-height:40px;font-size:14px;font-weight:700;cursor:pointer}
.chip.on{background:#1f3a5f;color:#fff}
.askbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid #d7deea;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.askbar form{max-width:760px;margin:0 auto;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.askbar input{flex:1;min-width:0;font-size:16px;border:1px solid #bcc7d8;border-radius:10px;padding:10px}
.askbar button{min-height:44px;border:0;border-radius:10px;background:#e07b00;color:#fff;font-weight:700;padding:0 12px;font-size:15px}
.askbar .alt{background:#e9eff8;color:#1f3a5f;padding:0 8px;font-size:13px}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtns button{min-height:64px;font-size:17px;font-weight:700;border-radius:14px;border:2px solid #1f3a5f;background:#fff;color:#1f3a5f}
.bigbtns button.on{background:#1f3a5f;color:#fff}
.flash{background:#fff;border-radius:16px;min-height:200px;padding:18px;box-shadow:0 2px 8px rgba(20,40,80,.12);font-size:1.05em}
.flash .front{font-weight:700;font-size:1.1em;color:#1f3a5f}
.flash .back{margin-top:12px;border-top:1px dashed #ccd;padding-top:12px}
.boxes{display:flex;gap:6px;flex-wrap:wrap;font-size:.85em}
.boxes span{background:#e9eff8;border-radius:8px;padding:3px 8px}
.dis{background:#fff;border-radius:14px;padding:12px;margin:12px 0;box-shadow:0 1px 3px rgba(20,40,80,.08)}
.dis img{width:100%;max-width:520px;height:auto;border-radius:10px;display:block;margin:6px auto}
.dis dl{margin:6px 0}.dis dt{font-weight:700;color:#1f3a5f}.dis dd{margin:0 0 6px 0}
.cap{font-size:.75em;color:#556;word-break:break-all}
.link1{background:#effaf2;border-left:5px solid #1b7a43;padding:8px 10px;border-radius:8px;font-size:.93em}
.ref{display:grid;gap:8px}.ref div{border-radius:10px;padding:8px 10px;color:#fff}
.dday{font-size:1.6em;font-weight:800;color:#c0392b}
.progress{height:10px;background:#e3e8f0;border-radius:6px;overflow:hidden}.progress i{display:block;height:100%;background:#1b7a43}
.hide{display:none!important}
footer{max-width:760px;margin:20px auto;padding:0 12px;font-size:.8em;color:#667}

.field{display:block;margin:10px 0}.field span{display:block;font-size:.85em;color:#445;margin-bottom:3px;font-weight:700}
.field input,.field select{width:100%;font-size:16px;min-height:46px;border:1px solid #bcc7d8;border-radius:10px;padding:8px 10px;background:#fff;font-family:inherit}
.err{color:#c0392b;font-weight:700;font-size:.92em}.okmsg{color:#1b7a43;font-weight:700;font-size:.92em}
header.top .who{font-size:12px;opacity:.85;white-space:nowrap}
header.top button.hb{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:14px;padding:6px 10px;font-size:13px;cursor:pointer;min-height:34px}
.chrow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #d7deea;border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}
.chrow.done{border-color:#1b7a43;background:#effaf2}
.chrow .n{flex:0 0 34px;height:34px;border-radius:50%;background:#1f3a5f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.chrow .b{flex:1;min-width:0}.chrow .b b{display:block;color:#1f3a5f;line-height:1.35}
.chrow .pct{font-weight:800;color:#1b7a43;font-size:.95em}
.seclist button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;background:#fff;border:1px solid #d7deea;border-radius:10px;padding:10px;margin:6px 0;font-size:15px;min-height:46px;cursor:pointer;font-family:inherit;color:#1d2330}
.seclist button .ck{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #bcc7d8;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.seclist button.done .ck{background:#1b7a43;border-color:#1b7a43}
.content img{max-width:100%;height:auto}.content svg{max-width:100%;height:auto}
figure.fg{margin:12px 0;background:#fff;border:1px solid #e1e7f0;border-radius:12px;padding:8px}
figure.fg svg,figure.fg img{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
figure.fg figcaption{font-size:.85em;color:#445;text-align:center;margin-top:6px}
.stick{position:sticky;bottom:0;background:linear-gradient(rgba(246,248,251,0),#f6f8fb 30%);padding:14px 0 calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px}
.stick .btn{flex:1}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(20,40,80,.08)}
.kpi b{display:block;font-size:1.4em;color:#1f3a5f}.kpi span{font-size:.78em;color:#556}
.badge{display:inline-block;font-size:.75em;padding:1px 8px;border-radius:10px;background:#e9eff8;color:#1f3a5f;font-weight:700}
.badge.g{background:#e6f6ea;color:#1b7a43}.badge.r{background:#fdeaea;color:#c0392b}.badge.o{background:#fff1de;color:#b35f00}
.qprog{font-size:.85em;color:#556;margin:4px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:99;opacity:.95}
table.tbl td.c,table.tbl th.c{text-align:center}
table.tbl tr.click{cursor:pointer}table.tbl tr.click:hover td{background:#f4f7fb}
.pc{display:inline-block;min-width:38px;padding:1px 4px;border-radius:6px;font-weight:700;font-size:.92em}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 8px}
.modal .in{background:#f6f8fb;border-radius:16px;max-width:760px;width:100%;padding:12px 14px}
.wide main{max-width:1200px}.wide header.top .in,.wide nav.tabs{max-width:1200px}

/* classes used by textbook (g-page) section HTML */
figure.gf{margin:14px 0;padding:6px 4px 8px;background:#fff;border:1px solid #e3e8f0;border-radius:12px}
figure.gf svg.fig{max-width:640px;margin:4px auto}
figure.gf figcaption{font-size:.84em;color:#3a4456;text-align:center;padding:0 6px;line-height:1.5}
figure.gf figcaption b{color:#1f3a5f}
.lbl{font-size:.98em;color:#1f3a5f;margin:1em 0 .3em;padding:2px 8px;background:#eef3fa;border-radius:6px;display:inline-block}
ul.chk{list-style:none;padding-left:0;margin:6px 0}
ul.chk li{border-bottom:1px dashed #dde3ec;padding:6px 2px}
ul.chk label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
ul.chk input{width:20px;height:20px;flex:0 0 auto;margin-top:3px}
ul.chk .rm{font-size:.82em;color:#667;margin-left:28px}
details.qa{background:#fff;border:1px solid #d7deea;border-radius:10px;padding:8px 12px;margin:8px 0}
details.qa summary{cursor:pointer;font-weight:700;color:#1f3a5f;min-height:32px}
details.qa[open] summary{margin-bottom:6px}
sup.rf{font-size:.7em}
sup.rf a{text-decoration:none}
.chkt{font-weight:700;color:#1b7a43;margin-top:10px}
.newb{display:inline-block;font-size:.7em;background:#e07b00;color:#fff;border-radius:8px;padding:0 6px;margin-left:4px;vertical-align:middle}
</style></head>

    from += size;

<script>window.EDU_CONTENT = {"title":"안경원 직원 교육 · 시력검사 표준 업무 (웹 교재)","answer_base":0,"generated":"2026-11-10T12:39:52","source":"안경원_시력검사_직원교육교재.docx (버전 1.0, 2026-11) + 웹판 추가 10~13장","chapters":[{"id":"g01","no":"0","title":"교재 사용법과 역할 구분","page":"g01.html","intro":"","key_points":["근시·원시·난시는 따로 검사하지 않고 하나의 통합 굴절검사 결과(S·C·Ax)에서 읽어 낸다.","굴절검사·처방·조제는 안경사 업무 . 비면허 직원은 접수·안내·단순 보조까지.","검영기·약제(산동·조절마비) 사용은 안경사도 할 수 없다(의사 업무)."],"sections":[{"id":"g01-intro","title":"개요","html":"\u003cp>이 교재는 안경원에서 이루어지는 시력검사·굴절검사 과정을 \u003cb>처음부터 끝까지 하나의 흐름\u003c/b>으로 이해하도록 구성했습니다. 앞부분(1~2장)은 전체 흐름과 이론, 가운데(3~6장)는 실제 검사 절차와 장비, 뒷부분(7~9장)은 고객 응대, 사례, 자주 하는 실수를 다룹니다.\u003c/p>\u003cdiv class=\"box star\">\u003cb>핵심 메시지:\u003c/b> 근시·원시·난시는 각각 다른 검사로 &#x27;따로&#x27; 찾아내는 것이 아니라, \u003cb>하나의 통합 굴절검사\u003c/b>를 통해 동시에 결정됩니다. 굴절검사 결과로 나오는 구면도수(S)·원주도수(C)·축(Ax)의 부호와 크기를 읽으면 근시인지, 원시인지, 어떤 난시인지가 자동으로 정해집니다(4장).\u003c/div>\u003cfigure class=\"gf\" id=\"fig0-1\">\u003csvg class=\"fig\" viewBox=\"0 0 360 268\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"안경사와 비면허 직원의 업무 구분\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003crect x=\"10.0\" y=\"10.0\" width=\"165.0\" height=\"40.0\" rx=\"10\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"92.5\" y=\"35.0\" font-size=\"14\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >안경사(면허)\u003c/text>\u003crect x=\"185.0\" y=\"10.0\" width=\"165.0\" height=\"40.0\" rx=\"10\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"2\" />\u003ctext x=\"267.5\" y=\"35.0\" font-size=\"14\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >비면허 직원\u003c/text>\u003crect x=\"10.0\" y=\"62.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003crect x=\"185.0\" y=\"62.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003ctext x=\"92.0\" y=\"80.0\" font-size=\"12.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >굴절검사(오토·자각)\u003c/text>\u003ctext x=\"267.0\" y=\"80.0\" font-size=\"12.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"bold\" >✕\u003c/text>\u003crect x=\"10.0\" y=\"92.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003crect x=\"185.0\" y=\"92.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003ctext x=\"92.0\" y=\"110.0\" font-size=\"12.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >처방 결정·도수 설명\u003c/text>\u003ctext x=\"267.0\" y=\"110.0\" font-size=\"12.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"bold\" >✕\u003c/text>\u003crect x=\"10.0\" y=\"122.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003crect x=\"185.0\" y=\"122.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003ctext x=\"92.0\" y=\"140.0\" font-size=\"12.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >안경 조제(가공)\u003c/text>\u003ctext x=\"267.0\" y=\"140.0\" font-size=\"12.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"bold\" >✕ 세척·포장만\u003c/text>\u003crect x=\"10.0\" y=\"152.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003crect x=\"185.0\" y=\"152.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003ctext x=\"92.0\" y=\"170.0\" font-size=\"12.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >PD·렌즈미터\u003c/text>\u003ctext x=\"267.0\" y=\"170.0\" font-size=\"12.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >△ 보조만\u003c/text>\u003crect x=\"10.0\" y=\"182.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003crect x=\"185.0\" y=\"182.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003ctext x=\"92.0\" y=\"200.0\" font-size=\"12.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >접수·문진표 안내\u003c/text>\u003ctext x=\"267.0\" y=\"200.0\" font-size=\"12.5\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >○\u003c/text>\u003crect x=\"10.0\" y=\"212.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003crect x=\"185.0\" y=\"212.0\" width=\"165.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#c9d3e3\" stroke-width=\"1\" />\u003ctext x=\"92.0\" y=\"230.0\" font-size=\"12.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >검영기·약제\u003c/text>\u003ctext x=\"267.0\" y=\"230.0\" font-size=\"12.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"bold\" >✕ (의사)\u003c/text>\u003ctext x=\"92.0\" y=\"241.0\" font-size=\"1\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >\u003c/text>\u003ctext x=\"180.0\" y=\"262.0\" font-size=\"11.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >검영기·약제 사용은 안경사도 불가(의사 업무)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 0-1.\u003c/b> 안경사와 비면허 직원의 업무 구분\u003c/figcaption>\u003c/figure>"},{"id":"s0-1","title":"역할 구분 (법적 업무범위 반영)","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>업무\u003c/th>\u003cth>안경사(면허)\u003c/th>\u003cth>비면허 직원\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>접수·대기 안내, 고객정보(동의서) 접수\u003c/td>\u003ctd>○\u003c/td>\u003ctd>○ (개인정보 처리 교육 이수 후)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>문진표 작성 보조(고객이 직접 기재하도록 안내)\u003c/td>\u003ctd>○\u003c/td>\u003ctd>○ (판단·해석은 안경사)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기존 안경 렌즈미터 측정·PD 측정\u003c/td>\u003ctd>○\u003c/td>\u003ctd>△ 원장 지시에 따른 보조 수준. 결과 판단·처방 반영은 안경사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자동굴절검사기(오토레프) 측정\u003c/td>\u003ctd>○\u003c/td>\u003ctd>✕ (타각적 굴절검사 = 안경사 업무)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자각적 굴절검사(포롭터·시험테)\u003c/td>\u003ctd>○\u003c/td>\u003ctd>✕\u003c/td>\u003c/tr>\u003ctr>\u003ctd>처방 결정, 도수 설명\u003c/td>\u003ctd>○\u003c/td>\u003ctd>✕ (안경사에게 연결)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>안경 조제(가공)·피팅\u003c/td>\u003ctd>○ (조제는 안경사 업무)\u003c/td>\u003ctd>✕ 조제 불가. 세척·포장 등 단순 보조만\u003c/td>\u003c/tr>\u003ctr>\u003ctd>콘택트렌즈 판매·사용법/부작용 안내\u003c/td>\u003ctd>○ (법상 정보제공 의무)\u003c/td>\u003ctd>✕\u003c/td>\u003c/tr>\u003ctr>\u003ctd>검영기(레티노스코프) 검사, 약제(산동·조절마비제) 사용\u003c/td>\u003ctd>✕ (의사 업무)\u003c/td>\u003ctd>✕\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"note\">※ 근거: 「의료기사 등에 관한 법률」 제1조의2·제9조·제12조, 같은 법 시행령 [별표 1] 제8호. 비면허 직원의 보조 범위는 각 안경원 개설 안경사(원장)가 법령 범위 안에서 정하며, &#x27;△&#x27; 항목은 해석이 갈릴 수 있으므로 보수적으로 운영하십시오.\u003c/p>"}],"questions":[{"id":"g01-q1","question":"비면허 직원이 할 수 있는 일은?","choices":["자동굴절검사기 측정","자각적 굴절검사","접수·문진표 배부 안내","처방 도수 설명"],"answer_index":2,"explanation":"굴절검사·처방 설명은 안경사 업무예요. 직원은 접수·안내·단순 보조까지(0장 표).","page":"g01.html"},{"id":"g01-q2","question":"근시·원시·난시는 어떻게 구분하나요?","choices":["각각 다른 검사를 따로 한다","통합 굴절검사의 S·C·Ax 값으로 읽는다","오토레프 값만 본다","시력표 줄 수로 정한다"],"answer_index":1,"explanation":"하나의 통합 굴절검사로 S·C·Ax를 얻고 부호와 크기로 판정해요(4장).","page":"g01.html"}]},{"id":"g02","no":"1","title":"통합 검사 흐름도","page":"g02.html","intro":"","key_points":["각 단계의 결과가 다음 단계의 출발점 : 기존 안경·오토레프 → 자각 검사 시작값.","원거리 처방은 조절이 쉬는 상태 에서 찾는다 → 운무·최대 플러스 원칙.","위험 신호가 보이면 판매보다 안과 안내 가 먼저."],"sections":[{"id":"g02-intro","title":"통합 검사 흐름도","html":"\u003cp>안경 처방을 위한 검사는 아래 순서로 진행합니다. 각 단계의 결과는 다음 단계의 &#x27;출발점&#x27;이 됩니다. 예를 들어 기존 안경 도수와 자동굴절검사 값은 자각적 굴절검사의 시작값이 되고, 자각적 검사 결과는 양안균형·가입도·착용 테스트로 이어집니다. 미국검안협회(AOA) 성인 종합 검사 지침도 문진, 시력 측정, 굴절 상태 결정(기존 안경 측정, 타각적·자각적 굴절검사), 안구운동·양안시·조절 평가를 기본 구성으로 제시합니다.\u003c/p>\u003cfigure class=\"gf\" id=\"fig1-1\">\u003csvg class=\"fig\" viewBox=\"0 0 360 510\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"안경원 통합 검사 흐름도\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g21f3a5f \"212.0\" x2=\"271.0\" y2=\"212.0\" stroke=\"#c0392b\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\" marker-end=\"url(#g2c0392b)\" />\u003ctext x=\"312.0\" y=\"290.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"normal\" >④에서 근시·원시\u003c/text>\u003ctext x=\"312.0\" y=\"305.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"normal\" >·난시가 한꺼번에\u003c/text>\u003ctext x=\"312.0\" y=\"320.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"normal\" >결정돼요\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 1-1.\u003c/b> 안경원 통합 검사 흐름도\u003c/figcaption>\u003c/figure>\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>단계\u003c/th>\u003cth>검사 항목\u003c/th>\u003cth>주요 결과물\u003c/th>\u003cth>다음 단계로 넘기는 정보\u003c/th>\u003cth>담당\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>① 예비검사\u003c/td>\u003ctd>문진(증상·병력·생활환경·복약)\u003c/td>\u003ctd>주소(主訴), 위험 신호 유무\u003c/td>\u003ctd>안과 의뢰 필요 여부, 검사 초점\u003c/td>\u003ctd>안경사(접수 보조: 직원)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>기존 안경 측정(렌즈미터)\u003c/td>\u003ctd>기존 S/C/Ax/ADD/프리즘, 광학중심\u003c/td>\u003ctd>자각 검사 시작값, 도수 변화량 비교\u003c/td>\u003ctd>안경사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>동공간거리(PD)\u003c/td>\u003ctd>원용/근용 PD(단안 PD)\u003c/td>\u003ctd>포롭터·시험테 PD 세팅, 안경 조제\u003c/td>\u003ctd>안경사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>② 시력검사\u003c/td>\u003ctd>나안시력·기존 안경 교정시력(원/근, 단안/양안)\u003c/td>\u003ctd>기준 시력\u003c/td>\u003ctd>굴절검사 후 개선 정도 비교\u003c/td>\u003ctd>안경사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>③ 타각적 굴절검사\u003c/td>\u003ctd>자동굴절검사기(오토레프/오토케라토)\u003c/td>\u003ctd>객관적 굴절값, 각막곡률\u003c/td>\u003ctd>자각 검사 시작값, 각막난시 참고\u003c/td>\u003ctd>안경사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>④ 자각적 굴절검사\u003c/td>\u003ctd>운무 → 구면 MPMVA → 난시(난시표/JCC 축·도수) → 구면 재확인(적록) → 양안균형\u003c/td>\u003ctd>단안별 최종 원용 처방\u003c/td>\u003ctd>양안시·근용 검사의 기준 처방\u003c/td>\u003ctd>안경사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⑤ 양안시·사위\u003c/td>\u003ctd>커버테스트, 마독스, 입체시, 폭주근점 등\u003c/td>\u003ctd>사위·사시 여부, 양안 협응\u003c/td>\u003ctd>프리즘 고려 여부, 안과 의뢰 여부\u003c/td>\u003ctd>안경사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⑥ 조절·근용\u003c/td>\u003ctd>근점, 조절력, 가입도(ADD)\u003c/td>\u003ctd>근용 처방/ADD\u003c/td>\u003ctd>렌즈 종류 결정(단초점·누진 등)\u003c/td>\u003ctd>안경사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⑦ 처방 결정·착용 테스트\u003c/td>\u003ctd>시험테로 원/근거리 실제 착용, 보행\u003c/td>\u003ctd>최종 처방, 상담 기록\u003c/td>\u003ctd>조제 지시서\u003c/td>\u003ctd>안경사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>⑧ 조제·피팅·사후관리\u003c/td>\u003ctd>가공, 피팅, 인도 시 확인, 적응 안내\u003c/td>\u003ctd>완성 안경\u003c/td>\u003ctd>재방문·재검 예약\u003c/td>\u003ctd>안경사\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"box star\">\u003cb>한눈에 보는 원칙\u003c/b>\u003cul>\u003cli>근시·원시·난시는 ④ 자각적 굴절검사(③ 타각적 검사로 시작값 확보) 한 흐름에서 동시에 결정된다.\u003c/li>\u003cli>검사는 &#x27;조절(초점 맞추는 힘)이 쉬는 상태&#x27;에서 원거리 처방을 찾는 것이 기본 — 그래서 운무(fogging)와 &#x27;최대 플러스&#x27; 원칙을 쓴다.\u003c/li>\u003cli>검사 중 질환 의심 신호(급격한 시력저하, 통증, 충혈, 섬광·비문증, 교정해도 시력이 나오지 않음 등)가 보이면 판매보다 안과 안내가 먼저다.\u003c/li>\u003c/ul>\u003c/div>"}],"questions":[{"id":"g02-q1","question":"자각적 굴절검사의 시작값으로 쓰는 것은?","choices":["핀홀 시력","기존 안경 도수·오토레프 값","근점 거리","입체시 결과"],"answer_index":1,"explanation":"기존 안경과 오토레프 값이 자각 검사의 출발점이에요.","page":"g02.html"},{"id":"g02-q2","question":"검사 중 섬광·비문증이 새로 생겼다는 고객에게 먼저 할 일은?","choices":["끝까지 굴절검사","안과 진료 안내","ADD 추가","렌즈 추천"],"answer_index":1,"explanation":"위험 신호는 판매·검사보다 안과 안내가 먼저예요(당일 의뢰).","page":"g02.html"}]},{"id":"g03","no":"2","title":"기초 이론 – 눈·굴절·조절","page":"g03.html","intro":"\u003cp>검사 절차를 &#x27;외우는&#x27; 것보다 &#x27;왜 그렇게 하는지&#x27; 이해하면 예외 상황에서도 올바르게 판단할 수 있습니다. 이 장은 검사에 직접 필요한 이론만 추렸습니다.\u003c/p>","key_points":["D = 1 ÷ 초점거리(m). +는 모으고(원시·노안), −는 퍼뜨린다(근시).","근시는 초점이 망막 앞 , 원시는 뒤 , 난시는 두 초선. 교정렌즈는 원점을 무한원으로 옮긴다.","조절 개입 → 근시 과대·원시 과소 측정. SE = S + C/2.","고도수(±4 D 이상)는 정점간거리 영향: Fc = F ÷ (1 − dF)."],"sections":[{"id":"s2-1","title":"2.1 눈의 구조와 굴절 관련 기능","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>구조\u003c/th>\u003cth>위치·형태\u003c/th>\u003cth>굴절·검사와의 관련성\u003c/th>\u003cth>검사·상담 시 포인트\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>각막 (cornea)\u003c/td>\u003ctd>눈 앞쪽의 투명한 돔 모양 조직\u003c/td>\u003ctd>눈 전체 굴절력의 가장 큰 부분을 담당. 각막 곡률이 경선(방향)마다 다르면 각막난시가 생김\u003c/td>\u003ctd>오토케라토미터로 곡률(K값) 측정. 불규칙한 측정상(마이어 왜곡)·불안정한 값은 원추각막·건성안 등 의심 신호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>눈물막 (tear film)\u003c/td>\u003ctd>각막 표면을 덮는 얇은 층\u003c/td>\u003ctd>매끄러운 광학면을 만들어 줌. 건조하면 시력이 깜빡일 때마다 변동\u003c/td>\u003ctd>자동굴절·각막곡률 값이 흔들리면 깜빡임 후 재측정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>홍채·동공\u003c/td>\u003ctd>각막 뒤 색을 띠는 조직, 가운데 구멍이 동공\u003c/td>\u003ctd>동공 크기는 초점 깊이(피사계 심도)와 수차에 영향. 동공이 작으면 흐림이 덜 느껴짐\u003c/td>\u003ctd>밝은 조명에서는 작은 도수 차이를 덜 구분 → 검사실 조명 일정하게\u003c/td>\u003c/tr>\u003ctr>\u003ctd>수정체 (crystalline lens)\u003c/td>\u003ctd>홍채 뒤 볼록렌즈 모양\u003c/td>\u003ctd>두께(곡률)를 바꿔 초점을 조절. 나이가 들면 탄력이 줄어 노안. 혼탁해지면 백내장\u003c/td>\u003ctd>교정해도 시력이 안 나오면 수정체·망막 문제 가능성 → 안과 의뢰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>모양체근 (ciliary muscle)\u003c/td>\u003ctd>수정체 주변을 둘러싼 고리 모양 근육\u003c/td>\u003ctd>수축하면 소대가 느슨해져 수정체가 두꺼워짐(=조절)\u003c/td>\u003ctd>근거리 작업 후 모양체근 긴장이 남아 있으면 근시가 과대 측정될 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>소대 (zonules, 섬모소대)\u003c/td>\u003ctd>모양체와 수정체를 잇는 가는 섬유\u003c/td>\u003ctd>모양체근 이완 시 팽팽 → 수정체 얇아짐(원거리), 수축 시 느슨 → 두꺼워짐(근거리)\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>유리체 (vitreous)\u003c/td>\u003ctd>수정체 뒤 젤 형태\u003c/td>\u003ctd>나이가 들며 액화·수축 → 비문증(날파리증) 원인이 될 수 있음\u003c/td>\u003ctd>새로 생긴 비문증·섬광은 망막 열공·박리 신호일 수 있어 안과 의뢰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>망막·황반 (retina, macula)\u003c/td>\u003ctd>눈 안쪽 벽의 감각막. 중심부가 황반\u003c/td>\u003ctd>상이 맺히는 &#x27;스크린&#x27;. 황반이 선명한 중심시력 담당\u003c/td>\u003ctd>교정시력 저하, 사물이 휘어 보임(변시증)은 안과 의뢰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>안축장 (axial length)\u003c/td>\u003ctd>각막에서 망막까지의 길이\u003c/td>\u003ctd>같은 굴절력이라도 안축이 길면 근시, 짧으면 원시(축성 굴절이상). 성장기 근시 진행은 주로 안축 증가와 관련\u003c/td>\u003ctd>안경원 장비로는 보통 측정하지 않음. 근시 진행 관리 상담은 안과로\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u0 5장 Hofstetter 공식)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig2-6\">\u003csvg class=\"fig\" viewBox=\"0 0 380 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"원점과 근점, 조절력\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g81b7a43\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1b7a43\"/>\u003c/marker>\u003c/defs>\u003cellipse cx=\"345.0\" cy=\"70.0\" rx=\"22.0\" ry=\"18.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003cpath d=\"M327,61 Q318,70 327,79\" stroke=\"#1f3a5f\" fill=\"#cfe6ff\" stroke-width=\"2\" />\u003cline x1=\"20.0\" y1=\"70.0\" x2=\"322.0\" y2=\"70.0\" stroke=\"#666\" stroke-width=\"1.2\" />\u003cline x1=\"42.0\" y1=\"65.0\" x2=\"42.0\" y2=\"75.0\" stroke=\"#666\" stroke-width=\"1.2\" />\u003ctext x=\"42.0\" y=\"90.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >1 m\u003c/text>\u003cline x1=\"182.0\" y1=\"65.0\" x2=\"182.0\" y2=\"75.0\" stroke=\"#666\" stroke-width=\"1.2\" />\u003ctext x=\"182.0\" y=\"90.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >50 cm\u003c/text>\u003cline x1=\"252.0\" y1=\"65.0\" x2=\"252.0\" y2=\"75.0\" stroke=\"#666\" stroke-width=\"1.2\" />\u003ctext x=\"252.0\" y=\"90.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >25 cm\u003c/text>\u003ctext x=\"20.0\" y=\"22.0\" font-size=\"13\" fill=\"#2a6fdb\" text-anchor=\"start\" font-weight=\"bold\" >근시 −2.00 D 의 원점\u003c/text>\u003ccircle cx=\"182.0\" cy=\"70.0\" r=\"5.0\" fill=\"#2a6fdb\" stroke=\"#2a6fdb\" stroke-width=\"1\" />\u003ctext x=\"182.0\" y=\"58.0\" font-size=\"12\" fill=\"#2a6fdb\" text-anchor=\"middle\" font-weight=\"bold\" >원점 50 cm\u003c/text>\u003cline x1=\"30.0\" y1=\"40.0\" x2=\"174.0\" y2=\"40.0\" stroke=\"#2a6fdb\" stroke-width=\"1\" stroke-dasharray=\"3 3\" />\u003ctext x=\"80.0\" y=\"34.0\" font-size=\"11\" fill=\"#2a6fdb\" text-anchor=\"middle\" font-weight=\"normal\" >더 먼 것은 흐림\u003c/text>\u003cellipse cx=\"345.0\" cy=\"180.0\" rx=\"22.0\" ry=\"18.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003cpath d=\"M327,171 Q318,180 327,189\" stroke=\"#1f3a5f\" fill=\"#cfe6ff\" stroke-width=\"2\" />\u003cline x1=\"20.0\" y1=\"180.0\" x2=\"322.0\" y2=\"180.0\" stroke=\"#666\" stroke-width=\"1.2\" />\u003cline x1=\"42.0\" y1=\"175.0\" x2=\"42.0\" y2=\"185.0\" stroke=\"#666\" stroke-width=\"1.2\" />\u003ctext x=\"42.0\" y=\"200.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >1 m\u003c/text>\u003cline x1=\"182.0\" y1=\"175.0\" x2=\"182.0\" y2=\"185.0\" stroke=\"#666\" stroke-width=\"1.2\" />\u003ctext x=\"182.0\" y=\"200.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >50 cm\u003c/text>\u003cline x1=\"252.0\" y1=\"175.0\" x2=\"252.0\" y2=\"185.0\" stroke=\"#666\" stroke-width=\"1.2\" />\u003ctext x=\"252.0\" y=\"200.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >25 cm\u003c/text>\u003ccircle cx=\"252.0\" cy=\"180.0\" r=\"5.0\" fill=\"#1b7a43\" stroke=\"#1b7a43\" stroke-width=\"1\" />\u003ctext x=\"252.0\" y=\"168.0\" font-size=\"12\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >근점 25 cm\u003c/text>\u003cline x1=\"252.0\" y1=\"152.0\" x2=\"20.0\" y2=\"152.0\" stroke=\"#1b7a43\" stroke-width=\"1.5\" marker-end=\"url(#g81b7a43)\" />\u003ctext x=\"150.0\" y=\"146.0\" font-size=\"11\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"normal\" >원점 = 무한원(정시)\u003c/text>\u003ctext x=\"20.0\" y=\"125.0\" font-size=\"13\" fill=\"#1b7a43\" text-anchor=\"start\" font-weight=\"bold\" >정시 · 조절력 4 D 의 근점\u003c/text>\u003crect x=\"10.0\" y=\"212.0\" width=\"360.0\" height=\"32.0\" rx=\"8\" fill=\"#fff8ec\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003ctext x=\"190.0\" y=\"233.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >원점 = 1 ÷ |근시 D| · 조절력 ≈ 1 ÷ 근점(m) (교정된 눈)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 2-6.\u003c/b> 원점과 근점, 조절력\u003c/figcaption>\u003c/figure>\u003ch3>구면등가와 정점간거리\u003c/h3>\u003cul>\u003cli>\u003cb>구면등가(SE) = 구면도수 + 원주도수/2\u003c/b>. 예) S −2.00 C −1.00 → SE = −2.50D. 난시를 덜 넣거나 뺄 때 SE를 유지하면 &#x27;최소착란원&#x27;이 망막에 유지되어 선명도 손실이 적음.\u003c/li>\u003cli>\u003cb>정점간거리(vertex distance)\u003c/b>: 렌즈 뒷면과 각막 사이 거리(일반적으로 약 12mm 내외로 가정). 고도수(대략 ±4.00D 이상)에서는 거리 변화가 실제 효과 도수에 영향. 각막면 환산 도수 Fc = F ÷ (1 − d×F) (d: 미터). 예) −8.00D를 12mm에서 → 각막면 약 −7.30D. 콘택트렌즈 도수 환산이나 시험테-안경테 정점간거리 차이를 고려할 때 사용.\u003c/li>\u003c/ul>\u003cfigure class=\"gf\" id=\"fig2-7\">\u003csvg class=\"fig\" viewBox=\"0 0 380 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"정점간거리와 고도수 렌즈의 효과 도수\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g9e07b00\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#e07b00\"/>\u003c/marker>\u003c/defs>\u003cellipse cx=\"300.0\" cy=\"80.0\" rx=\"48.0\" ry=\"44.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003cpath d=\"M260,54 Q244,80 260,106\" stroke=\"#1f3a5f\" fill=\"#cfe6ff\" stroke-width=\"2\" />\u003cpath d=\"M197.8,34 L212.2,34 Q203.2,80 212.2,126 L197.8,126 Q206.8,80 197.8,34 Z\" stroke=\"#2a6fdb\" fill=\"#cfe6ff\" stroke-width=\"2\" />\u003cline x1=\"212.0\" y1=\"136.0\" x2=\"250.0\" y2=\"136.0\" stroke=\"#e07b00\" stroke-width=\"1.5\" marker-end=\"url(#g9e07b00)\" marker-start=\"url(#g9e07b00)\" />\u003ctext x=\"231.0\" y=\"154.0\" font-size=\"12\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >약 12 mm\u003c/text>\u003ctext x=\"200.0\" y=\"24.0\" font-size=\"11\" fill=\"#2a6fdb\" text-anchor=\"middle\" font-weight=\"normal\" >렌즈\u003c/text>\u003ctext x=\"262.0\" y=\"18.0\" font-size=\"11\" fill=\"#1f3a5f\" text-anchor=\"start\" font-weight=\"normal\" >각막 정점\u003c/text>\u003crect x=\"10.0\" y=\"20.0\" width=\"170.0\" height=\"110.0\" rx=\"10\" fill=\"#fff8ec\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003ctext x=\"95.0\" y=\"42.0\" font-size=\"13\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >Fc = F ÷ (1 − d·F)\u003c/text>\u003ctext x=\"95.0\" y=\"62.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >d: 미터, F: 안경 도수\u003c/text>\u003ctext x=\"95.0\" y=\"86.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >−8.00 D @ 12 mm\u003c/text>\u003ctext x=\"95.0\" y=\"104.0\" font-size=\"12\" fill=\"#2a6fdb\" text-anchor=\"middle\" font-weight=\"bold\" >→ 각막면 약 −7.30 D\u003c/text>\u003ctext x=\"95.0\" y=\"122.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >±4.00 D 이상이면 계산\u003c/text>\u003ctext x=\"190.0\" y=\"190.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"normal\" >근시 렌즈를 눈에 가까이 할수록(CL) 필요한 마이너스가 줄어요\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 2-7.\u003c/b> 정점간거리와 고도수 렌즈의 효과 도수\u003c/figcaption>\u003c/figure>\u003cdiv class=\"box term\">\u003cb>🧪 직접 해 보기: 굴절이상과 교정렌즈 → 초점은 어디에?\u003c/b>\u003cp>숫자를 바꿔 보는 실습은 교재 페이지에서 할 수 있어요.\u003c/p>\u003cp>\u003ca class=\"btn l\" href=\"g03.html#lab-focus\">교재 페이지에서 실습 열기 →\u003c/a>\u003c/p>\u003c/div>"},{"id":"s2-3","title":"2.3 조절의 원리","html":"\u003cp>가까운 물체에서 오는 빛은 퍼지면서(발산) 들어오므로, 눈은 굴절력을 늘려야 망막에 초점을 맞출 수 있습니다. 이 과정을 \u003cb>조절(accommodation)\u003c/b>이라 하며, 일반적으로 다음과 같이 설명합니다(Helmholtz 이론).\u003c/p>\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>상태\u003c/th>\u003cth>모양체근\u003c/th>\u003cth>소대\u003c/th>\u003cth>수정체\u003c/th>\u003cth>결과\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>먼 곳 볼 때 (조절 이완)\u003c/td>\u003ctd>이완\u003c/td>\u003ctd>팽팽하게 당김\u003c/td>\u003ctd>얇고 평평해짐\u003c/td>\u003ctd>굴절력 감소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>가까운 곳 볼 때 (조절)\u003c/td>\u003ctd>수축\u003c/td>\u003ctd>느슨해짐\u003c/td>\u003ctd>탄성으로 두꺼워짐(특히 앞면)\u003c/td>\u003ctd>굴절력 증가\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig2-8\">\u003csvg class=\"fig\" viewBox=\"0 0 380 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"조절의 원리(Helmholtz): 먼 곳 볼 때와 가까운 곳 볼 때\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003crect x=\"10.0\" y=\"8.0\" width=\"175.0\" height=\"234.0\" rx=\"12\" fill=\"#fff\" stroke=\"#d7deea\" stroke-width=\"1\" />\u003ctext x=\"98.0\" y=\"30.0\" font-size=\"13.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >먼 곳: 조절 이완\u003c/text>\u003cellipse cx=\"80.0\" cy=\"130.0\" rx=\"9.0\" ry=\"40.0\" fill=\"#cfe6ff\" stroke=\"#2a6fdb\" stroke-width=\"2\" />\u003cellipse cx=\"80.0\" cy=\"62.0\" rx=\"22.0\" ry=\"8.0\" fill=\"#f1c3c3\" stroke=\"#a35a5a\" stroke-width=\"1.5\" />\u003cellipse cx=\"80.0\" cy=\"198.0\" rx=\"22.0\" ry=\"8.0\" fill=\"#f1c3c3\" stroke=\"#a35a5a\" stroke-width=\"1.5\" />\u003cline x1=\"72.0\" y1=\"70.0\" x2=\"76.0\" y2=\"92.0\" stroke=\"#666\" stroke-width=\"1.3\" />\u003cline x1=\"72.0\" y1=\"190.0\" x2=\"76.0\" y2=\"168.0\" stroke=\"#666\" stroke-width=\"1.3\" />\u003cline x1=\"80.0\" y1=\"70.0\" x2=\"80.0\" y2=\"92.0\" stroke=\"#666\" stroke-width=\"1.3\" />\u003cline x1=\"80.0\" y1=\"190.0\" x2=\"80.0\" y2=\"168.0\" stroke=\"#666\" stroke-width=\"1.3\" />\u003cline x1=\"88.0\" y1=\"70.0\" x2=\"84.0\" y2=\"92.0\" stroke=\"#666\" stroke-width=\"1.3\" />\u003cline x1=\"88.0\" y1=\"190.0\" x2=\"84.0\" y2=\"168.0\" stroke=\"#666\" stroke-width=\"1.3\" />\u003cline x1=\"98.0\" y1=\"62.0\" x2=\"122.0\" y2=\"50.0\" stroke=\"#a35a5a\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"98.0\" cy=\"62.0\" r=\"2.2\" fill=\"#a35a5a\" stroke=\"#a35a5a\" stroke-width=\"1\" />\u003ctext x=\"122.0\" y=\"48.0\" font-size=\"11\" fill=\"#a35a5a\" text-anchor=\"start\" font-weight=\"normal\" >모양체근\u003c/text>\u003ctext x=\"160.0\" y=\"62.0\" font-size=\"11\" fill=\"#a35a5a\" text-anchor=\"middle\" font-weight=\"normal\" >(이완)\u003c/text>\u003cline x1=\"84.0\" y1=\"82.0\" x2=\"124.0\" y2=\"96.0\" stroke=\"#666\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"84.0\" cy=\"82.0\" r=\"2.2\" fill=\"#666\" stroke=\"#666\" stroke-width=\"1\" />\u003ctext x=\"124.0\" y=\"110.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"start\" font-weight=\"normal\" >소대 팽팽\u003c/text>\u003cline x1=\"89.0\" y1=\"136.0\" x2=\"124.0\" y2=\"144.0\" stroke=\"#2a6fdb\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"89.0\" cy=\"136.0\" r=\"2.2\" fill=\"#2a6fdb\" stroke=\"#2a6fdb\" stroke-width=\"1\" />\u003ctext x=\"124.0\" y=\"158.0\" font-size=\"11\" fill=\"#2a6fdb\" text-anchor=\"start\" font-weight=\"normal\" >수정체\u003c/text>\u003ctext x=\"98.0\" y=\"232.0\" font-size=\"12\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >얇음 → 굴절력 ↓\u003c/text>\u003crect x=\"195.0\" y=\"8.0\" width=\"175.0\" height=\"234.0\" rx=\"12\" fill=\"#fff\" stroke=\"#d7deea\" stroke-width=\"1\" />\u003ctext x=\"283.0\" y=\"30.0\" font-size=\"13.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >가까운 곳: 조절\u003c/text>\u003cellipse cx=\"265.0\" cy=\"130.0\" rx=\"18.0\" ry=\"40.0\" fill=\"#cfe6ff\" stroke=\"#2a6fdb\" stroke-width=\"2\" />\u003cellipse cx=\"265.0\" cy=\"68.0\" rx=\"22.0\" ry=\"12.0\" fill=\"#f1c3c3\" stroke=\"#a35a5a\" stroke-width=\"1.5\" />\u003cellipse cx=\"265.0\" cy=\"192.0\" rx=\"22.0\" ry=\"12.0\" fill=\"#f1c3c3\" stroke=\"#a35a5a\" stroke-width=\"1.5\" />\u003cpath d=\"M257,80 q7,6 4.0,12\" stroke=\"#666\" fill=\"none\" stroke-width=\"1.1\" />\u003cpath d=\"M257,180 q7,-6 4.0,-12\" stroke=\"#666\" fill=\"none\" stroke-width=\"1.1\" />\u003cpath d=\"M265,80 q7,6 0.0,12\" stroke=\"#666\" fill=\"none\" stroke-width=\"1.1\" />\u003cpath d=\"M265,180 q7,-6 0.0,-12\" stroke=\"#666\" fill=\"none\" stroke-width=\"1.1\" />\u003cpath d=\"M273,80 q7,6 -4.0,12\" stroke=\"#666\" fill=\"none\" stroke-width=\"1.1\" />\u003cpath d=\"M273,180 q7,-6 -4.0,-12\" stroke=\"#666\" fill=\"none\" stroke-width=\"1.1\" />\u003cline x1=\"283.0\" y1=\"68.0\" x2=\"307.0\" y2=\"56.0\" stroke=\"#a35a5a\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"283.0\" cy=\"68.0\" r=\"2.2\" fill=\"#a35a5a\" stroke=\"#a35a5a\" stroke-width=\"1\" />\u003ctext x=\"307.0\" y=\"54.0\" font-size=\"11\" fill=\"#a35a5a\" text-anchor=\"start\" font-weight=\"normal\" >모양체근\u003c/text>\u003ctext x=\"345.0\" y=\"68.0\" font-size=\"11\" fill=\"#a35a5a\" text-anchor=\"middle\" font-weight=\"normal\" >(수축)\u003c/text>\u003cline x1=\"269.0\" y1=\"82.0\" x2=\"309.0\" y2=\"96.0\" stroke=\"#666\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"269.0\" cy=\"82.0\" r=\"2.2\" fill=\"#666\" stroke=\"#666\" stroke-width=\"1\" />\u003ctext x=\"309.0\" y=\"110.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"start\" font-weight=\"normal\" >소대 느슨\u003c/text>\u003cline x1=\"283.0\" y1=\"136.0\" x2=\"309.0\" y2=\"144.0\" stroke=\"#2a6fdb\" stroke-width=\"1\" opacity=\".8\"/>\u003ccircle cx=\"283.0\" cy=\"136.0\" r=\"2.2\" fill=\"#2a6fdb\" stroke=\"#2a6fdb\" stroke-width=\"1\" />\u003ctext x=\"309.0\" y=\"158.0\" font-size=\"11\" fill=\"#2a6fdb\" text-anchor=\"start\" font-weight=\"normal\" >수정체\u003c/text>\u003ctext x=\"283.0\" y=\"232.0\" font-size=\"12\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >두꺼움 → 굴절력 ↑\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 2-8.\u003c/b> 조절의 원리(Helmholtz): 먼 곳 볼 때와 가까운 곳 볼 때\u003c/figcaption>\u003c/figure>\u003cul>\u003cli>\u003cb>근거리 삼중반응(near triad)\u003c/b>: 가까이 볼 때 조절 + 폭주(두 눈이 안쪽으로 모임) + 동공 축소가 함께 일어남. 그래서 조절 이상은 사위·눈 피로와 연결됨(조절성 폭주).\u003c/li>\u003cli>조절은 \u003cb>두 눈에 같은 양\u003c/b>으로 일어남(Hering의 동등 신경지배 법칙). → 양안균형 검사가 필요한 이유(3.10).\u003c/li>\u003cli>검사 중 고객이 무의식적으로 조절하면 근시는 과대(−가 과하게), 원시는 과소 측정됨 → 운무법·최대 플러스 원칙·적록검사로 조절 개입을 줄임.\u003c/li>\u003cli>\u003cb>노안\u003c/b>은 나이가 들며 수정체 탄력이 줄어 조절력이 감소한 상태(질병이 아닌 생리적 변화). 근시·원시 여부와 무관하게 누구나 진행.\u003c/li>\u003c/ul>"},{"id":"s2-4","title":"2.4 굴절이상과 노안: 정의·원인·위험요인","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>정의\u003c/th>\u003cth>주요 원인\u003c/th>\u003cth>알려진 위험요인·관련 요인\u003c/th>\u003cth>전형적 증상\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>근시 (myopia)\u003c/td>\u003ctd>조절 휴식 시 평행광선이 망막 앞에 초점\u003c/td>\u003ctd>안축장 증가(축성)가 대부분, 각막·수정체 굴절력 과다(굴절성)\u003c/td>\u003ctd>부모의 근시(유전 소인), 장시간 근거리 작업, 실외활동 부족 등이 문헌에서 반복 보고됨. 고도근시는 망막 질환 위험과 관련되므로 정기 안과 검진 권고\u003c/td>\u003ctd>먼 곳 흐림, 눈 찡그림, 칠판·TV 가까이 봄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>원시 (hyperopia)\u003c/td>\u003ctd>조절 휴식 시 초점이 망막 뒤\u003c/td>\u003ctd>안축장이 짧음(축성), 굴절력 부족\u003c/td>\u003ctd>소아는 생리적 원시가 흔하고 성장하며 감소하는 경향. 젊을수록 조절로 보상(잠복원시)\u003c/td>\u003ctd>근거리 피로·두통, 독서 시 흐림. 고도이면 먼 곳도 흐림. 아동은 내사시·약시와 관련될 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>난시 (astigmatism)\u003c/td>\u003ctd>경선(방향)마다 굴절력이 달라 한 점에 초점이 맺히지 않음\u003c/td>\u003ctd>각막(대부분) 또는 수정체 곡률의 방향별 차이\u003c/td>\u003ctd>정난시(규칙난시): 두 주경선이 90°로 직교, 안경으로 교정 가능. 부정난시(불규칙난시): 주경선이 직교하지 않거나 불규칙(원추각막, 외상·수술 후 반흔, 각막 질환 등) → 안경으로 완전 교정 어려움, 안과 의뢰\u003c/td>\u003ctd>원·근 모두 흐림·겹침, 글자 번짐, 눈 피로, 두통\u003c/td>\u003c/tr>\u003ctr>\u003ctd>노안 (presbyopia)\u003c/td>\u003ctd>나이에 따른 조절력 감소로 근거리 초점이 어려운 상태\u003c/td>\u003ctd>수정체 경화·탄력 감소 등 노화\u003c/td>\u003ctd>나이(대개 40대 전후부터 자각). 원시는 더 일찍, 근시는 안경을 벗으면 늦게 느끼는 경향\u003c/td>\u003ctd>가까운 글씨를 멀리 떼어 봄, 어두운 곳에서 더 불편, 근거리 작업 후 피로\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig2-9\">\u003csvg class=\"fig\" viewBox=\"0 0 400 350\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"난시: 두 초선과 최소착란원(스텀 원뿔)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g112a6fdb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeig \u003cline x1=\"200.0\" y1=\"170.0\" x2=\"260.0\" y2=\"146.0\" stroke=\"#2a6fdb\" stroke-width=\"1.2\" opacity=\".5\"/>\u003cline x1=\"50.0\" y1=\"230.0\" x2=\"320.0\" y2=\"170.0\" stroke=\"#e07b00\" stroke-width=\"1.7\" stroke-dasharray=\"5 3\" />\u003cline x1=\"50.0\" y1=\"170.0\" x2=\"360.0\" y2=\"170.0\" stroke=\"#666\" stroke-width=\"0.8\" stroke-dasharray=\"2 3\" />\u003cline x1=\"120.0\" y1=\"68.0\" x2=\"120.0\" y2=\"104.0\" stroke=\"#666\" stroke-width=\"0.8\" stroke-dasharray=\"2 2\" />\u003cellipse cx=\"120.0\" cy=\"46.0\" rx=\"13.3\" ry=\"9.6\" fill=\"#fff\" stroke=\"#666\" stroke-width=\"2\" />\u003ctext x=\"120.0\" y=\"80.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"bold\" >가로 타원\u003c/text>\u003cline x1=\"200.0\" y1=\"68.0\" x2=\"200.0\" y2=\"104.0\" stroke=\"#666\" stroke-width=\"0.8\" stroke-dasharray=\"2 2\" />\u003cline x1=\"192.0\" y1=\"46.0\" x2=\"208.0\" y2=\"46.0\" stroke=\"#2a6fdb\" stroke-width=\"3\" />\u003ctext x=\"200.0\" y=\"96.0\" font-size=\"11\" fill=\"#2a6fdb\" text-anchor=\"middle\" font-weight=\"bold\" >앞초선(가로)\u003c/text>\u003cline x1=\"242.9\" y1=\"68.0\" x2=\"242.9\" y2=\"104.0\" stroke=\"#666\" stroke-width=\"0.8\" stroke-dasharray=\"2 2\" />\u003cellipse cx=\"242.9\" cy=\"46.0\" rx=\"5.1\" ry=\"5.1\" fill=\"#fff\" stroke=\"#1b7a43\" stroke-width=\"2\" />\u003ctext x=\"242.9\" y=\"80.0\" font-size=\"11\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >최소착란원\u003c/text>\u003cline x1=\"287.4\" y1=\"68.0\" x2=\"287.4\" y2=\"104.0\" stroke=\"#666\" stroke-width=\"0.8\" stroke-dasharray=\"2 2\" />\u003cellipse cx=\"287.4\" cy=\"46.0\" rx=\"2.2\" ry=\"10.5\" fill=\"#fff\" stroke=\"#666\" stroke-width=\"2\" />\u003ctext x=\"287.4\" y=\"96.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"bold\" >세로 타원\u003c/text>\u003cline x1=\"320.0\" y1=\"68.0\" x2=\"320.0\" y2=\"104.0\" stroke=\"#666\" stroke-width=\"0.8\" stroke-dasharray=\"2 2\" />\u003cline x1=\"320.0\" y1=\"31.6\" x2=\"320.0\" y2=\"60.4\" stroke=\"#e07b00\" stroke-width=\"3\" />\u003ctext x=\"320.0\" y=\"80.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >뒤초선(세로)\u003c/text>\u003ccircle cx=\"200.0\" cy=\"170.0\" r=\"3.5\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003ccircle cx=\"320.0\" cy=\"170.0\" r=\"3.5\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003ccircle cx=\"242.9\" cy=\"170.0\" r=\"4.0\" fill=\"#1b7a43\" stroke=\"#1b7a43\" stroke-width=\"1\" />\u003cline x1=\"50.0\" y1=\"258.0\" x2=\"200.0\" y2=\"258.0\" stroke=\"#2a6fdb\" stroke-width=\"1.3\" marker-end=\"url(#g112a6fdb)\" />\u003ctext x=\"125.0\" y=\"274.0\" font-size=\"11\" fill=\"#2a6fdb\" text-anchor=\"middle\" font-weight=\"normal\" >강주경선(수직) 초점거리\u003c/text>\u003cline x1=\"50.0\" y1=\"288.0\" x2=\"320.0\" y2=\"288.0\" stroke=\"#e07b00\" stroke-width=\"1.3\" marker-end=\"url(#g11e07b00)\" />\u003ctext x=\"215.0\" y=\"304.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"normal\" >약주경선(수평) 초점거리\u003c/text>\u003ctext x=\"10.0\" y=\"344.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"start\" font-weight=\"normal\" >파랑 실선 = 수직 경선 광선, 주황 점선 = 수평 경선 광선 (직난시 예)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 2-9.\u003c/b> 난시: 두 초선과 최소착란원(스텀 원뿔)\u003c/figcaption>\u003c/figure>\u003cdiv class=\"box bg\">\u003cb>통계 인용 주의\u003c/b>\u003cul>\u003cli>유병률·진행 속도 등 수치는 연구마다 다르므로 고객 상담 시 출처 없이 숫자를 말하지 않습니다. 근시 진행 억제 치료(약물 등)는 의료 영역이므로 &#x27;안과 상담&#x27;을 안내합니다.\u003c/li>\u003c/ul>\u003c/div>"}],"questions":[{"id":"g03-q1","question":"근시 눈에서 평행광선의 초점은?","choices":["망막 위","망막 앞","망막 뒤","두 초선"],"answer_index":1,"explanation":"근시는 초점이 망막 앞 → 오목(−)렌즈로 교정.","page":"g03.html"},{"id":"g03-q2","question":"초점거리 0.25 m 렌즈의 굴절력은?","choices":["0.25 D","2.50 D","4.00 D","25 D"],"answer_index":2,"explanation":"D = 1 ÷ 0.25 = 4.00 D.","page":"g03.html"},{"id":"g03-q3","question":"S −2.00 C −1.00의 구면등가는?","choices":["−2.00","−2.50","−3.00","−1.50"],"answer_index":1,"explanation":"SE = S + C/2 = −2.00 + (−0.50) = −2.50 D.","page":"g03.html"},{"id":"g03-q4","question":"가까운 곳을 볼 때 모양체근과 수정체는?","choices":["이완·얇아짐","수축·두꺼워짐","수축·얇아짐","이완·두꺼워짐"],"answer_index":1,"explanation":"모양체근 수축 → 소대 느슨 → 수정체가 두꺼워져 굴절력 증가.","page":"g03.html"}]},{"id":"g04","no":"3①","title":"검사 절차 ① 문진~타각적 검사","page":"g04.html","intro":"\u003cp>각 단계는 \u003cb>목적 → 방법 → 이론적 근거 → 주의 → 체크리스트\u003c/b> 순서로 정리했습니다. 체크리스트는 실습 평가표로도 사용할 수 있습니다. 구체적 수치(예: +0.75D 운무)는 교과서·임상 지침에서 흔히 쓰는 예시이며, 원장 판단에 따라 매장 표준을 정하십시오.\u003c/p>","key_points":["문진에서 위험 신호 5가지(급격한 저하·통증·충혈·섬광/비문·새 복시)를 꼭 묻는다.","렌즈미터는 렌즈 뒷면 을 받침에 대고 R부터. 기존 도수는 고객의 익숙한 기준점.","단안 PD를 2회 이상. 프렌티스: Δ = c(cm) × D.","교정시력 미달 → 핀홀 → 개선 없으면 안과. 오토레프 값은 참고값 ."],"sections":[{"id":"s3-1","title":"3.1 문진 (Case history)","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사 (문진표 배부·회수는 직원 가능)\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>방문 이유(주소)와 생활 시환경을 파악해 검사의 초점을 정함\u003c/li>\u003cli>\u003cb>질환 의심 신호(red flag)를 조기에 발견\u003c/b>해 안과 의뢰 여부 판단\u003c/li>\u003cli>기대치(원하는 결과)와 이전 불편 경험 확인\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>대기 중 문진표 작성 안내(직원) → 안경사가 문진표를 보며 구두로 보완 질문\u003c/li>\u003cli>주소: 언제부터, 어느 거리(원/중/근), 한쪽/양쪽, 지속/간헐, 악화 속도\u003c/li>\u003cli>안경·렌즈 사용력: 현재 안경 사용 기간, 콘택트렌즈 종류·착용 시간, 마지막 검사 시기\u003c/li>\u003cli>전신·눈 병력: 당뇨·고혈압 등, 안과 수술(라식·백내장 등), 녹내장·망막 질환 진단 여부, 복용 약물\u003c/li>\u003cli>가족력: 녹내장, 고도근시, 사시 등\u003c/li>\u003cli>생활환경: 직업, 하루 근거리/디지털 기기 사용 시간, 운전(야간 포함), 취미·운동\u003c/li>\u003cli>\u003cb>위험 신호 확인 질문\u003c/b>(7장 참고): 갑자기 안 보임, 통증, 충혈, 번쩍임·날파리, 겹쳐 보임(새로 발생), 시야 가림\u003c/li>\u003cli>기록: 고객의 표현을 가능한 그대로 기록(예: &#x27;모니터 글씨가 오후에 번진다&#x27;)\u003c/li>\u003c/ol>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>AOA 성인 종합 검사 지침은 시각·안과·전신 병력, 복약, 직업·여가의 시각 요구를 문진의 필수 요소로 제시함.\u003c/li>\u003cli>같은 굴절값이라도 생활 거리·용도에 따라 최적 처방이 달라짐 → 문진이 처방의 방향을 결정.\u003c/li>\u003cli>급성 증상은 굴절 문제가 아닐 수 있음 → 굴절검사보다 의뢰가 우선.\u003c/li>\u003c/ul>\u003cdiv class=\"box err\">\u003cb>주의\u003c/b>\u003cul>\u003cli>6세 이하 아동의 안경·콘택트렌즈는 의사의 처방에 따라 조제·판매해야 합니다(시행령 별표1).\u003c/li>\u003cli>위험 신호가 확인되면 검사를 무리하게 진행하지 말고 안과 진료를 우선 안내합니다.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>문진표에 개인정보·민감정보(건강정보) 수집 동의 절차 확인\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>주소(主訴)와 원하는 결과를 고객의 말로 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>안과 수술력·질환·복약 여부를 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>위험 신호 5가지(급격한 시력저하·통증·충혈·섬광/비문증·새로운 복시)를 질문했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>직업·근거리 작업 시간·운전 여부를 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>6세 이하 아동이면 의사 처방 필요함을 안내했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s3-2","title":"3.2 기존 안경 측정 (렌즈미터, Lensometry)","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>현재 사용 중인 처방(S·C·Ax·ADD·프리즘) 확인\u003c/li>\u003cli>새 처방과의 변화량 비교 → 적응 난이도 예측\u003c/li>\u003cli>광학중심·PD·누진 렌즈 설계(아이포인트) 확인\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>렌즈미터 영점·접안렌즈(수동식) 시도 조정 확인\u003c/li>\u003cli>안경을 \u003cb>안경다리가 아래로 향하게\u003c/b> 놓고 렌즈 뒷면을 렌즈 받침에 밀착, 오른쪽(R)부터 측정\u003c/li>\u003cli>광학중심에 맞춘 뒤 구면·원주·축 읽기(자동식은 화면 값 출력)\u003c/li>\u003cli>광학중심 점찍기 → 좌우 광학중심 간 거리로 안경 PD 확인, 수직 높이 차이 확인\u003c/li>\u003cli>프리즘이 들어 있으면 방향(BI/BO/BU/BD)과 양 기록\u003c/li>\u003cli>누진/이중초점: 원용 측정부와 근용 측정부에서 각각 측정 → 차이 = ADD. 누진은 숨김각인으로 설계 확인\u003c/li>\u003cli>측정값을 기록지 &#x27;기존 안경&#x27; 칸에 기록, 사용 기간 메모\u003c/li>\u003c/ol>\u003cp class=\"link1\">🔗 \u003ca href=\"#s/s6-3\">렌즈미터 구조 그림은 6.3절\u003c/a>에서 볼 수 있어요.\u003c/p>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>안경 처방은 &#x27;안경 기준&#x27;(렌즈 뒷면 정점 굴절력)으로 표기하므로 뒷면을 받침에 대고 측정해야 처방 표기와 일치.\u003c/li>\u003cli>기존 도수는 고객이 &#x27;익숙한 기준점&#x27;이므로 큰 변화(특히 난시축·원주도수)는 적응 문제를 일으킬 수 있음.\u003c/li>\u003c/ul>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>영점과 접안렌즈 조정을 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>렌즈 뒷면을 받침에 밀착하고 R부터 측정했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>S/C/Ax를 마이너스 원주 형식으로 기록했다(필요시 변환)\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>광학중심 간 거리와 높이 차이를 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>프리즘 유무를 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>ADD(다초점)를 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>렌즈 표면 상태(흠집·코팅 손상)를 기록했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s3-3","title":"3.3 동공간거리(PD) 측정","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사 (직원은 원장 지시에 따른 보조 측정까지만, 결과 반영은 안경사)\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>렌즈 광학중심을 동공 위치에 맞춰 원치 않는 프리즘 효과 방지\u003c/li>\u003cli>포롭터·시험테를 고객 눈 위치에 맞춤\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>고객과 같은 눈높이에서 마주 앉기, 측정 거리 설정(원용/근용)\u003c/li>\u003cli>PD 측정기: 각막 반사점(동공 중심 근처 빛 반사)에 커서를 맞춰 \u003cb>단안 PD(R/L)\u003c/b>와 합계 확인\u003c/li>\u003cli>자(PD 자) 방법: 검사자 왼눈 ↔ 고객 오른눈, 검사자 오른눈 ↔ 고객 왼눈을 번갈아 보며 측정\u003c/li>\u003cli>근용 PD: 근거리 설정(예: 40cm)에서 측정. 원용보다 작게 나오는 것이 정상\u003c/li>\u003cli>2회 이상 측정해 재현성 확인 후 기록\u003c/li>\u003c/ol>\u003cp class=\"link1\">🔗 \u003ca href=\"#s/s6-8\">PD 측정기 그림은 6.8절\u003c/a>에서 볼 수 있어요.\u003c/p>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>렌즈 중심에서 벗어난 위치로 보면 &#x27;프렌티스 법칙&#x27;에 따라 프리즘이 생김: \u003cb>프리즘(Δ) = 편심거리(cm) × 도수(D)\u003c/b>. 예) −6.00D 렌즈에서 2mm(0.2cm) 벗어나면 1.2Δ → 고도수일수록 PD 정확도가 중요.\u003c/li>\u003cli>좌우 얼굴이 비대칭인 경우가 많아 합계 PD보다 \u003cb>단안 PD\u003c/b>가 조제에 더 정확.\u003c/li>\u003c/ul>\u003cfigure class=\"gf\" id=\"fig3-1\">\u003csvg class=\"fig\" viewBox=\"0 0 380 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"PD 오차와 프렌티스 법칙: 광학중심을 벗어나면 프리즘이 생겨요\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g12e07b00\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#e07b00\"/>\u003c/marker>\u003c/defs>\u003cellipse cx=\"110.0\" cy=\"110.0\" rx=\"62.0\" ry=\"46.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ccircle cx=\"110.0\" cy=\"110.0\" r=\"13.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"110.0\" cy=\"110.0\" r=\"5.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"1\" />\u003ccircle cx=\"107.0\" cy=\"107.0\" r=\"1.6\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\" />\u003cline x1=\"102.0\" y1=\"110.0\" x2=\"118.0\" y2=\"110.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cline x1=\"110.0\" y1=\"102.0\" x2=\"110.0\" y2=\"118.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cellipse cx=\"262.0\" cy=\"110.0\" rx=\"62.0\" ry=\"46.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ccircle cx=\"270.0\" cy=\"110.0\" r=\"13.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"270.0\" cy=\"110.0\" r=\"5.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"1\" />\u003ccircle cx=\"267.0\" cy=\"107.0\" r=\"1.6\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\" />\u003cline x1=\"254.0\" y1=\"110.0\" x2=\"270.0\" y2=\"110.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cline x1=\"262.0\" y1=\"102.0\" x2=\"262.0\" y2=\"118.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003ctext x=\"110.0\" y=\"174.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"normal\" >오른눈(R)\u003c/text>\u003ctext x=\"270.0\" y=\"174.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"normal\" >왼눈(L)\u003c/text>\u003cline x1=\"110.0\" y1=\"30.0\" x2=\"190.0\" y2=\"30.0\" stroke=\"#e07b00\" stroke-width=\"1.5\" marker-end=\"url(#g12e07b00)\" marker-start=\"url(#g12e07b00)\" />\u003cline x1=\"190.0\" y1=\"30.0\" x2=\"270.0\" y2=\"30.0\" stroke=\"#e07b00\" stroke-width=\"1.5\" marker-end=\"url(#g12e07b00)\" marker-start=\"url(#g12e07b00)\" />\u003cline x1=\"190.0\" y1=\"22.0\" x2=\"190.0\" y2=\"38.0\" stroke=\"#e07b00\" stroke-width=\"1.5\" />\u003ctext x=\"150.0\" y=\"22.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"normal\" >단안 PD R\u003c/text>\u003ctext x=\"230.0\" y=\"22.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"normal\" >단안 PD L\u003c/text>\u003ctext x=\"270.0\" y=\"54.0\" font-size=\"10.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >광학중심이 동공에서 벗어남(예)\u003c/text>\u003crect x=\"10.0\" y=\"200.0\" width=\"360.0\" height=\"44.0\" rx=\"10\" fill=\"#fff8ec\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003ctext x=\"190.0\" y=\"219.0\" font-size=\"13\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >프리즘(Δ) = 편심거리(cm) × 도수(D)\u003c/text>\u003ctext x=\"190.0\" y=\"237.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >−6.00 D에서 2 mm(0.2 cm) → 1.2Δ · 고도수일수록 PD가 중요\u003c/text>\u003ctext x=\"190.0\" y=\"118.0\" font-size=\"1\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >\u003c/text>\u003ctext x=\"110.0\" y=\"54.0\" font-size=\"10.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >+ = 렌즈 광학중심\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-1.\u003c/b> PD 오차와 프렌티스 법칙: 광학중심을 벗어나면 프리즘이 생겨요\u003c/figcaption>\u003c/figure>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>측정 거리(원/근)를 기기에 맞게 설정했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>고객이 측정기 내부 목표를 바라보는지 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>단안 PD(R/L)를 따로 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>2회 이상 측정해 1mm 이내 일치를 확인했다(매장 기준 예시)\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>누진 렌즈는 아이포인트 높이도 측정 계획에 포함했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s3-4","title":"3.4 시력검사 (나안시력·교정시력)","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>현재 상태의 기준 시력 기록\u003c/li>\u003cli>굴절검사 후 개선 확인 및 \u003cb>최대교정시력이 정상 범위에 도달하는지\u003c/b> 확인(도달 못 하면 질환 의심)\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>시력표 거리(예: 5m 또는 6m 규격, 프로젝터 보정 거리) 확인, 조명 일정하게\u003c/li>\u003cli>\u003cb>단안\u003c/b>(R → L) → \u003cb>양안\u003c/b> 순서. 한쪽을 가릴 때 눈을 누르지 않도록 가림판 사용\u003c/li>\u003cli>나안시력 → 기존 안경 착용 시력 → (굴절검사 후) 최대교정시력\u003c/li>\u003cli>한 줄에서 과반을 읽으면 그 줄을 시력으로 기록하는 등 매장 기준을 통일하고 오독 개수 메모(예: 1.0-2)\u003c/li>\u003cli>근거리 시력(예: 40cm 근용시력표)도 측정\u003c/li>\u003cli>교정시력이 나오지 않으면 \u003cb>핀홀(바늘구멍) 시력\u003c/b> 확인: 핀홀로 좋아지면 굴절 문제 가능성, 좋아지지 않으면 굴절 외 원인 의심 → 안과 의뢰 고려\u003c/li>\u003c/ol>\u003cp class=\"link1\">🔗 \u003ca href=\"#s/s6-7\">시력표·거울 보정 그림은 6.7절\u003c/a>에서 볼 수 있어요.\u003c/p>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>핀홀은 들어오는 빛을 가는 다발로 제한해 흐림원(blur circle)을 줄이므로, 굴절이상에 의한 흐림은 개선되지만 매질 혼탁·망막 문제에 의한 저하는 개선이 제한적.\u003c/li>\u003cli>AOA 지침: 시력은 단안·양안, 기존 교정 유무, 원·근거리에서 측정하고 필요 시 핀홀 시력을 측정.\u003c/li>\u003cli>한국은 소수시력(1.0 등)을 흔히 쓰며, 1.0은 대략 6/6(20/20), logMAR 0.0에 해당.\u003c/li>\u003c/ul>\u003cfigure class=\"gf\" id=\"fig3-2\">\u003csvg class=\"fig\" viewBox=\"0 0 380 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"핀홀(바늘구멍) 시력의 원리\
