=\"url(#g521b7a43)\" />\u003ctext x=\"161.0\" y=\"145.2\" font-size=\"10\" fill=\"#1b7a43\" text-anchor=\"end\" font-weight=\"normal\" >피팅 높이\u003c/text>\u003ctext x=\"105.0\" y=\"48.0\" font-size=\"12.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >짧은 누진대\u003c/text>\u003crect x=\"215.0\" y=\"60.0\" width=\"160.0\" height=\"140.0\" rx=\"22\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2.5\" />\u003cline x1=\"287.0\" y1=\"123.2\" x2=\"303.0\" y2=\"123.2\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cline x1=\"295.0\" y1=\"115.2\" x2=\"295.0\" y2=\"131.2\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cpath d=\"M290,129.2 L300,129.2 L309,173.2 L281,173.2 Z\" stroke=\"#1b7a43\" fill=\"#e3f4e1\" stroke-width=\"1\" />\u003cellipse cx=\"295.0\" cy=\"183.2\" rx=\"20.0\" ry=\"8.0\" fill=\"#fff0d6\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003cline x1=\"355.0\" y1=\"123.2\" x2=\"355.0\" y2=\"200.0\" stroke=\"#1b7a43\" stroke-width=\"1.4\" marker-end=\"url(#g521b7a43)\" marker-start=\"url(#g521b7a43)\" />\u003ctext x=\"351.0\" y=\"165.6\" font-size=\"10\" fill=\"#1b7a43\" text-anchor=\"end\" font-weight=\"normal\" >피팅 높이\u003c/text>\u003ctext x=\"295.0\" y=\"48.0\" font-size=\"12.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >긴 누진대\u003c/text>\u003crect x=\"10.0\" y=\"224.0\" width=\"380.0\" height=\"50.0\" rx=\"8\" fill=\"#fff8ec\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003ctext x=\"200.0\" y=\"243.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >예) 누진대 11 mm → 최소 14 mm · 14 mm → 18 mm · 16 mm → 20 mm\u003c/text>\u003ctext x=\"200.0\" y=\"262.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >짧을수록 작은 테 가능·근용부 빨리 도달 / 길수록 부드럽고 적응 쉬움\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 10-5.\u003c/b> 누진대 길이와 최소 피팅 높이(예: 제조사 표)\u003c/figcaption>\u003c/figure>"},{"id":"s10-6","title":"10.6 인도 시 확인과 적응 안내","html":"\u003col>\u003cli>렌즈미터로 원용 도수(원용 측정 원)·ADD·PRP 프리즘 확인, 마크 복원 후 피팅 크로스가 동공 중심에 오는지 확인.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref34\">34\u003c/a>, \u003ca href=\"g18.html#ref37\">37\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>얼굴에 맞춰 경사각·정점간거리·안면각·코받침 재조정.\u003c/li>\n\u003cli>원 → 중간 → 근 → 보행 순서로 체험시키며 설명.\u003c/li>\u003c/ol>\n\u003cdiv class=\"box star\">\u003cb>고객 안내 대사\u003c/b> “먼 곳은 정면으로, 휴대폰·책은 \u003cb>눈만 아래로\u003c/b> 내려서 보세요. 옆쪽은 원래 조금 흐린 부분이라 옆을 볼 때는 \u003cb>고개를 같이 돌리시면\u003c/b> 편해요. 계단은 처음 며칠 고개를 조금 숙여 렌즈 위쪽으로 보세요. 보통 1~2주 쓰면 익숙해지는데, 그래도 불편하면 꼭 다시 오세요. 위치만 조금 조정해도 좋아지는 경우가 많아요.”\u003c/div>\n\u003cp>2주가 지나도 적응이 안 되면 13장 불편 대응 순서(조제 → 피팅 → 처방 → 설계)를 따릅니다.\u003c/p>"}],"questions":[{"id":"g13-q1","question":"누진 렌즈 피팅 높이는 어디서 어디까지?","choices":["동공 중심 ~ 렌즈 테 가장 아래(안쪽 홈)","눈썹 ~ 렌즈 아래","동공 ~ 코받침","렌즈 위 ~ 아래"],"answer_index":0,"explanation":"동공 중심에 수평선을 긋고 렌즈 최저점까지 R/L 각각.","page":"g13.html"},{"id":"g13-q2","question":"누진 측정 전에 먼저 할 일은?","choices":["ADD 결정","테 사전 피팅(정점간거리·경사각·안면각)","렌즈 주문","렌즈 각인 확인"],"answer_index":1,"explanation":"테를 맞추지 않고 잰 높이는 의미가 없어요.","page":"g13.html"},{"id":"g13-q3","question":"첫 누진·운전 많음·깊은 테. 어떤 누진대?","choices":["짧은 누진대","긴 누진대","누진 불가","디그레시브"],"answer_index":1,"explanation":"긴 누진대는 변화가 완만해 적응이 쉬워요(최소 피팅 높이 확인).","page":"g13.html"},{"id":"g13-q4","question":"누진 숨김 각인 사이 거리는?","choices":["17 mm","34 mm","12 mm","40 mm"],"answer_index":1,"explanation":"PRP 양옆 17 mm씩, 간격 34 mm.","page":"g13.html"},{"id":"g13-q5","question":"누진 옆쪽이 흐리다는 고객에게 적절한 안내는?","choices":["옆을 볼 때 고개를 같이 돌리기","ADD 올리기","렌즈 교체 즉시","안과 의뢰"],"answer_index":0,"explanation":"주변부 비점수차는 구조상 존재 → 사용법 교육, 피팅 확인.","page":"g13.html"}]},{"id":"g14","no":"11","title":"피로감소 기능성 렌즈","page":"g14.html","intro":"\u003cp class=\"note\">이 장은 웹 교재판에서 새로 추가했어요. 공개된 제조사 가이드·표준·교육 자료를 바탕으로 정리했고, 출처 번호[ ]를 누르면 부록 C로 이동해요. 제품별 수치는 예시이므로 실제 주문 시 해당 제조사 자료를 확인하세요.\u003c/p>","key_points":["원용 도수 + 아래쪽 작은 + 보강(약 0.4~1.3 D). 노안 전 근거리 피로 고객 대상.","근거리 외사위·폭주 부족은 주의 – 양안시 결과 확인.","단안 PD·피팅 높이로 조제, 효과를 보장하는 표현 금지."],"sections":[{"id":"s11-1","title":"11.1 원리","html":"\u003cp>피로감소(조절 보조, low add boost) 렌즈는 \u003cb>단초점 렌즈처럼 원용 도수가 렌즈 전체에 있고, 아래쪽에 작은 + 보강(대개 +0.4~+1.3 D 수준)\u003c/b>을 넣은 렌즈입니다. 근거리를 볼 때 필요한 조절 일부를 렌즈가 대신해 모양체근 부담을 줄이는 것이 목적입니다.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref38\">38\u003c/a>, \u003ca href=\"g18.html#ref40\">40\u003c/a>, \u003ca href=\"g18.html#ref41\">41\u003c/a>]\u003c/sup>\u003c/p>\n\u003cul>\u003cli>보강량 예: Essilor Eyezen 계열 0.40 D(대략 20~34세)·0.60 D(35~44세)·0.85 D(45~50세), Hoya Sync III 0.57/0.95/1.32 D(13~45세, 하루 2시간 이상 근거리·디지털 기기). 이름·단계는 제조사마다 다르므로 해당 제품 안내서를 따릅니다.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref38\">38\u003c/a>, \u003ca href=\"g18.html#ref40\">40\u003c/a>, \u003ca href=\"g18.html#ref41\">41\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>도수 변화가 완만하고 작아 대부분 일반 단초점처럼 느끼지만, \u003cb>누진처럼 단안 PD와 피팅 높이로 조제\u003c/b>하는 제품이 많습니다.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref38\">38\u003c/a>]\u003c/sup>\u003c/li>\u003c/ul>\n\u003cfigure class=\"gf\" id=\"fig11-1\">\u003csvg class=\"fig\" viewBox=\"0 0 400 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"피로감소(조절 보조) 렌즈의 도수 분포: 아래쪽에 작은 + 보강\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cline x1=\"60.0\" y1=\"190.0\" x2=\"360.0\" y2=\"190.0\" stroke=\"#333\" stroke-width=\"1.2\" />\u003cline x1=\"60.0\" y1=\"40.0\" x2=\"60.0\" y2=\"190.0\" stroke=\"#333\" stroke-width=\"1.2\" />\u003cline x1=\"60.0\" y1=\"190.0\" x2=\"360.0\" y2=\"190.0\" stroke=\"#eef1f5\" stroke-width=\"1\" />\u003ctext x=\"54.0\" y=\"194.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >+0.0\u003c/text>\u003cline x1=\"60.0\" y1=\"160.0\" x2=\"360.0\" y2=\"160.0\" stroke=\"#eef1f5\" stroke-width=\"1\" />\u003ctext x=\"54.0\" y=\"164.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >+0.5\u003c/text>\u003cline x1=\"60.0\" y1=\"130.0\" x2=\"360.0\" y2=\"130.0\" stroke=\"#eef1f5\" stroke-width=\"1\" />\u003ctext x=\"54.0\" y=\"134.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >+1.0\u003c/text>\u003cline x1=\"60.0\" y1=\"100.0\" x2=\"360.0\" y2=\"100.0\" stroke=\"#eef1f5\" stroke-width=\"1\" />\u003ctext x=\"54.0\" y=\"104.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >+1.5\u003c/text>\u003cline x1=\"60.0\" y1=\"70.0\" x2=\"360.0\" y2=\"70.0\" stroke=\"#eef1f5\" stroke-width=\"1\" />\u003ctext x=\"54.0\" y=\"74.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >+2.0\u003c/text>\u003cline x1=\"60.0\" y1=\"40.0\" x2=\"360.0\" y2=\"40.0\" stroke=\"#eef1f5\" stroke-width=\"1\" />\u003ctext x=\"54.0\" y=\"44.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >+2.5\u003c/text>\u003cpath d=\"M60,190.0 L170,190.0 C230,190.0 250,166.0 300,166.0 L360,166.0\" stroke=\"#1b7a43\" fill=\"none\" stroke-width=\"2.5\" />\u003cpath d=\"M60,190.0 L170,190.0 C230,190.0 250,154.0 300,154.0 L360,154.0\" stroke=\"#2a6fdb\" fill=\"none\" stroke-width=\"2.5\" />\u003cpath d=\"M60,190.0 L170,190.0 C230,190.0 250,139.0 300,139.0 L360,139.0\" stroke=\"#7b3fb5\" fill=\"none\" stroke-width=\"2.5\" />\u003cpath d=\"M60,190.0 L170,190.0 C230,190.0 250,70.0 300,70.0 L360,70.0\" stroke=\"#e07b00\" fill=\"none\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\" />\u003ctext x=\"358.0\" y=\"180.0\" font-size=\"10.5\" fill=\"#1b7a43\" text-anchor=\"end\" font-weight=\"normal\" >+0.40 (예)\u003c/text>\u003ctext x=\"358.0\" y=\"148.0\" font-size=\"10.5\" fill=\"#2a6fdb\" text-anchor=\"end\" font-weight=\"normal\" >+0.60\u003c/text>\u003ctext x=\"358.0\" y=\"133.0\" font-size=\"10.5\" fill=\"#7b3fb5\" text-anchor=\"end\" font-weight=\"normal\" >+0.85\u003c/text>\u003ctext x=\"358.0\" y=\"64.0\" font-size=\"10.5\" fill=\"#e07b00\" text-anchor=\"end\" font-weight=\"normal\" >일반 누진 ADD +2.00(비교)\u003c/text>\u003ctext x=\"110.0\" y=\"182.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >원용 도수(처방)\u003c/text>\u003ctext x=\"210.0\" y=\"208.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >렌즈 위(먼 곳) → 아래(가까운 곳)\u003c/text>\u003ctext x=\"20.0\" y=\"115.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >추가 +D\u003c/text>\u003ctext x=\"200.0\" y=\"240.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >보강량·명칭은 제조사마다 다름(예: 0.40/0.60/0.85 D, 0.57/0.95/1.32 D)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 11-1.\u003c/b> 피로감소(조절 보조) 렌즈의 도수 분포: 아래쪽에 작은 + 보강\u003c/figcaption>\u003c/figure>"},{"id":"s11-2","title":"11.2 잘 맞는 고객과 주의할 고객","html":"\u003ctable class=\"tbl\">\u003ctr>\u003cth>잘 맞는 경우\u003c/th>\u003cth>주의·다른 방법 고려\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>• 노안 전(대략 10대 후반~40대 초중반) 근거리·화면 작업이 길고 오후 눈 피로·두통 호소\u003cbr>• 근거리에서 글씨가 늦게 맞거나 초점 전환이 느림(조절 지체·조절 피로 의심)\u003cbr>• 단초점 사용자인데 근거리 작업 환경이 바뀜\u003c/td>\n\u003ctd>• \u003cb>근거리 외사위가 크거나 폭주 부족\u003c/b>: + 보강이 조절성 폭주를 줄여 오히려 불편해질 수 있음 → 양안시 검사 결과 확인 필수\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref38\">38\u003c/a>]\u003c/sup>\u003cbr>• 이미 노안이 뚜렷(45세 전후 이상, ADD 필요) → 누진·중근용이 더 적합\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref39\">39\u003c/a>]\u003c/sup>\u003cbr>• 원용 과마이너스가 원인 → 처방부터 바로잡기\u003cbr>• 갑작스러운 근거리 저하 → 전신·안과 원인 확인\u003c/td>\u003c/tr>\u003c/table>\n\u003cfigure class=\"gf\" id=\"fig11-2\">\u003csvg class=\"fig\" viewBox=\"0 0 380 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"피로감소 렌즈 권유 판단 흐름(예시)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g541f3a5f\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f3a5f\"/>\u003c/marker>\u003c/defs>\u003crect x=\"10.0\" y=\"10.0\" width=\"360.0\" height=\"40.0\" rx=\"10\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"190.0\" y=\"35.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >근거리·디지털 기기 하루 2시간 이상 + 근거리 피로 호소\u003c/text>\u003cline x1=\"190.0\" y1=\"50.0\" x2=\"190.0\" y2=\"64.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g541f3a5f)\" />\u003crect x=\"10.0\" y=\"66.0\" width=\"360.0\" height=\"40.0\" rx=\"10\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"190.0\" y=\"91.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >원용 굴절 정확히(MPMVA) · 노안 여부 확인\u003c/text>\u003cline x1=\"190.0\" y1=\"106.0\" x2=\"190.0\" y2=\"120.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g541f3a5f)\" />\u003crect x=\"10.0\" y=\"122.0\" width=\"360.0\" height=\"40.0\" rx=\"10\" fill=\"#fdeeee\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003ctext x=\"190.0\" y=\"147.0\" font-size=\"11.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"bold\" >양안시 확인: 근거리 외사위·폭주 부족?\u003c/text>\u003cline x1=\"190.0\" y1=\"162.0\" x2=\"190.0\" y2=\"176.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g541f3a5f)\" />\u003crect x=\"10.0\" y=\"178.0\" width=\"360.0\" height=\"40.0\" rx=\"10\" fill=\"#e6f6ea\" stroke=\"#1b7a43\" stroke-width=\"2\" />\u003ctext x=\"190.0\" y=\"203.0\" font-size=\"11.5\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >문제 없음 → 연령·증상에 맞는 보강량 선택\u003c/text>\u003cline x1=\"190.0\" y1=\"218.0\" x2=\"190.0\" y2=\"232.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g541f3a5f)\" />\u003crect x=\"10.0\" y=\"234.0\" width=\"360.0\" height=\"40.0\" rx=\"10\" fill=\"#e6f6ea\" stroke=\"#1b7a43\" stroke-width=\"2\" />\u003ctext x=\"190.0\" y=\"259.0\" font-size=\"11.5\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >단안 PD·피팅 높이 측정 → 착용 안내\u003c/text>\u003ctext x=\"190.0\" y=\"296.0\" font-size=\"10.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >근거리 외사위가 크면 + 보강이 조절성 폭주를 줄여 불편할 수 있어 주의\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 11-2.\u003c/b> 피로감소 렌즈 권유 판단 흐름(예시)\u003c/figcaption>\u003c/figure>"},{"id":"s11-3","title":"11.3 처방·조제 절차","html":"\u003col>\u003cli>\u003cb>문진\u003c/b>: 하루 근거리·디지털 기기 시간, 작업 거리(폰 20~35 cm, 모니터 50~70 cm), 증상(피로·두통·초점 전환 지연), 나이.\u003c/li>\n\u003cli>\u003cb>원용 굴절 정확히\u003c/b>: MPMVA·적록·양안균형. 과마이너스부터 제거하면 증상이 해결되기도 함.\u003c/li>\n\u003cli>\u003cb>조절·양안시\u003c/b>: 근점·조절력(5장), 근거리 사위·NPC(3.11~3.12). 근거리 외사위가 크면 보강 렌즈를 신중히.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref38\">38\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>\u003cb>보강량 선택\u003c/b>: 제조사 연령·증상 가이드를 출발점으로, 시험테에 원용 도수 + 보강량 렌즈를 겹쳐 근거리 편안함 비교. 증상 설문 점수로 단계 고르는 방법도 쓰임.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref38\">38\u003c/a>, \u003ca href=\"g18.html#ref47\">47\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>\u003cb>측정\u003c/b>: 단안 PD, 피팅 높이(동공 중심 ~ 렌즈 최저점), 제품별 최소 피팅 높이 확인.\u003c/li>\n\u003cli>\u003cb>인도·안내\u003c/b>: “먼 곳은 지금 안경처럼 똑같이 보이고, 아래쪽으로 볼 때 눈이 덜 힘들게 도와주는 렌즈예요. 시력을 좋아지게 하거나 근시를 멈추게 하는 렌즈는 아니에요.”\u003c/li>\u003c/ol>\n\u003cdiv class=\"box err\">\u003cb>하지 말아야 할 말\u003c/b> “눈이 좋아져요”, “근시 진행이 멈춰요”처럼 효과를 보장하거나 의학적 효과를 단정하는 표현. 제조사 자료의 만족도 수치도 출처 없이 인용하지 않습니다.\u003c/div>"}],"questions":[{"id":"g14-q1","question":"피로감소 렌즈의 구조는?","choices":["원용 도수 + 아래쪽 작은 + 보강","근용 도수만","프리즘만","원주만"],"answer_index":0,"explanation":"단초점 원용 도수에 아래쪽 +0.4~1.3 D 정도 보강.","page":"g14.html"},{"id":"g14-q2","question":"보강 렌즈를 신중히 써야 하는 고객은?","choices":["근거리 외사위가 크고 폭주 부족","원시 저도수","근시 저도수","난시 없음"],"answer_index":0,"explanation":"+ 보강이 조절성 폭주를 줄여 외사위가 더 불편해질 수 있어요.","page":"g14.html"},{"id":"g14-q3","question":"고객 설명으로 옳은 것은?","choices":["근시 진행이 멈춰요","눈이 좋아져요","가까운 곳을 볼 때 눈의 힘을 덜 쓰게 도와줘요","노안이 안 와요"],"answer_index":2,"explanation":"효과 보장·의학적 단정은 금지.","page":"g14.html"}]},{"id":"g15","no":"12","title":"사무용 누진(중근용)","page":"g15.html","intro":"\u003cp class=\"note\">이 장은 웹 교재판에서 새로 추가했어요. 공개된 제조사 가이드·표준·교육 자료를 바탕으로 정리했고, 출처 번호[ ]를 누르면 부록 C로 이동해요. 제품별 수치는 예시이므로 실제 주문 시 해당 제조사 자료를 확인하세요.\u003c/p>","key_points":["사무용 = 먼 곳을 줄이고 중간·근거리를 넓힌 실내용.","선명 한계 ≈ 1 ÷ (ADD − 디그레션) m.","작업거리 실측 → 디그레션 → 정적/동적 → 누진대 길이. 운전 금지 안내."],"sections":[{"id":"s12-1","title":"12.1 종류와 원리","html":"\u003cp>사무용 렌즈는 먼 곳 시야를 줄이는 대신 \u003cb>모니터(중간)·책상(근거리) 시야를 넓힌\u003c/b> 실내용 렌즈입니다.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref38\">38\u003c/a>, \u003ca href=\"g18.html#ref39\">39\u003c/a>, \u003ca href=\"g18.html#ref42\">42\u003c/a>]\u003c/sup>\u003c/p>\n\u003ctable class=\"tbl\">\u003ctr>\u003cth>종류\u003c/th>\u003cth>설계 기준\u003c/th>\u003cth>선명 범위(예)\u003c/th>\u003cth>쓰임\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>근용 디그레시브(향상된 돋보기)\u003c/td>\u003ctd>근용 도수에서 시작해 위로 갈수록 \u003cb>디그레션\u003c/b>만큼 도수가 줄어듦\u003c/td>\u003ctd>~1 m 안팎\u003c/td>\u003ctd>책상 작업·독서·수작업(정적인 일)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>사무용(중근용) 누진\u003c/td>\u003ctd>긴 누진대의 소프트 누진처럼, 중간 영역이 넓고 위쪽 ‘먼 곳’은 제한\u003c/td>\u003ctd>~2 m 또는 ~4 m\u003c/td>\u003ctd>사무실 이동·회의·모니터 여러 대(동적인 실내)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>일반 누진\u003c/td>\u003ctd>원용 기준 + ADD\u003c/td>\u003ctd>먼 곳~근거리\u003c/td>\u003ctd>운전·외출 포함 종일 착용\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>선명 한계 계산\u003c/b>: 최대 선명 거리(m) ≈ 1 ÷ (ADD − 디그레션). 예) ADD +2.50, 디그레션 1.50 D → 1.00 D → 약 1 m. 단, 피팅 포인트에 디그레션이 전부 들어가는지(설계마다 다름) 확인해야 실제 거리를 알 수 있습니다.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref38\">38\u003c/a>]\u003c/sup>\u003c/p>\n\u003cfigure class=\"gf\" id=\"fig12-1\">\u003csvg class=\"fig\" viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"일반 누진 vs 사무용(중근용) vs 근용 디그레시브 렌즈의 시야 배분(개념)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cclipPath id=\"ocg5570\">\u003cellipse cx=\"70\" cy=\"130\" rx=\"56\" ry=\"80\"/>\u003c/clipPath>\u003cg clip-path=\"url(#ocg5570)\">\u003crect x=\"14.0\" y=\"50.0\" width=\"112.0\" height=\"70.0\" rx=\"0\" fill=\"#dbeaff\" stroke=\"none\" stroke-width=\"0\" />\u003ctext x=\"70.0\" y=\"89.0\" font-size=\"10.5\" fill=\"#223\" text-anchor=\"middle\" font-weight=\"bold\" >먼 곳\u003c/text>\u003crect x=\"14.0\" y=\"120.0\" width=\"112.0\" height=\"30.0\" rx=\"0\" fill=\"#e3f4e1\" stroke=\"none\" stroke-width=\"0\" />\u003ctext x=\"70.0\" y=\"139.0\" font-size=\"10.5\" fill=\"#223\" text-anchor=\"middle\" font-weight=\"bold\" >중간\u003c/text>\u003crect x=\"14.0\" y=\"150.0\" width=\"112.0\" height=\"60.0\" rx=\"0\" fill=\"#fff0d6\" stroke=\"none\" stroke-width=\"0\" />\u003ctext x=\"70.0\" y=\"184.0\" font-size=\"10.5\" fill=\"#223\" text-anchor=\"middle\" font-weight=\"bold\" >근거리\u003c/text>\u003c/g>\u003cellipse cx=\"70.0\" cy=\"130.0\" rx=\"56.0\" ry=\"80.0\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"70.0\" y=\"30.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >일반 누진\u003c/text>\u003cclipPath id=\"ocg55200\">\u003cellipse cx=\"200\" cy=\"130\" rx=\"56\" ry=\"80\"/>\u003c/clipPath>\u003cg clip-path=\"url(#ocg55200)\">\u003crect x=\"144.0\" y=\"50.0\" width=\"112.0\" height=\"30.0\" rx=\"0\" fill=\"#dbeaff\" stroke=\"none\" stroke-width=\"0\" />\u003ctext x=\"200.0\" y=\"69.0\" font-size=\"10.5\" fill=\"#223\" text-anchor=\"middle\" font-weight=\"bold\" >~2~4 m\u003c/text>\u003crect x=\"144.0\" y=\"80.0\" width=\"112.0\" height=\"70.0\" rx=\"0\" fill=\"#e3f4e1\" stroke=\"none\" stroke-width=\"0\" />\u003ctext x=\"200.0\" y=\"119.0\" font-size=\"10.5\" fill=\"#223\" text-anchor=\"middle\" font-weight=\"bold\" >중간(모니터)\u003c/text>\u003crect x=\"144.0\" y=\"150.0\" width=\"112.0\" height=\"60.0\" rx=\"0\" fill=\"#fff0d6\" stroke=\"none\" stroke-width=\"0\" />\u003ctext x=\"200.0\" y=\"184.0\" font-size=\"10.5\" fill=\"#223\" text-anchor=\"middle\" font-weight=\"bold\" >근거리\u003c/text>\u003c/g>\u003cellipse cx=\"200.0\" cy=\"130.0\" rx=\"56.0\" ry=\"80.0\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"200.0\" y=\"30.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >사무용(중근용)\u003c/text>\u003cclipPath id=\"ocg55330\">\u003cellipse cx=\"330\" cy=\"130\" rx=\"56\" ry=\"80\"/>\u003c/clipPath>\u003cg clip-path=\"url(#ocg55330)\">\u003crect x=\"274.0\" y=\"50.0\" width=\"112.0\" height=\"50.0\" rx=\"0\" fill=\"#e3f4e1\" stroke=\"none\" stroke-width=\"0\" />\u003ctext x=\"330.0\" y=\"79.0\" font-size=\"10.5\" fill=\"#223\" text-anchor=\"middle\" font-weight=\"bold\" >~1 m\u003c/text>\u003crect x=\"274.0\" y=\"100.0\" width=\"112.0\" height=\"110.0\" rx=\"0\" fill=\"#fff0d6\" stroke=\"none\" stroke-width=\"0\" />\u003ctext x=\"330.0\" y=\"159.0\" font-size=\"10.5\" fill=\"#223\" text-anchor=\"middle\" font-weight=\"bold\" >근거리(넓음)\u003c/text>\u003c/g>\u003cellipse cx=\"330.0\" cy=\"130.0\" rx=\"56.0\" ry=\"80.0\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"330.0\" y=\"30.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >근용 디그레시브\u003c/text>\u003ctext x=\"200.0\" y=\"232.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >위로 갈수록 도수가 줄어(디그레션) 먼 쪽 선명 범위가 늘어나요\u003c/text>\u003ctext x=\"200.0\" y=\"252.0\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >사무용·디그레시브는 실내 전용 – 운전·보행용으로 쓰지 않기\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 12-1.\u003c/b> 일반 누진 vs 사무용(중근용) vs 근용 디그레시브 렌즈의 시야 배분(개념)\u003c/figcaption>\u003c/figure>\u003cdiv class=\"box term\">\u003cb>🧪 직접 해 보기: 사무용 렌즈의 선명 한계 거리\u003c/b>\u003cp>숫자를 바꿔 보는 실습은 교재 페이지에서 할 수 있어요.\u003c/p>\u003cp>\u003ca class=\"btn l\" href=\"g15.html#lab-degr\">교재 페이지에서 실습 열기 →\u003c/a>\u003c/p>\u003c/div>"},{"id":"s12-2","title":"12.2 작업거리 측정과 선택","html":"\u003col>\u003cli>\u003cb>실측\u003c/b>: 근거리(서류·키보드 33~45 cm), 모니터(50~80 cm), 가장 먼 실내 목표(동료 얼굴·회의실 화면 1~4 m). 모니터 높이·노트북 사용 여부·자세도 기록.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref38\">38\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>\u003cb>제거법으로 고르기\u003c/b>: ① 필요한 가장 먼 거리 → 디그레션 양 ② 정적(앉아서) vs 동적(돌아다님) ③ 짧은/긴 누진대.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref39\">39\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>제조사 디그레션 표 예: ADD 2.00이면 ‘데스크(~1.3 m)’ 1.25, ‘오피스(~2 m)’ 1.50, ‘미팅(~4 m)’ 1.75 D처럼 ADD와 목표 거리로 정해집니다(제품별 표 사용).\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref42\">42\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>시험 착용: 모니터·서류·주변 동료를 번갈아 보게 해 머리 움직임이 자연스러운지 확인.\u003c/li>\u003c/ol>\n\u003cdiv class=\"box must\">\u003cb>일반 누진 vs 사무용 선택 기준\u003c/b> 하루 대부분 앉아서 모니터·서류 → 사무용(또는 디그레시브)을 \u003cb>두 번째 안경\u003c/b>으로. 운전·외출·종일 한 개로 → 일반 누진. 일반 누진으로 모니터를 볼 때 고개를 젖히거나 목이 아프다는 고객이 대표적인 사무용 대상입니다.\u003c/div>\n\u003cfigure class=\"gf\" id=\"fig12-2\">\u003csvg class=\"fig\" viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"렌즈 종류별 선명하게 보이는 거리 범위(ADD +2.50 노안 예)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cline x1=\"117.0\" y1=\"34.0\" x2=\"117.0\" y2=\"190.0\" stroke=\"#e8ecf2\" stroke-width=\"1\" />\u003ctext x=\"117.0\" y=\"204.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >33cm\u003c/text>\u003cline x1=\"160.7\" y1=\"34.0\" x2=\"160.7\" y2=\"190.0\" stroke=\"#e8ecf2\" stroke-width=\"1\" />\u003ctext x=\"160.7\" y=\"204.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >60cm\u003c/text>\u003cline x1=\"198.1\" y1=\"34.0\" x2=\"198.1\" y2=\"190.0\" stroke=\"#e8ecf2\" stroke-width=\"1\" />\u003ctext x=\"198.1\" y=\"204.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >1m\u003c/text>\u003cline x1=\"248.9\" y1=\"34.0\" x2=\"248.9\" y2=\"190.0\" stroke=\"#e8ecf2\" stroke-width=\"1\" />\u003ctext x=\"248.9\" y=\"204.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >2m\u003c/text>\u003cline x1=\"299.6\" y1=\"34.0\" x2=\"299.6\" y2=\"190.0\" stroke=\"#e8ecf2\" stroke-width=\"1\" />\u003ctext x=\"299.6\" y=\"204.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >4m\u003c/text>\u003cline x1=\"366.7\" y1=\"34.0\" x2=\"366.7\" y2=\"190.0\" stroke=\"#e8ecf2\" stroke-width=\"1\" />\u003ctext x=\"366.7\" y=\"204.0\" font-size=\"10\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >10m\u003c/text>\u003ctext x=\"104.0\" y=\"54.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"end\" font-weight=\"normal\" >돋보기 +2.50\u003c/text>\u003crect x=\"117.0\" y=\"40.0\" width=\"14.1\" height=\"18.0\" rx=\"5\" fill=\"#e07b00\" stroke=\"#e07b00\" stroke-width=\"0\" fill-opacity=\".35\"/>\u003ctext x=\"104.0\" y=\"84.0\" font-size=\"11\" fill=\"#1b7a43\" text-anchor=\"end\" font-weight=\"normal\" >디그레시브 1.50\u003c/text>\u003crect x=\"117.0\" y=\"70.0\" width=\"81.1\" height=\"18.0\" rx=\"5\" fill=\"#1b7a43\" stroke=\"#1b7a43\" stroke-width=\"0\" fill-opacity=\".35\"/>\u003ctext x=\"104.0\" y=\"114.0\" font-size=\"11\" fill=\"#2a6fdb\" text-anchor=\"end\" font-weight=\"normal\" >사무용(~2 m)\u003c/text>\u003crect x=\"117.0\" y=\"100.0\" width=\"131.9\" height=\"18.0\" rx=\"5\" fill=\"#2a6fdb\" stroke=\"#2a6fdb\" stroke-width=\"0\" fill-opacity=\".35\"/>\u003ctext x=\"104.0\" y=\"144.0\" font-size=\"11\" fill=\"#7b3fb5\" text-anchor=\"end\" font-weight=\"normal\" >사무용(~4 m)\u003c/text>\u003crect x=\"117.0\" y=\"130.0\" width=\"182.6\" height=\"18.0\" rx=\"5\" fill=\"#7b3fb5\" stroke=\"#7b3fb5\" stroke-width=\"0\" fill-opacity=\".35\"/>\u003ctext x=\"104.0\" y=\"174.0\" font-size=\"11\" fill=\"#1f3a5f\" text-anchor=\"end\" font-weight=\"normal\" >일반 누진\u003c/text>\u003crect x=\"117.0\" y=\"160.0\" width=\"263.0\" height=\"18.0\" rx=\"5\" fill=\"#1f3a5f\" stroke=\"#1f3a5f\" stroke-width=\"0\" fill-opacity=\".35\"/>\u003ctext x=\"200.0\" y=\"224.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >선명 한계 ≈ 1 ÷ (ADD − 디그레션) m · 예: 2.50 − 1.50 = 1.00 D → 1 m\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 12-2.\u003c/b> 렌즈 종류별 선명하게 보이는 거리 범위(ADD +2.50 노안 예)\u003c/figcaption>\u003c/figure>"},{"id":"s12-3","title":"12.3 조제·안내","html":"\u003cul>\u003cli>주문 정보는 제품마다 다름: 원용 도수+ADD+설계 선택(디그레션 자동 계산) 또는 근용 도수+디그레션, 원용/근용 단안 PD, 피팅 높이. 피팅 크로스 위치 기준(원용 시선의 동공 중심 등)을 센터링 차트로 확인.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref42\">42\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>\u003cb>실내 전용\u003c/b> 안내: “이 안경은 사무실·집 안 전용이에요. \u003cb>운전이나 바깥 보행에는 쓰지 마세요.\u003c/b>”\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref42\">42\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>사용법: “모니터는 정면보다 살짝 아래, 서류는 더 아래로 눈을 내려 보세요.” 모니터가 너무 높으면 렌즈 아래쪽 근용 영역과 맞지 않아 목이 아플 수 있어요.\u003c/li>\u003c/ul>"}],"questions":[{"id":"g15-q1","question":"ADD +2.50, 디그레션 1.50 D 렌즈의 대략적 최대 선명 거리는?","choices":["40 cm","1 m","2 m","4 m"],"answer_index":1,"explanation":"1 ÷ (2.50 − 1.50) = 1 m.","page":"g15.html"},{"id":"g15-q2","question":"사무용 누진 안내로 옳은 것은?","choices":["운전에도 좋아요","실내 전용, 운전·바깥 보행에 쓰지 않기","먼 곳이 더 넓어요","ADD가 필요 없어요"],"answer_index":1,"explanation":"먼 곳 시야가 제한돼 실내 전용이에요.","page":"g15.html"},{"id":"g15-q3","question":"하루 종일 모니터·서류, 일반 누진으로 목이 아픈 고객에게?","choices":["ADD 올리기","사무용(중근용)을 두 번째 안경으로 제안","돋보기만","단초점 원용"],"answer_index":1,"explanation":"중간 영역이 넓은 사무용이 대표적 해결책.","page":"g15.html"}]},{"id":"g16","no":"13","title":"완성 안경 불편사항 대응","page":"g16.html","intro":"\u003cp class=\"note\">이 장은 웹 교재판에서 새로 추가했어요. 공개된 제조사 가이드·표준·교육 자료를 바탕으로 정리했고, 출처 번호[ ]를 누르면 부록 C로 이동해요. 제품별 수치는 예시이므로 실제 주문 시 해당 제조사 자료를 확인하세요.\u003c/p>","key_points":["순서: 듣기·기록 → 위험 신호 거르기 → 조제 → 피팅 → 처방·설계 → 적응.","수직 프리즘 불균형은 작아도 복시·두통(허용 예 0.33Δ).","벗어도 겹쳐 보이면 렌즈 문제가 아님 → 안과."],"sections":[{"id":"s13-1","title":"13.1 대응 원칙","html":"\u003col>\u003cli>\u003cb>먼저 듣고 기록\u003c/b>: 언제부터, 어느 거리에서, 한쪽/양쪽, 안경을 벗으면 사라지는지, 기존 안경은 괜찮은지.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref46\">46\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>\u003cb>위험 신호 거르기\u003c/b>: 안경을 벗어도 겹쳐 보임, 갑작스러운 복시·시력저하·통증·섬광은 렌즈 문제가 아님 → 안과 먼저(7.4).\u003c/li>\n\u003cli>\u003cb>순서대로 점검\u003c/b>: ① 조제(렌즈미터) → ② 피팅 → ③ 처방·설계(기존 안경과 비교) → ④ 적응.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref43\">43\u003c/a>, \u003ca href=\"g18.html#ref44\">44\u003c/a>]\u003c/sup>\u003c/li>\n\u003cli>수정 후 다시 착용 확인, 내용·결과·재방문 일정을 기록.\u003c/li>\u003c/ol>\n\u003cdiv class=\"box term\">\u003cb>점검 항목 체크(완성 안경)\u003c/b> S·C·축·ADD·프리즘 / 좌우 바뀜 / 광학중심·PRP·피팅 크로스 위치(수평·수직) / 베이스커브·렌즈 재질·설계 변경 / 코팅·착색 / 렌즈 휨·뒤틀림 / 정점간거리·경사각·안면각 / 기존 안경과의 차이.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref44\">44\u003c/a>, \u003ca href=\"g18.html#ref46\">46\u003c/a>]\u003c/sup>\u003c/div>\n\u003cfigure class=\"gf\" id=\"fig13-1\">\u003csvg class=\"fig\" viewBox=\"0 0 400 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"완성 안경 불편 호소 – 원인 찾기 흐름\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g571f3a5f\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f3a5f\"/>\u003c/marker>\u003c/defs>\u003crect x=\"110.0\" y=\"8.0\" width=\"180.0\" height=\"40.0\" rx=\"10\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"200.0\" y=\"25.0\" font-size=\"13\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >불편 호소 접수\u003c/text>\u003ctext x=\"200.0\" y=\"42.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >언제·어디서·어느 거리?\u003c/text>\u003cline x1=\"200.0\" y1=\"48.0\" x2=\"200.0\" y2=\"62.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g571f3a5f)\" />\u003crect x=\"20.0\" y=\"64.0\" width=\"360.0\" height=\"40.0\" rx=\"10\" fill=\"#fdeeee\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003ctext x=\"200.0\" y=\"89.0\" font-size=\"12.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"bold\" >위험 신호? (새 복시·통증·급격한 저하·섬광)\u003c/text>\u003cline x1=\"380.0\" y1=\"84.0\" x2=\"392.0\" y2=\"84.0\" stroke=\"#c0392b\" stroke-width=\"0\" />\u003ctext x=\"392.0\" y=\"126.0\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"end\" font-weight=\"normal\" >예 → 안과 먼저\u003c/text>\u003cline x1=\"200.0\" y1=\"104.0\" x2=\"200.0\" y2=\"140.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g571f3a5f)\" />\u003ctext x=\"206.0\" y=\"128.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >아니오\u003c/text>\u003crect x=\"20.0\" y=\"142.0\" width=\"360.0\" height=\"36.0\" rx=\"8\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"1.8\" />\u003ctext x=\"30.0\" y=\"158.0\" font-size=\"12\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"bold\" >① 조제 확인\u003c/text>\u003ctext x=\"30.0\" y=\"173.0\" font-size=\"10.2\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >렌즈미터: S·C·축·ADD·프리즘, 좌우 바뀜, 광학중심/PRP 위치\u003c/text>\u003cline x1=\"200.0\" y1=\"178.0\" x2=\"200.0\" y2=\"186.0\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" marker-end=\"url(#g571f3a5f)\" />\u003crect x=\"20.0\" y=\"186.0\" width=\"360.0\" height=\"36.0\" rx=\"8\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"1.8\" />\u003ctext x=\"30.0\" y=\"202.0\" font-size=\"12\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"bold\" >② 피팅 확인\u003c/text>\u003ctext x=\"30.0\" y=\"217.0\" font-size=\"10.2\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >PD·피팅 높이·경사각·정점간거리·안면각·코받침\u003c/text>\u003cline x1=\"200.0\" y1=\"222.0\" x2=\"200.0\" y2=\"230.0\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" marker-end=\"url(#g571f3a5f)\" />\u003crect x=\"20.0\" y=\"230.0\" width=\"360.0\" height=\"36.0\" rx=\"8\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"1.8\" />\u003ctext x=\"30.0\" y=\"246.0\" font-size=\"12\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"bold\" >③ 처방·설계 확인\u003c/text>\u003ctext x=\"30.0\" y=\"261.0\" font-size=\"10.2\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >기존 안경과 비교: 도수·축·베이스커브·렌즈 설계\u003c/text>\u003cline x1=\"200.0\" y1=\"266.0\" x2=\"200.0\" y2=\"274.0\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" marker-end=\"url(#g571f3a5f)\" />\u003crect x=\"20.0\" y=\"274.0\" width=\"360.0\" height=\"36.0\" rx=\"8\" fill=\"#e6f6ea\" stroke=\"#1b7a43\" stroke-width=\"1.8\" />\u003ctext x=\"30.0\" y=\"290.0\" font-size=\"12\" fill=\"#1b7a43\" text-anchor=\"start\" font-weight=\"bold\" >④ 적응 문제 판단\u003c/text>\u003ctext x=\"30.0\" y=\"305.0\" font-size=\"10.2\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >①~③ 정상 → 사용법 교육·1~2주 재확인\u003c/text>\u003ctext x=\"200.0\" y=\"326.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >문제를 찾으면 그 단계에서 수정 → 다시 착용 확인 → 기록\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 13-1.\u003c/b> 완성 안경 불편 호소 – 원인 찾기 흐름\u003c/figcaption>\u003c/figure>"},{"id":"s13-2","title":"13.2 증상별 원인·확인·조치 표","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003ctr>\u003cth>증상\u003c/th>\u003cth>흔한 원인\u003c/th>\u003cth>확인\u003c/th>\u003cth>조치\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>어지러움·바닥이 기울어 보임\u003c/b>\u003c/td>\u003ctd>원주·축 변화, 첫 난시 교정, 사난시, 경사각·정점간거리 변화, 베이스커브 변경\u003c/td>\u003ctd>렌즈미터 축, 기존 안경 비교, 피팅\u003c/td>\u003ctd>축 재확인, 원주 감량(SE 유지), 경사각·정점 조정, 기존 베이스커브로 재조제 검토\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>바닥·주변이 울렁임(특히 누진)\u003c/b>\u003c/td>\u003ctd>누진 주변부 비점수차, 하드 설계·짧은 누진대, 피팅 높이·PD 오차, 큰 테\u003c/td>\u003ctd>마크 복원 후 피팅 크로스–동공 위치\u003c/td>\u003ctd>높이·PD 수정, 고개 돌리기 교육, 소프트/긴 누진대 설계 변경\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>먼 곳 흐림\u003c/b>\u003c/td>\u003ctd>저교정·과교정, 축 오류, 누진 피팅 너무 높음(누진대로 먼 곳 봄)\u003c/td>\u003ctd>렌즈미터, MPMVA·적록 재검, 피팅 높이\u003c/td>\u003ctd>재조제·높이 수정, 처방 재확인\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>근거리 안 보임·좁음\u003c/b>\u003c/td>\u003ctd>ADD 부족, 근용 PD·인셋 불일치, 피팅 너무 낮음, 최소 피팅 높이 미달, 원용 과마이너스\u003c/td>\u003ctd>ADD·높이·PD, 작업거리\u003c/td>\u003ctd>높이·PD 수정, ADD·작업거리 재평가, 테 변경\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>두통·눈 피로\u003c/b>\u003c/td>\u003ctd>과마이너스, 원치 않는 프리즘(PD·높이 오차), 수직 불균형, 근거리 사위 미보상\u003c/td>\u003ctd>렌즈미터 프리즘, PD·광학중심, 커버테스트\u003c/td>\u003ctd>재조제, 구면 +0.25 D 비교, 양안시 재평가\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>겹쳐 보임(복시)\u003c/b>\u003c/td>\u003ctd>광학중심 높이 차로 수직 프리즘, PD 오차, 부등시에서 프리즘 차이, 처방 프리즘 오류\u003c/td>\u003ctd>벗으면 사라지는지, PRP 높이·프리즘\u003c/td>\u003ctd>즉시 재조제. \u003cb>벗어도 겹치거나 갑자기 생김 → 안과 의뢰\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>주변부 왜곡·사물이 휘어 보임\u003c/b>\u003c/td>\u003ctd>고도수 렌즈의 수차, 경사각·안면각 부적합, 큰 테·넓은 렌즈, 비구면 광학중심 높이 오류\u003c/td>\u003ctd>경사각·광학중심 높이\u003c/td>\u003ctd>경사각 1°당 광학중심 약 0.5 mm 낮추는 원칙 확인, 테·설계 변경\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>물체 크기가 다르게 보임·좌우 차이\u003c/b>\u003c/td>\u003ctd>부등시 배율 차, 정점간거리 차이, 베이스커브 차이\u003c/td>\u003ctd>좌우 도수 차, 정점간거리\u003c/td>\u003ctd>정점간거리 줄이기, 배율 고려 설계, 필요 시 CL 안내\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>한쪽만 흐림\u003c/b>\u003c/td>\u003ctd>좌우 바뀜, 축 오류, 광학중심 이탈\u003c/td>\u003ctd>렌즈미터 좌우 확인\u003c/td>\u003ctd>재조제\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>번쩍임·반사·색 번짐\u003c/b>\u003c/td>\u003ctd>코팅·착색 변화, 고굴절(낮은 아베수) 소재\u003c/td>\u003ctd>소재·코팅 기록\u003c/td>\u003ctd>코팅·소재 변경 상담\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp class=\"note\">근거: 비적응의 주요 원인은 테 피팅, 광학중심, 배율, 소통으로 분류되며 경사각·정점간거리 오류는 유효 도수를 바꾸고 프리즘을 만듭니다.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref43\">43\u003c/a>]\u003c/sup> 처방 변화가 작을 때는 기존 안경의 베이스커브를 맞추는 것이 권장됩니다.\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref45\">45\u003c/a>]\u003c/sup>\u003c/p>\n\u003cfigure class=\"gf\" id=\"fig13-2\">\u003csvg class=\"fig\" viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"누진 피팅 높이 오차: 너무 낮거나 높으면 생기는 증상\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003crect x=\"14.0\" y=\"50.0\" width=\"112.0\" height=\"96.0\" rx=\"22\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2.5\" />\u003cpath d=\"M66,98 L74,98 L82,126 L58,126 Z\" stroke=\"none\" fill=\"#e3f4e1\" stroke-width=\"0\" />\u003cline x1=\"63.0\" y1=\"92.0\" x2=\"77.0\" y2=\"92.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cline x1=\"70.0\" y1=\"85.0\" x2=\"70.0\" y2=\"99.0\" stroke=\"# " stroke-width=\"2\" />\u003ccircle cx=\"330.0\" cy=\"92.0\" r=\"9.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" opacity=\".75\"/>\u003ccircle cx=\"330.0\" cy=\"92.0\" r=\"3.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003ctext x=\"330.0\" y=\"36.0\" font-size=\"12\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"bold\" >너무 높게 조제\u003c/text>\u003ctext x=\"330.0\" y=\"166.0\" font-size=\"10.2\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >먼 곳을 누진대로 봄\u003c/text>\u003ctext x=\"330.0\" y=\"182.0\" font-size=\"10.2\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >→ 원거리 흐림\u003c/text>\u003ctext x=\"200.0\" y=\"222.0\" font-size=\"10.2\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >허용 오차 예: 피팅 크로스 높이 ±1.0 mm, 좌우 차이 1.0 mm 이내(ANSI Z80.1)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 13-2.\u003c/b> 누진 피팅 높이 오차: 너무 낮거나 높으면 생기는 증상\u003c/figcaption>\u003c/figure>\u003cfigure class=\"gf\" id=\"fig13-3\">\u003csvg class=\"fig\" viewBox=\"0 0 400 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"광학중심 높이 차이가 만드는 수직 프리즘(부등시 예)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cellipse cx=\"110.0\" cy=\"110.0\" rx=\"80.0\" ry=\"56.0\" fill=\"#f7fbff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ccircle cx=\"110.0\" cy=\"110.0\" r=\"9.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"110.0\" cy=\"110.0\" r=\"3.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cline x1=\"103.0\" y1=\"110.0\" x2=\"117.0\" y2=\"110.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cline x1=\"110.0\" y1=\"103.0\" x2=\"110.0\" y2=\"117.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003ctext x=\"110.0\" y=\"40.0\" font-size=\"12.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >R −6.00\u003c/text>\u003cellipse cx=\"290.0\" cy=\"110.0\" rx=\"80.0\" ry=\"56.0\" fill=\"#f7fbff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ccircle cx=\"290.0\" cy=\"110.0\" r=\"9.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"290.0\" cy=\"110.0\" r=\"3.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cline x1=\"283.0\" y1=\"98.0\" x2=\"297.0\" y2=\"98.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003cline x1=\"290.0\" y1=\"91.0\" x2=\"290.0\" y2=\"105.0\" stroke=\"#c0392b\" stroke-width=\"2\" />\u003ctext x=\"290.0\" y=\"40.0\" font-size=\"12.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >L −2.00\u003c/text>\u003cline x1=\"150.0\" y1=\"110.0\" x2=\"150.0\" y2=\"98.0\" stroke=\"#c0392b\" stroke-width=\"0\" />\u003ctext x=\"110.0\" y=\"186.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >광학중심 = 동공 높이\u003c/text>\u003ctext x=\"290.0\" y=\"186.0\" font-size=\"10.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >광학중심이 3 mm 위(+)\u003c/text>\u003crect x=\"10.0\" y=\"198.0\" width=\"380.0\" height=\"38.0\" rx=\"8\" fill=\"#fff8ec\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003ctext x=\"200.0\" y=\"214.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >L: 0.3 cm × 2.00 D = 0.6Δ · 높이 차가 크고 도수 차가 크면 수직 불균형↑\u003c/text>\u003ctext x=\"200.0\" y=\"230.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >수직 불균형은 작아도 복시·두통을 잘 일으킴(허용 예: 0.33Δ)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 13-3.\u003c/b> 광학중심 높이 차이가 만드는 수직 프리즘(부등시 예)\u003c/figcaption>\u003c/figure>"},{"id":"s13-3","title":"13.3 기준 수치(허용오차)로 판단하기","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003ctr>\u003cth>항목\u003c/th>\u003cth>단초점·다초점\u003c/th>\u003cth>누진\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>수직 프리즘 불균형\u003c/td>\u003ctd colspan=\"2\">0.33Δ 이하(±3.375 D 초과 렌즈는 PRP 높이 차 1.0 mm 이하)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>수평 프리즘\u003c/td>\u003ctd>0.67Δ 이하(±2.75 D 초과는 PD ±2.5 mm)\u003c/td>\u003ctd>0.67Δ 이하(±3.375 D 초과는 단안 PD ±1.0 mm)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>피팅 크로스·세그 높이\u003c/td>\u003ctd>각 ±1.0 mm, 좌우 차 1.0 mm\u003c/td>\u003ctd>각 ±1.0 mm, 좌우 차 1.0 mm\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ADD\u003c/td>\u003ctd colspan=\"2\">+4.00 D 이하 ±0.12 D\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp class=\"note\">ANSI Z80.1 요약(미국 표준, 국내 매장 기준 수립 시 참고).\u003csup class=\"rf\">[\u003ca href=\"g18.html#ref37\">37\u003c/a>]\u003c/sup> 허용오차 안이라도 고객이 민감하면(특히 수직 프리즘) 더 엄격하게 맞춥니다.\u003c/p>"},{"id":"s13-4","title":"13.4 고객 응대 스크립트","html":"\u003ctable class=\"tbl\">\u003ctr>\u003cth>상황\u003c/th>\u003cth>스크립트\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>처음 들을 때\u003c/td>\u003ctd>“불편하셨겠어요. 정확히 찾아드리려고 몇 가지 여쭤볼게요. 언제, 어떤 거리를 볼 때 가장 불편하세요? 안경을 벗으면 괜찮아지세요?”\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>점검 중\u003c/td>\u003ctd>“먼저 렌즈가 처방대로 만들어졌는지, 그다음 안경이 얼굴에 제대로 맞는지 순서대로 확인할게요.”\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>조제·피팅 문제 발견\u003c/td>\u003ctd>“렌즈 위치가 눈 위치와 조금 어긋나 있었어요. 저희 쪽에서 바로잡아 드릴게요. 다시 써 보시고 편한지 확인해 주세요.”\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>적응 문제로 판단\u003c/td>\u003ctd>“도수와 위치는 정확하게 맞아요. 새 렌즈는 뇌가 익숙해지는 데 보통 1~2주 걸려요. 이렇게 써 보시고(사용법 안내), ○일에 한 번 더 확인할게요. 그 전에 더 불편하면 언제든 오세요.”\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>누진 주변 흐림\u003c/td>\u003ctd>“누진 렌즈는 구조상 옆쪽이 조금 흐린 부분이 있어요. 옆을 보실 땐 눈만 돌리지 말고 고개를 같이 돌리면 훨씬 편해요.”\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>안과 안내\u003c/td>\u003ctd>“안경을 벗어도 겹쳐 보이시는 건 렌즈 문제가 아닐 수 있어요. 오늘 안과 진료를 먼저 받아 보시길 권해 드려요. 진료 후 오시면 바로 도와드릴게요.”\u003c/td>\u003c/tr>\u003c/table>\n\u003cdiv class=\"box err\">\u003cb>피할 말\u003c/b> “원래 그래요, 그냥 적응하세요”(점검 없이), “고객님 눈이 예민해서 그래요”(책임 전가), 진단명 단정.\u003c/div>"},{"id":"s13-5","title":"13.5 안과 의뢰가 필요한 경우","html":"\u003cul>\u003cli>안경을 벗어도 겹쳐 보이거나 \u003cb>갑자기 생긴 복시\u003c/b>, 눈꺼풀 처짐 동반\u003c/li>\n\u003cli>교정해도 시력이 기대보다 낮고 핀홀로도 개선 없음, 좌우 차 2줄 이상\u003c/li>\n\u003cli>통증·심한 충혈·새 섬광·비문증, 사물이 휘어 보임(변시증)\u003c/li>\n\u003cli>짧은 기간 도수가 크게 변함(혈당 변화 등 전신 요인 가능), 불규칙 각막 의심\u003c/li>\u003c/ul>\n\u003cp>긴급도는 7.4절 표를 따르고, 안내 내용을 기록합니다.\u003c/p>"}],"questions":[{"id":"g16-q1","question":"새 안경을 쓰고 겹쳐 보인다. 안경을 벗어도 겹친다면?","choices":["PD 재측정","적응 안내","안과 의뢰","ADD 감량"],"answer_index":2,"explanation":"벗어도 겹치면 렌즈 문제가 아닐 가능성 → 안과.","page":"g16.html"},{"id":"g16-q2","question":"누진 피팅 크로스가 동공보다 높게 조제되면?","choices":["근거리가 너무 아래","먼 곳을 누진대로 봐서 원거리 흐림","변화 없음","색 번짐"],"answer_index":1,"explanation":"너무 높으면 원거리 흐림·고개 숙임.","page":"g16.html"},{"id":"g16-q3","question":"수직 프리즘 불균형 허용 예(ANSI Z80.1)는?","choices":["0.33Δ","2Δ","0.67Δ","1Δ"],"answer_index":0,"explanation":"수직 0.33Δ, 수평 0.67Δ.","page":"g16.html"},{"id":"g16-q4","question":"불편 점검의 올바른 순서는?","choices":["처방 → 조제 → 피팅","조제 → 피팅 → 처방·설계 → 적응","적응 → 처방","피팅만"],"answer_index":1,"explanation":"조제(렌즈미터) → 피팅 → 처방·설계 → 적응 판단.","page":"g16.html"}]}]};</script>
<script>
(function () {
  var $ = EDU.$, esc = EDU.esc, sb = EDU.sb;
  var C, me, prof, prog = {}, attempts = [], answers = [];
  var main = $("#main");
  var FINAL_N = 20;

  /* ---------- offline-safe tracking queue ---------- */
  var QK = "edu-trackq";
  function qLoad() { try { return JSON.parse(localStorage.getItem(QK) || "[]"); } catch (e) { return []; } }
  function qSave(q) { localStorage.setItem(QK, JSON.stringify(q)); }
  async function track(secId, chId, seconds, complete) {
    seconds = Math.max(0, Math.round(seconds || 0));
    var p = prog[secId] || (prog[secId] = { section_id: secId, chapter_id: chId, time_spent_sec: 0, completed_at: null, last_viewed_at: null });
    p.time_spent_sec += seconds; p.last_viewed_at = new Date().toISOString();
    if (complete && !p.completed_at) p.completed_at = p.last_viewed_at;
    var q = qLoad(); q.push({ u: me.id, s: secId, c: chId, t: seconds, k: !!complete }); qSave(q);
    flushQ();
  }
  var flushing = false;
  async function flushQ() {
    if (flushing) return; flushing = true;
    try {
      var q = qLoad();
      while (q.length) {
        var it = q[0];
        if (it.u !== me.id) { q.shift(); qSave(q); continue; }
        var r = await sb.rpc("edu_track", { p_section: it.s, p_chapter: it.c, p_seconds: it.t, p_complete: it.k });
        if (r.error) break;
        q.shift(); qSave(q);
      }
    } catch (e) {} finally { flushing = false; }
  }
  setInterval(flushQ, 20000);

  /* ---------- section timer ---------- */
  var cur = null; // {sec, ch, since, acc}
  function timerStart(secId, chId) { timerStop(); cur = { sec: secId, ch: chId, since: document.hidden ? null : Date.now(), acc: 0 }; track(secId, chId, 0, false); }
  function timerTake() { if (!cur) return 0; var t = cur.acc + (cur.since ? (Date.now() - cur.since) / 1000 : 0); cur.acc = 0; cur.since = document.hidden ? null : Date.now(); return Math.min(t, 900); }
  function timerStop(complete) { if (!cur) return; var t = timerTake(); var c = cur; cur = null; if (t >= 1 || complete) track(c.sec, c.ch, t, complete); }
  setInterval(function () { if (cur) { var t = timerTake(); if (t >= 1) track(cur.sec, cur.ch, t, false); } }, 30000);
  document.addEventListener("visibilitychange", function () {
    if (!cur) return;
    if (document.hidden) { cur.acc += cur.since ? (Date.now() - cur.since) / 1000 : 0; cur.since = null; var t = timerTake(); if (t >= 1) track(cur.sec, cur.ch, t, false); }
    else cur.since = Date.now();
  });
  window.addEventListener("pagehide", function () { if (cur) { var t = timerTake(); if (t >= 1) track(cur.sec, cur.ch, t, false); } });

  /* ---------- stats helpers ---------- */
  function chPct(ch) { var d = ch.sections.filter(function (s) { return prog[s.id] && prog[s.id].completed_at; }).length; return ch.sections.length ? Math.round(100 * d / ch.sections.length) : 0; }
  function totalPct() { var d = 0; C.chapters.forEach(function (ch) { ch.sections.forEach(function (s) { if (prog[s.id] && prog[s.id].completed_at) d++; }); }); return C.totalSections ? Math.round(100 * d / C.totalSections) : 0; }
  function bestScore(kind, chId) {
    var b = null; attempts.forEach(function (a) { if (a.finished_at && a.kind === kind && (chId == null || a.chapter_id === chId) && a.total) { var p = Math.round(100 * a.score / a.total); if (b == null || p > b) b = p; } }); return b;
  }
  function wrongList() {
    // latest answer per question; wrong if latest is wrong
    var last = {};
    answers.forEach(function (a) { if (!last[a.question_id] || a.answered_at > last[a.question_id].answered_at) last[a.question_id] = a; });
    return Object.keys(last).filter(function (k) { return !last[k].correct && C.qById[k]; }).map(function (k) { return { q: C.qById[k], a: last[k] }; });
  }
  function pctBar(p) { return '<div class="progress"><i style="width:' + p + '%"></i></div>'; }

  /* ---------- views ---------- */
  function setTab(v) { document.querySelectorAll("#tabs a").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-v") === v); }); }
  function view() {
    var h = location.hash.replace(/^#/, "") || "home", parts = h.split("/");
    if (cur && !(parts[0] === "s")) timerStop();
    window.scrollTo(0, 0);
    if (quizState && parts[0] !== "quiz") quizState = null;
    switch (parts[0]) {
      case "chapters": setTab("chapters"); return vChapters();
      case "c": setTab("chapters"); return vChapter(decodeURIComponent(parts[1]));
      case "s": setTab("chapters"); return vSection(decodeURIComponent(parts[1]));
      case "final": setTab("final"); return vFinal();
      case "wrong": setTab("wrong"); return vWrong();
      case "scores": setTab("scores"); return vScores();
      case "quiz": return quizState ? renderQ() : (location.hash = "#home");
      default: setTab("home"); return vHome();
    }
  }
  window.addEventListener("hashchange", view);

  function nextSection() {
    for (var i = 0; i < C.chapters.length; i++) { var ch = C.chapters[i]; for (var j = 0; j < ch.sections.length; j++) { var s = ch.sections[j]; if (!(prog[s.id] && prog[s.id].completed_at)) return s; } }
    return null;
  }
  function vHome() {
    var tp = totalPct(), nx = nextSection(), w = wrongList().length, fb = bestScore("final");
    var done = attempts.filter(function (a) { return a.finished_at; });
    var avg = done.length ? Math.round(done.reduce(function (n, a) { return n + (a.total ? 100 * a.score / a.total : 0); }, 0) / done.length) : null;
    main.innerHTML = '<h1>' + esc(prof.display_name) + '님, 안녕하세요 👋</h1>' +
      '<div class="card"><b>전체 진도 ' + tp + '%</b>' + pctBar(tp) +
      '<div class="kpi" style="margin-top:10px"><div><b>' + tp + '%</b><span>학습 진도</span></div><div><b>' + (avg == null ? "-" : avg + "점") + '</b><span>평균 점수</span></div><div><b>' + (fb == null ? "-" : fb + "점") + '</b><span>최종평가 최고</span></div></div>' +
      '<div class="ctrl" style="margin-top:10px">' + (nx ? '<a class="btn o" href="#s/' + encodeURIComponent(nx.id) + '">이어서 학습 ▶</a>' : '<span class="badge g">모든 섹션 완료!</span>') +
      '<a class="btn" href="#final">최종평가</a><a class="btn l" href="#wrong">오답노트 ' + w + '</a></div></div>' +
      '<h2>장별 진도</h2>' + chapterRows();
  }
  function chapterRows() {
    return C.chapters.map(function (ch) {
      var p = chPct(ch), b = bestScore("chapter", ch.id);
      return '<div class="chrow' + (p === 100 ? " done" : "") + '" data-ch="' + esc(ch.id) + '"><div class="n">' + esc(ch.no) + '</div><div class="b"><b>' + esc(ch.title) + '</b>' + pctBar(p) +
        '<span class="meta">' + ch.sections.length + '개 섹션 · 평가 ' + ch.questions.length + '문항' + (b != null ? ' · 최고 ' + b + '점' : '') + '</span></div><div class="pct">' + p + '%</div></div>';
    }).join("");
  }
  function bindRows() { main.querySelectorAll(".chrow").forEach(function (el) { el.onclick = function () { location.hash = "#c/" + encodeURIComponent(el.getAttribute("data-ch")); }; }); }
  var _vHome = vHome; vHome = function () { _vHome(); bindRows(); };
  function vChapters() { main.innerHTML = '<h1>' + esc(C.title) + '</h1><div class="card"><b>전체 진도 ' + totalPct() + '%</b>' + pctBar(totalPct()) + '<p class="meta" style="margin:8px 0 0"><a href="' + EDU.pageUrl("g00.html") + '">📖 웹 교재 전체 보기 (목차·용어집·참고문헌)</a></p></div>' + chapterRows(); bindRows(); }
  function vChapter(id) {
    var ch = C.chById[id]; if (!ch) { location.hash = "#chapters"; return; }
    var p = chPct(ch), b = bestScore("chapter", ch.id);
    main.innerHTML = '<p class="meta"><a href="#chapters">← 교재 목차</a></p><h1>' + esc(ch.no) + '. ' + esc(ch.title) + '</h1>' +
      (ch.intro ? '<div class="card">' + EDU.textToHtml(ch.intro) + '</div>' : '') + EDU.coreHtml(ch.core) +
      (ch.raw.page ? '<p class="meta"><a href="' + esc(EDU.pageUrl(ch.raw.page)) + '">📖 교재 페이지로 보기 (그림·실습·출처 포함)</a></p>' : '') +
      '<div class="card"><b>이 장 진도 ' + p + '%</b>' + pctBar(p) + '<div class="seclist">' +
      ch.sections.map(function (s, i) { var d = prog[s.id] && prog[s.id].completed_at; return '<button class="' + (d ? "done" : "") + '" data-s="' + esc(s.id) + '"><span class="ck">' + (d ? "✓" : "") + '</span><span>' + (i + 1) + '. ' + esc(s.title) + '</span></button>'; }).join("") +
      '</div></div>' +
      (ch.questions.length ? '<div class="card"><h2 style="margin-top:.2em">평가문제 (' + ch.questions.length + '문항)</h2><p class="note">풀이 결과는 자동으로 기록됩니다.' + (b != null ? ' 최고 점수 <b>' + b + '점</b>' : '') + '</p><button class="btn o" id="startq">평가문제 풀기</button></div>' : '');
    main.querySelectorAll(".seclist button").forEach(function (el) { el.onclick = function () { location.hash = "#s/" + encodeURIComponent(el.getAttribute("data-s")); }; });
    var sq = $("#startq"); if (sq) sq.onclick = function () { startQuiz("chapter", ch.id, ch.questions.slice(), true, ch.no + "장 평가문제"); };
  }
  function vSection(id) {
    var sec = C.secById[id]; if (!sec) { location.hash = "#chapters"; return; }
    var ch = C.chById[sec.chId], idx = ch.sections.indexOf(sec), nxt = ch.sections[idx + 1], prev = ch.sections[idx - 1];
    var loose = idx === ch.sections.length - 1 ? EDU.chapterLooseFigs(ch, C) : [];
    var done = prog[id] && prog[id].completed_at;
    main.innerHTML = '<p class="meta"><a href="#c/' + encodeURIComponent(ch.id) + '">← ' + esc(ch.no) + '. ' + esc(ch.title) + '</a> · ' + (idx + 1) + '/' + ch.sections.length + '</p>' +
      '<div class="sec"><h2>' + esc(sec.title) + (done ? ' <span class="badge g">완료</span>' : '') + '</h2><div class="content">' + EDU.sectionHtml(sec, C) + loose.map(EDU.figHtml).join("") + '</div></div>' +
      '<div class="stick">' + (prev ? '<a class="btn l" href="#s/' + encodeURIComponent(prev.id) + '">◀ 이전</a>' : '') +
      '<button class="btn g" id="done">' + (nxt ? "완료 ✓ 다음 섹션" : (ch.questions.length ? "완료 ✓ 평가문제로" : "완료 ✓ 목차로")) + '</button></div>';
    timerStart(sec.id, ch.id);
    $("#done").onclick = function () {
      timerStop(true);
      EDU.toast("학습 완료로 저장했어요");
      location.hash = nxt ? "#s/" + encodeURIComponent(nxt.id) : "#c/" + encodeURIComponent(ch.id);
    };
  }

  /* ---------- quiz engine ---------- */
  var quizState = null;
  async function startQuiz(kind, chId, qs, practice, label) {
    qs = qs.filter(function (q) { return q.choices.length && q.answer != null && q.answer >= 0; });
    if (!qs.length) { EDU.toast("문항이 없습니다"); return; }
    var r = await sb.from("edu_attempts").insert({ kind: kind, chapter_id: chId, total: qs.length, score: 0 }).select().single();
    if (r.error) { EDU.toast("시작 실패: " + r.error.message, 4000); return; }
    attempts.unshift(r.data);
    quizState = { attempt: r.data, qs: qs, i: 0, picks: {}, score: 0, practice: practice, label: label, kind: kind, ch: chId };
    location.hash = "#quiz"; if (location.hash === "#quiz") renderQ();
  }
  function renderQ() {
    var S = quizState; window.scrollTo(0, 0);
    if (S.i >= S.qs.length) return renderResult();
    var q = S.qs[S.i], picked = S.picks[q.id];
    main.innerHTML = '<p class="meta">' + esc(S.label) + '</p><div class="qprog">' + (S.i + 1) + ' / ' + S.qs.length + '</div>' + pctBar(Math.round(100 * S.i / S.qs.length)) +
      '<div class="q"><div class="qt">' + (S.i + 1) + '. ' + EDU.textToHtml(q.stem).replace(/^<p>|<\/p>$/g, "") + '</div>' +
      q.choices.map(function (c, i) {
        var cls = "";
        if (picked != null && S.practice) cls = i === q.answer ? "right" : (i === picked ? "wrong" : "");
        else if (picked === i) cls = "pick";
        return '<button class="opt ' + cls + '" data-i="' + i + '"' + (picked != null ? " disabled" : "") + '>' + "①②③④⑤⑥⑦⑧"[i] + ' ' + esc(c) + '</button>';
      }).join("") +
      (picked != null && S.practice ? '<div class="diag"><span class="' + (picked === q.answer ? 'ok">정답!' : 'no">오답 · 정답 ' + "①②③④⑤⑥⑦⑧"[q.answer]) + '</span>' + (q.explanation ? '<div>' + EDU.textToHtml(q.explanation) + '</div>' : '') + '</div>' : '') +
      '</div><div class="stick">' + '<button class="btn l" id="quit">그만두기</button>' + (picked != null ? '<button class="btn o" id="next">' + (S.i + 1 < S.qs.length ? "다음 문제 ▶" : "결과 보기") + '</button>' : '') + '</div>';
    main.querySelectorAll("button.opt").forEach(function (b) { b.onclick = function () { pick(+b.getAttribute("data-i")); }; });
    var nb = $("#next"); if (nb) nb.onclick = function () { S.i++; renderQ(); };
    $("#quit").onclick = function () { if (confirm("평가를 중단할까요? 지금까지 답한 문항은 기록됩니다.")) { finishAttempt(); quizState = null; location.hash = "#home"; } };
  }
  async function pick(i) {
    var S = quizState, q = S.qs[S.i]; if (S.picks[q.id] != null) return;
    S.picks[q.id] = i; var ok = i === q.answer; if (ok) S.score++;
    var row = { attempt_id: S.attempt.id, question_id: q.id, chosen: i, correct: ok, answered_at: new Date().toISOString() };
    answers.push(Object.assign({ user_id: me.id }, row));
    if (!S.practice) { S.i++; }
    renderQ();
    var r = await sb.from("edu_answers").upsert(row, { onConflict: "attempt_id,question_id" });
    if (r.error) EDU.toast("답안 저장 실패(재시도 필요): " + r.error.message, 4000);
    if (S.i >= S.qs.length || Object.keys(S.picks).length === S.qs.length) finishAttempt();
  }
  async function finishAttempt() {
    var S = quizState; if (!S || S.finished) return;
    var answered = Object.keys(S.picks).length; if (answered < S.qs.length && !S.quit) { /* partial */ }
    S.finished = answered === S.qs.length;
    var patch = { score: S.score, total: S.qs.length, finished_at: new Date().toISOString() };
    var r = await sb.from("edu_attempts").update(patch).eq("id", S.attempt.id).select().single();
    if (!r.error) { var a = attempts.find(function (x) { return x.id === S.attempt.id; }); if (a) Object.assign(a, r.data); }
  }
  function renderResult() {
    var S = quizState, p = Math.round(100 * S.score / S.qs.length);
    main.innerHTML = '<h1>' + esc(S.label) + ' 결과</h1><div class="card" style="text-align:center"><div class="dday" style="color:' + (p >= 60 ? "#1b7a43" : "#c0392b") + '">' + p + '점</div><p>' + S.qs.length + '문항 중 <b>' + S.score + '</b>개 정답' + (p >= 60 ? " · 합격선(60점) 통과 🎉" : " · 60점 이상을 목표로 다시 도전해 보세요") + '</p>' +
      '<div class="ctrl" style="justify-content:center"><a class="btn o" href="#wrong">오답노트</a><a class="btn l" href="#home">홈으로</a></div></div><h2>문항별 확인</h2>' +
      S.qs.map(function (q, n) { var pk = S.picks[q.id], ok = pk === q.answer;
        return '<div class="q"><div class="qh"><span class="num">' + (n + 1) + '.</span>' + (ok ? '<span class="badge g">정답</span>' : '<span class="badge r">오답</span>') + '</div><div class="qt">' + esc(q.stem) + '</div>' +
          '<div class="note">내 답: ' + (pk == null ? "-" : "①②③④⑤⑥⑦⑧"[pk] + " " + esc(q.choices[pk])) + '<br>정답: ' + "①②③④⑤⑥⑦⑧"[q.answer] + ' ' + esc(q.choices[q.answer]) + '</div>' + (q.explanation && !ok ? '<div class="diag">' + EDU.textToHtml(q.explanation) + '</div>' : '') + '</div>'; }).join("");
  }
  function sample(arr, n) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a.slice(0, n); }
  function finalPool() {
    if (C.finalQs.length) return C.finalQs.slice();
    // balanced sample across chapters
    var per = Math.max(1, Math.ceil(FINAL_N / Math.max(1, C.chapters.length))), out = [];
    C.chapters.forEach(function (ch) { out = out.concat(sample(ch.questions, per)); });
    return sample(out, Math.min(FINAL_N, out.length));
  }
  function vFinal() {
    var pool = C.finalQs.length || C.allQs.length, fb = bestScore("final");
    var fins = attempts.filter(function (a) { return a.kind === "final" && a.finished_at; });
    main.innerHTML = '<h1>최종평가</h1><div class="card"><p>전 범위에서 <b>' + (C.finalQs.length ? C.finalQs.length : Math.min(FINAL_N, pool)) + '문항</b>을 풉니다. 풀이 중에는 정답이 표시되지 않고, 끝난 뒤 결과와 해설을 보여 드려요.</p>' +
      '<p class="note">현재 진도 ' + totalPct() + '% · 최고 점수 ' + (fb == null ? "-" : fb + "점") + ' · 응시 ' + fins.length + '회</p><button class="btn o" id="go">최종평가 시작</button></div>';
    $("#go").onclick = function () { startQuiz("final", "final", C.finalQs.length ? sample(C.finalQs, C.finalQs.length) : finalPool(), false, "최종평가"); };
  }
  function vWrong() {
    var w = wrongList();
    main.innerHTML = '<h1>오답노트</h1>' + (w.length ? '<div class="card"><p>최근에 틀린 문제 <b>' + w.length + '개</b>. 다시 풀어서 맞히면 목록에서 빠집니다.</p><button class="btn o" id="retry">틀린 문제 다시 풀기</button></div>' : '<div class="card">틀린 문제가 없어요 👍</div>') +
      w.map(function (x) { var q = x.q, ch = C.chById[q.ch];
        return '<div class="q"><div class="qh"><span class="badge">' + esc(ch ? ch.no + "장" : "최종") + '</span><span class="mtl">' + EDU.fmtDT(x.a.answered_at) + '</span></div><div class="qt">' + esc(q.stem) + '</div>' +
          '<div class="note"><span class="no" style="color:#c0392b">내 답: ' + (x.a.chosen == null ? "-" : "①②③④⑤⑥⑦⑧"[x.a.chosen] + " " + esc(q.choices[x.a.chosen])) + '</span><br><b style="color:#1b7a43">정답: ' + "①②③④⑤⑥⑦⑧"[q.answer] + ' ' + esc(q.choices[q.answer]) + '</b></div>' +
          (q.explanation ? '<div class="diag">' + EDU.textToHtml(q.explanation) + '</div>' : '') + '</div>'; }).join("");
    var rb = $("#retry"); if (rb) rb.onclick = function () { startQuiz("chapter", "review", w.map(function (x) { return x.q; }), true, "오답 다시 풀기"); };
  }
  function vScores() {
    var rows = attempts.filter(function (a) { return a.finished_at; });
    main.innerHTML = '<h1>내 성적</h1><div class="card"><b>전체 진도 ' + totalPct() + '%</b>' + pctBar(totalPct()) + '</div>' +
      '<h2>장별</h2><div class="tblw"><table class="tbl"><tr><th>장</th><th class="c">진도</th><th class="c">학습시간</th><th class="c">최고점</th></tr>' +
      C.chapters.map(function (ch) { var t = ch.sections.reduce(function (n, s) { return n + (prog[s.id] ? prog[s.id].time_spent_sec : 0); }, 0), b = bestScore("chapter", ch.id);
        return '<tr><td>' + esc(ch.no + ". " + ch.title) + '</td><td class="c">' + chPct(ch) + '%</td><td class="c">' + EDU.fmtDur(t) + '</td><td class="c">' + (b == null ? "-" : b) + '</td></tr>'; }).join("") + '</table></div>' +
      '<h2>응시 기록</h2>' + (rows.length ? '<div class="tblw"><table class="tbl"><tr><th>일시</th><th>구분</th><th class="c">점수</th></tr>' +
      rows.map(function (a) { var ch = C.chById[a.chapter_id]; return '<tr><td>' + EDU.fmtDT(a.finished_at) + '</td><td>' + esc(a.kind === "final" ? "최종평가" : (ch ? ch.no + "장 " + ch.title : (a.chapter_id === "review" ? "오답 다시 풀기" : a.chapter_id))) + '</td><td class="c">' + a.score + '/' + a.total + ' (' + (a.total ? Math.round(100 * a.score / a.total) : 0) + '점)</td></tr>'; }).join("") + '</table></div>' : '<div class="card">아직 응시 기록이 없어요.</div>');
  }

  /* ---------- boot ---------- */
  async function boot() {
    var s = await sb.auth.getSession();
    if (!s.data.session) { EDU.go("edu-login.html"); return; }
    me = s.data.session.user;
    var pr = await sb.from("edu_profiles").select("*").eq("user_id", me.id).maybeSingle();
    if (pr.error || !pr.data) { main.innerHTML = '<div class="card err">교육용 계정 정보를 찾지 못했습니다. ' + esc(pr.error ? pr.error.message : "") + '</div><button class="btn" onclick="EDU.logout()">다시 로그인</button>'; return; }
    prof = pr.data;
    if (!prof.active) { main.innerHTML = '<div class="card err">비활성화된 계정입니다. 관리자에게 문의하세요.</div>'; return; }
    $("#who").textContent = prof.display_name;
    try { C = await EDU.loadContent(); } catch (e) { main.innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; return; }
    $("#ttl").textContent = C.title;
    var res = await Promise.all([
      EDU.fetchAll(function (a, b) { return sb.from("edu_progress").select("section_id,chapter_id,time_spent_sec,completed_at,last_viewed_at").eq("user_id", me.id).range(a, b); }),
      EDU.fetchAll(function (a, b) { return sb.from("edu_attempts").select("*").eq("user_id", me.id).order("started_at", { ascending: false }).range(a, b); }),
      EDU.fetchAll(function (a, b) { return sb.from("edu_answers").select("attempt_id,question_id,chosen,correct,answered_at").eq("user_id", me.id).range(a, b); })
    ]);
    res[0].forEach(function (p) { prog[p.section_id] = p; }); attempts = res[1]; answers = res[2];
    if (prof.role === "admin") { var t = document.createElement("a"); t.href = EDU.pageUrl("edu-admin.html"); t.textContent = "관리자"; $("#tabs").appendChild(t); }
    flushQ();
    view();
  }
  $("#logout").onclick = function () { timerStop(); EDU.logout(); };
  sb.auth.onAuthStateChange(function (ev) { if (ev === "SIGNED_OUT") EDU.go("edu-login.html"); });
  boot();
})();
</script>
</body></html>
