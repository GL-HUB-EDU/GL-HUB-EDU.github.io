" />\u003ctext x=\"226.0\" y=\"168.0\" font-size=\"11.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >0.8\u003c/text>\u003ctext x=\"286.0\" y=\"168.0\" font-size=\"11.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >20/25\u003c/text>\u003ctext x=\"346.0\" y=\"168.0\" font-size=\"11.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >0.1\u003c/text>\u003crect x=\"196.0\" y=\"176.0\" width=\"180.0\" height=\"26.0\" rx=\"0\" fill=\"#fff8ec\" stroke=\"#cfd8e6\" stroke-width=\"1\" />\u003ctext x=\"226.0\" y=\"194.0\" font-size=\"11.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"bold\" >1.0\u003c/text>\u003ctext x=\"286.0\" y=\"194.0\" font-size=\"11.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"bold\" >20/20\u003c/text>\u003ctext x=\"346.0\" y=\"194.0\" font-size=\"11.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"bold\" >0.0\u003c/text>\u003crect x=\"196.0\" y=\"202.0\" width=\"180.0\" height=\"26.0\" rx=\"0\" fill=\"#fff\" stroke=\"#cfd8e6\" stroke-width=\"1\" />\u003ctext x=\"226.0\" y=\"220.0\" font-size=\"11.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >1.2\u003c/text>\u003ctext x=\"286.0\" y=\"220.0\" font-size=\"11.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >20/16\u003c/text>\u003ctext x=\"346.0\" y=\"220.0\" font-size=\"11.5\" fill=\"#222\" text-anchor=\"middle\" font-weight=\"normal\" >−0.1\u003c/text>\u003ctext x=\"286.0\" y=\"240.0\" font-size=\"11\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"normal\" >1.0 ≈ 6/6 = 20/20 = logMAR 0.0\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-3.\u003c/b> 란돌트 고리와 시력 표기 비교\u003c/figcaption>\u003c/figure>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>시력표 거리와 조명을 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>단안(R→L) 후 양안을 측정했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>가림판이 눈을 누르지 않았다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>나안/기존안경/최대교정을 구분해 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>근거리 시력을 측정했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>교정시력 미달 시 핀홀 시력을 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>고객이 같은 줄을 외우지 않도록 시표를 바꿨다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s3-5","title":"3.5 타각적 굴절검사 (Objective refraction)","html":"\u003cp>\u003cb>타각적(객관적)\u003c/b> 검사는 고객의 응답 없이 기계나 검사자의 관찰로 굴절 상태를 측정하는 검사입니다. 현행 시행령상 안경사가 할 수 있는 타각적 굴절검사는 \u003cb>약제를 사용하지 않는 검사 중 자동굴절검사기기를 이용한 검사\u003c/b>로 한정됩니다. 검영법(레티노스코프)은 보건복지부가 의사 업무로 설명하고 있으므로, 안경원에서는 \u003cb>원리 이해용\u003c/b>으로만 학습합니다.\u003c/p>"},{"id":"s3-5-1","title":"3.5.1 자동굴절검사기(오토레프랙터/오토케라토미터)","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>자각적 검사의 시작값(출발점) 확보\u003c/li>\u003cli>각막곡률(K값)과 각막난시 확인\u003c/li>\u003cli>측정값 불안정 등 이상 징후 발견\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>기기 위생(턱받침·이마받침 소독) 및 고객 자세: 턱·이마 밀착, 머리 기울지 않게\u003c/li>\u003cli>&quot;안쪽 그림(열기구·집 등)을 편하게 보세요. 일부러 초점 맞추려 하지 마세요&quot; 안내\u003c/li>\u003cli>눈 깜빡임 후 측정, 동공 중심 정렬 확인\u003c/li>\u003cli>눈당 3회 이상 측정, 신뢰도 지수(기기 표시) 확인, 값이 크게 흔들리면 휴식·깜빡임 후 재측정\u003c/li>\u003cli>S/C/Ax, K1/K2(곡률·축), 필요 시 동공 크기 기록\u003c/li>\u003c/ol>\u003cp class=\"link1\">🔗 \u003ca href=\"#s/s6-1\">오토레프·케라토 구조 그림은 6.1·6.2절\u003c/a>에서 볼 수 있어요.\u003c/p>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>자동굴절검사기는 내부 시표를 흐리게(운무) 보여 조절을 쉬게 하도록 설계되어 있으나, 기계를 가까이 본다는 인식 때문에 젊은 층·아동은 조절이 개입해 \u003cb>근시가 과대 측정\u003c/b>되는 경향(기계 근시, instrument/proximal accommodation)이 알려져 있음 → 결과는 &#x27;참고값&#x27;이며 자각 검사로 확인.\u003c/li>\u003cli>대한검안학회 자료도 자동굴절검사 결과는 참고 자료로 활용되며 조절력이 강한 아동에서 정확도가 떨어질 수 있다고 설명.\u003c/li>\u003cli>각막난시(케라토)와 전체 난시(레프)가 다르면 수정체 난시 등 내부 난시가 기여하는 것. 두 값을 비교하면 난시 원인 이해에 도움.\u003c/li>\u003c/ul>\u003cdiv class=\"box err\">\u003cb>주의\u003c/b>\u003cul>\u003cli>오토레프 값을 그대로 처방하지 않습니다. 특히 젊은 근시는 과교정(과마이너스) 위험이 큽니다.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>턱받침·이마받침을 소독했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>고객 머리가 기울지 않았다(축 오차 방지)\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>눈당 3회 이상 측정했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>신뢰도 낮은 값은 재측정했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>K값과 각막난시를 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>레프 난시와 케라 난시를 비교했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>값이 매우 불규칙하면 안과 의뢰 필요성을 검토했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>\u003ch3 id=\"s3-5-2\">3.5.2 [이론] 검영법(Retinoscopy)의 원리 – 안경원 수행 불가, 이해용\u003c/h3>\u003cp class=\"link1\">🔗 \u003ca href=\"#s/s6-6\">검영기 그림은 6.6절\u003c/a>에서 볼 수 있어요.\u003c/p>\u003cp>검영법은 검사자가 레티노스코프로 빛줄기(streak)를 눈에 비추고 동공 안 반사광(reflex)의 움직임을 관찰해 굴절이상을 측정하는 방법입니다. 본질은 \u003cb>&#x27;환자의 원점을 검사자의 눈(관찰구) 위치로 옮기는 렌즈&#x27;를 찾는 것\u003c/b>입니다.\u003c/p>\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>관찰\u003c/th>\u003cth>의미 (원점 위치)\u003c/th>\u003cth>교정 방향\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>동행(with motion): 반사광이 빛줄기와 같은 방향으로 움직임\u003c/td>\u003ctd>원점이 검사자보다 뒤(멀리) 또는 눈 뒤쪽 — 정시, 원시, 작업거리보다 약한 근시\u003c/td>\u003ctd>플러스(+) 렌즈 추가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>역행(against motion): 반대 방향으로 움직임\u003c/td>\u003ctd>원점이 환자와 검사자 사이 — 작업거리보다 강한 근시\u003c/td>\u003ctd>마이너스(−) 렌즈 추가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>중화(neutral): 동공 전체가 한 번에 밝아지고 움직임 없음\u003c/td>\u003ctd>원점이 정확히 관찰구 위치\u003c/td>\u003ctd>이때의 렌즈 = 총 검영값(gross)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig3-4\">\u003csvg class=\"fig\" viewBox=\"0 0 380 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"검영법의 동행·역행·중화(이해용, 안경원 수행 불가)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g152a6fdb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#2a6fdb\"/>\u003c/marker>\u003cmarker id=\"g15c0392b\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/>\u003c/marker>\u003cmarker id=\"g15e07b00\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#e07b00\"/>\u003c/marker>\u003c/defs>\u003crect x=\"10.0\" y=\"14.0\" width=\"360.0\" height=\"76.0\" rx=\"10\" fill=\"#fff\" stroke=\"#d7deea\" stroke-width=\"1\" />\u003ccircle cx=\"58.0\" cy=\"52.0\" r=\"26.0\" fill=\"#2a1a10\" stroke=\"#111\" stroke-width=\"1\" />\u003cclipPath id=\"cpg150\">\u003ccircle cx=\"58\" cy=\"52\" r=\"24\"/>\u003c/clipPath>\u003crect x=\"50.0\" y=\"26.0\" width=\"12.0\" height=\"52.0\" rx=\"0\" fill=\"#ffcf6b\" stroke=\"#ffcf6b\" stroke-width=\"0\" clip-path=\"url(#cpg150)\"/>\u003cline x1=\"36.0\" y1=\"20.0\" x2=\"80.0\" y2=\"20.0\" stroke=\"#e07b00\" stroke-width=\"1.5\" marker-end=\"url(#g15e07b00)\" />\u003cline x1=\"36.0\" y1=\"86.0\" x2=\"80.0\" y2=\"86.0\" stroke=\"#2a6fdb\" stroke-width=\"2\" marker-end=\"url(#g152a6fdb)\" />\u003ctext x=\"100.0\" y=\"38.0\" font-size=\"15\" fill=\"#2a6fdb\" text-anchor=\"start\" font-weight=\"bold\" >동행\u003c/text>\u003ctext x=\"140.0\" y=\"38.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >반사광이 빛줄기와 같은 쪽\u003c/text>\u003ctext x=\"100.0\" y=\"60.0\" font-size=\"12\" fill=\"#2a6fdb\" text-anchor=\"start\" font-weight=\"normal\" >→ + 렌즈 추가\u003c/text>\u003ctext x=\"100.0\" y=\"80.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"start\" font-weight=\"normal\" >원점이 검사자 뒤(멀리)\u003c/text>\u003crect x=\"10.0\" y=\"98.0\" width=\"360.0\" height=\"76.0\" rx=\"10\" fill=\"#fff\" stroke=\"#d7deea\" stroke-width=\"1\" />\u003ccircle cx=\"58.0\" cy=\"136.0\" r=\"26.0\" fill=\"#2a1a10\" stroke=\"#111\" stroke-width=\"1\" />\u003cclipPath id=\"cpg151\">\u003ccircle cx=\"58\" cy=\"136\" r=\"24\"/>\u003c/clipPath>\u003crect x=\"50.0\" y=\"110.0\" width=\"12.0\" height=\"52.0\" rx=\"0\" fill=\"#ffcf6b\" stroke=\"#ffcf6b\" stroke-width=\"0\" clip-path=\"url(#cpg151)\"/>\u003cline x1=\"36.0\" y1=\"104.0\" x2=\"80.0\" y2=\"104.0\" stroke=\"#e07b00\" stroke-width=\"1.5\" marker-end=\"url(#g15e07b00)\" />\u003cline x1=\"80.0\" y1=\"170.0\" x2=\"36.0\" y2=\"170.0\" stroke=\"#c0392b\" stroke-width=\"2\" marker-end=\"url(#g15c0392b)\" />\u003ctext x=\"100.0\" y=\"122.0\" font-size=\"15\" fill=\"#c0392b\" text-anchor=\"start\" font-weight=\"bold\" >역행\u003c/text>\u003ctext x=\"140.0\" y=\"122.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >반대쪽으로 움직임\u003c/text>\u003ctext x=\"100.0\" y=\"144.0\" font-size=\"12\" fill=\"#c0392b\" text-anchor=\"start\" font-weight=\"normal\" >→ − 렌즈 추가\u003c/text>\u003ctext x=\"100.0\" y=\"164.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"start\" font-weight=\"normal\" >원점이 환자와 검사자 사이\u003c/text>\u003crect x=\"10.0\" y=\"182.0\" width=\"360.0\" height=\"76.0\" rx=\"10\" fill=\"#fff\" stroke=\"#d7deea\" stroke-width=\"1\" />\u003ccircle cx=\"58.0\" cy=\"220.0\" r=\"26.0\" fill=\"#2a1a10\" stroke=\"#111\" stroke-width=\"1\" />\u003ccircle cx=\"58.0\" cy=\"220.0\" r=\"24.0\" fill=\"#ffcf6b\" stroke=\"#ffcf6b\" stroke-width=\"0\" />\u003ctext x=\"100.0\" y=\"206.0\" font-size=\"15\" fill=\"#1b7a43\" text-anchor=\"start\" font-weight=\"bold\" >중화\u003c/text>\u003ctext x=\"140.0\" y=\"206.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >동공 전체가 한 번에 밝음\u003c/text>\u003ctext x=\"100.0\" y=\"228.0\" font-size=\"12\" fill=\"#1b7a43\" text-anchor=\"start\" font-weight=\"normal\" >→ 이때 렌즈 = 총 검영값\u003c/text>\u003ctext x=\"100.0\" y=\"248.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"start\" font-weight=\"normal\" >원점 = 관찰구 위치\u003c/text>\u003ctext x=\"190.0\" y=\"264.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >주황 = 빛줄기 이동, 아래 = 반사광 이동 · 67 cm면 1.50 D 빼기\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-4.\u003c/b> 검영법의 동행·역행·중화(이해용, 안경원 수행 불가)\u003c/figcaption>\u003c/figure>\u003cul>\u003cli>중화에 가까워질수록 반사광이 \u003cb>더 밝고, 넓고, 빨라짐\u003c/b>(멀면 어둡고 좁고 느림).\u003c/li>\u003cli>\u003cb>작업거리 보정\u003c/b>: 중화 시 원점은 무한원이 아니라 검사자 위치이므로, 작업거리의 디옵터(1/거리)를 빼야 원거리 처방이 됨. 67cm → 1.50D, 50cm → 2.00D. 예) 67cm에서 +4.00D로 중화 → 처방 +2.50D. 일부는 작업거리 렌즈(+1.50D)를 미리 넣고 마지막에 뺌.\u003c/li>\u003cli>난시는 두 주경선을 각각 중화해 그 차이로 원주도수와 축을 구함.\u003c/li>\u003cli>\u003cb>안경원 업무 범위 밖\u003c/b>: 현행 시행령은 안경사의 타각적 굴절검사를 자동굴절검사기기 이용 검사로 한정합니다. 이 원리는 오토레프 결과 해석과 원점 개념 이해에 활용하십시오.\u003c/li>\u003c/ul>"}],"questions":[{"id":"g04-q1","question":"렌즈미터로 안경을 잴 때 받침에 닿는 면은?","choices":["렌즈 앞면","렌즈 뒷면","어느 쪽이든","테 다리"],"answer_index":1,"explanation":"처방은 뒷면 정점 굴절력 기준이라 뒷면을 받침에 대요.","page":"g04.html"},{"id":"g04-q2","question":"−6.00 D 렌즈에서 광학중심이 2 mm 벗어나면 프리즘은?","choices":["0.12Δ","1.2Δ","12Δ","3Δ"],"answer_index":1,"explanation":"Δ = 0.2 cm × 6 = 1.2Δ.","page":"g04.html"},{"id":"g04-q3","question":"핀홀로 시력이 좋아지지 않으면?","choices":["굴절 문제가 확실","굴절 외 원인 의심 → 안과 의뢰 고려","ADD 추가","오토레프 재측정만"],"answer_index":1,"explanation":"핀홀은 굴절 흐림만 줄여요. 개선이 없으면 매질·망막 문제 가능성.","page":"g04.html"},{"id":"g04-q4","question":"검영법에서 역행(against)이 보이면?","choices":["+ 렌즈 추가","− 렌즈 추가","중화","작업거리 무시"],"answer_index":1,"explanation":"역행 = 원점이 환자와 검사자 사이 → − 렌즈 추가(이해용, 안경원 수행 불가).","page":"g04.html"}]},{"id":"g05","no":"3②","title":"검사 절차 ② 자각적 굴절검사","page":"g05.html","intro":"","key_points":["순서: 운무 → MPMVA → 난시 축 → 도수 → 구면 재확인 → 양안균형.","MPMVA: 더 이상 줄이 늘지 않으면 멈춤. '진해 보임'은 개선이 아님.","JCC: 축 먼저 , −0.50 C마다 S +0.25(SE 유지).","적록: RAM-GAP, '검고 진한 쪽'을 묻는다. 양안균형은 +0.75 D 운무 후."],"sections":[{"id":"s3-6","title":"3.6 자각적 굴절검사 개요 (Subjective refraction)","html":"\u003cp>자각적(주관적) 굴절검사는 렌즈를 바꿔 보여주며 고객의 응답으로 가장 선명하고 편안한 도수를 찾는 검사입니다. 국제적으로 널리 쓰이는 표준 순서는 다음과 같습니다(Clinical Optics, Iowa 대학 교육자료 등).\u003c/p>\u003col>\u003cli>\u003cb>단안 운무 → 구면 정밀화(MPMVA: 최고 시력을 주는 최대 플러스)\u003c/b>\u003c/li>\u003cli>\u003cb>난시 축 → 난시 도수 정밀화(JCC)\u003c/b> — 축을 먼저(도수가 틀려도 축은 찾을 수 있지만 반대는 어려움)\u003c/li>\u003cli>\u003cb>구면 재확인(MPMVA 2차, 적록검사)\u003c/b> — 원주가 0.50D 이상 또는 축이 10° 이상 바뀐 경우 특히 필요\u003c/li>\u003cli>반대 눈 반복\u003c/li>\u003cli>\u003cb>양안균형\u003c/b>(두 눈의 조절이 똑같이 이완된 상태 맞추기)\u003c/li>\u003cli>\u003cb>양안 최종 구면 조정\u003c/b> → 근용 가입도(노안) → 착용 테스트\u003c/li>\u003c/ol>\u003cp>시작값은 기존 안경 도수 또는 오토레프 값 중 적절한 것을 선택하고, 포롭터에 단안 PD·정점간거리·수평을 맞춘 뒤 시작합니다.\u003c/p>\u003cfigure class=\"gf\" id=\"fig3-5\">\u003csvg class=\"fig\" viewBox=\"0 0 360 444\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"자각적 굴절검사 표준 순서\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g161f3a5f\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f3a5f\"/>\u003c/marker>\u003c/defs>\u003crect x=\"14.0\" y=\"8.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"28.0\" font-size=\"14\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >시작값\u003c/text>\u003ctext x=\"180.0\" y=\"45.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >기존 안경 또는 오토레프 · PD·정점간거리 세팅\u003c/text>\u003cline x1=\"180.0\" y1=\"54.0\" x2=\"180.0\" y2=\"68.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g161f3a5f)\" />\u003crect x=\"14.0\" y=\"70.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"90.0\" font-size=\"14\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >① 단안 운무 → MPMVA\u003c/text>\u003ctext x=\"180.0\" y=\"107.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >+0.75~1.00 D 흐리게 → 0.25 D씩 줄이기\u003c/text>\u003cline x1=\"180.0\" y1=\"116.0\" x2=\"180.0\" y2=\"130.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g161f3a5f)\" />\u003crect x=\"14.0\" y=\"132.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"152.0\" font-size=\"14\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >② 난시 축 → 도수(JCC)\u003c/text>\u003ctext x=\"180.0\" y=\"169.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >축 먼저, 도수 나중 · SE 유지\u003c/text>\u003cline x1=\"180.0\" y1=\"178.0\" x2=\"180.0\" y2=\"192.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g161f3a5f)\" />\u003crect x=\"14.0\" y=\"194.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"214.0\" font-size=\"14\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >③ 구면 재확인\u003c/text>\u003ctext x=\"180.0\" y=\"231.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >MPMVA 2차 · 적록(RAM-GAP)\u003c/text>\u003cline x1=\"180.0\" y1=\"240.0\" x2=\"180.0\" y2=\"254.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g161f3a5f)\" />\u003crect x=\"14.0\" y=\"256.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"284.0\" font-size=\"14\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >④ 반대 눈 반복\u003c/text>\u003cline x1=\"180.0\" y1=\"302.0\" x2=\"180.0\" y2=\"316.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g161f3a5f)\" />\u003crect x=\"14.0\" y=\"318.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"338.0\" font-size=\"14\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >⑤ 양안균형\u003c/text>\u003ctext x=\"180.0\" y=\"355.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >+0.75 D 운무 · 프리즘 분리\u003c/text>\u003cline x1=\"180.0\" y1=\"364.0\" x2=\"180.0\" y2=\"378.0\" stroke=\"#1f3a5f\" stroke-width=\"2\" marker-end=\"url(#g161f3a5f)\" />\u003crect x=\"14.0\" y=\"380.0\" width=\"332.0\" height=\"46.0\" rx=\"10\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ctext x=\"180.0\" y=\"408.0\" font-size=\"14\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >⑥ 양안 MPMVA → ADD → 착용 테스트\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-5.\u003c/b> 자각적 굴절검사 표준 순서\u003c/figcaption>\u003c/figure>\u003cp class=\"link1\">🔗 \u003ca href=\"#s/s6-4\">포롭터·시험테 그림은 6.4·6.5절\u003c/a>에서 볼 수 있어요.\u003c/p>"},{"id":"s3-7","title":"3.7 운무법(Fogging)과 구면 정밀화(MPMVA)","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>조절을 이완시킨 상태에서 원거리 구면도수를 결정\u003c/li>\u003cli>과교정(과마이너스) 방지\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>시작값에 \u003cb>+0.75D~+1.00D 정도 플러스 추가\u003c/b>(운무) → 시력이 약 0.5~0.6(20/30~20/40) 수준으로 흐려졌는지 확인. 덜 흐려지면 +0.50D 더 추가\u003c/li>\u003cli>0.25D씩 플러스를 줄여(마이너스 방향) 가며 각 단계에서 시력 확인\u003c/li>\u003cli>\u003cb>더 이상 시력이 좋아지지 않는 지점에서 멈춤\u003c/b> = 최고 시력을 주는 최대 플러스(MPMVA)\u003c/li>\u003cli>마이너스를 0.25D 더했을 때 &#x27;글자가 작고 진해 보이기만&#x27; 하고 줄이 늘지 않으면 추가하지 않음\u003c/li>\u003c/ol>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>플러스 렌즈를 더하면 눈이 인위적으로 &#x27;근시 상태&#x27;가 됨. 이때 조절을 하면 오히려 더 흐려지므로 눈은 조절을 풀게 됨 → 조절이 쉰 상태에서 도수를 찾을 수 있음.\u003c/li>\u003cli>MPMVA는 조절이 이완된 상태에서 최소착란원을 망막에 두는 도수를 찾는 원리.\u003c/li>\u003cli>Iowa 대학 교육자료: 마이너스 0.25D 추가마다 대략 한 줄의 시력 향상이 기대되며, 시력 향상 없이 추가 마이너스를 주지 말 것.\u003c/li>\u003c/ul>\u003cfigure class=\"gf\" id=\"fig3-6\">\u003csvg class=\"fig\" viewBox=\"0 0 380 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"운무법과 MPMVA: 플러스 쪽에서 0.25 D씩 줄이며 시력이 멈추는 지점 찾기\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cline x1=\"50.0\" y1=\"210.0\" x2=\"350.0\" y2=\"210.0\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"44.0\" y=\"214.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >0.4\u003c/text>\u003cline x1=\"50.0\" y1=\"178.7\" x2=\"350.0\" y2=\"178.7\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"44.0\" y=\"182.7\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >0.5\u003c/text>\u003cline x1=\"50.0\" y1=\"146.2\" x2=\"350.0\" y2=\"146.2\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"44.0\" y=\"150.2\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >0.6\u003c/text>\u003cline x1=\"50.0\" y1=\"112.7\" x2=\"350.0\" y2=\"112.7\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"44.0\" y=\"116.7\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >0.8\u003c/text>\u003cline x1=\"50.0\" y1=\"81.3\" x2=\"350.0\" y2=\"81.3\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"44.0\" y=\"85.3\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >1.0\u003c/text>\u003cline x1=\"50.0\" y1=\"50.0\" x2=\"350.0\" y2=\"50.0\" stroke=\"#e3e8f0\" stroke-width=\"1\" />\u003ctext x=\"44.0\" y=\"54.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >1.2\u003c/text>\u003ctext x=\"70.0\" y=\"228.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >+1.00\u003c/text>\u003ctext x=\"115.0\" y=\"228.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >+0.75\u003c/text>\u003ctext x=\"160.0\" y=\"228.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >+0.50\u003c/text>\u003ctext x=\"205.0\" y=\"228.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >+0.25\u003c/text>\u003ctext x=\"250.0\" y=\"228.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >0.00\u003c/text>\u003ctext x=\"295.0\" y=\"228.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >−0.25\u003c/text>\u003ctext x=\"340.0\" y=\"228.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >−0.50\u003c/text>\u003cpath d=\"M70.0,210.0 L115.0,178.7 L160.0,146.2 L205.0,112.7 L250.0,81.3 L295.0,81.3 L340.0,81.3\" stroke=\"#1f3a5f\" fill=\"none\" stroke-width=\"2.5\" />\u003ccircle cx=\"70.0\" cy=\"210.0\" r=\"4.5\" fill=\"#1f3a5f\" stroke=\"#fff\" stroke-width=\"1.5\" />\u003ccircle cx=\"115.0\" cy=\"178.7\" r=\"4.5\" fill=\"#1f3a5f\" stroke=\"#fff\" stroke-width=\"1.5\" />\u003ccircle cx=\"160.0\" cy=\"146.2\" r=\"4.5\" fill=\"#1f3a5f\" stroke=\"#fff\" stroke-width=\"1.5\" />\u003ccircle cx=\"205.0\" cy=\"112.7\" r=\"4.5\" fill=\"#1f3a5f\" stroke=\"#fff\" stroke-width=\"1.5\" />\u003ccircle cx=\"250.0\" cy=\"81.3\" r=\"4.5\" fill=\"#1b7a43\" stroke=\"#fff\" stroke-width=\"1.5\" />\u003ccircle cx=\"295.0\" cy=\"81.3\" r=\"4.5\" fill=\"#666\" stroke=\"#fff\" stroke-width=\"1.5\" />\u003ccircle cx=\"340.0\" cy=\"81.3\" r=\"4.5\" fill=\"#666\" stroke=\"#fff\" stroke-width=\"1.5\" />\u003cline x1=\"250.0\" y1=\"73.3\" x2=\"250.0\" y2=\"41.3\" stroke=\"#1b7a43\" stroke-width=\"1.5\" />\u003ctext x=\"250.0\" y=\"35.3\" font-size=\"12\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >MPMVA 여기서 멈춤\u003c/text>\u003ctext x=\"334.0\" y=\"103.3\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >더 −: 작고 진해질 뿐\u003c/text>\u003ctext x=\"74.0\" y=\"198.0\" font-size=\"10.5\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"normal\" >운무(약 0.5)\u003c/text>\u003ctext x=\"200.0\" y=\"250.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >시작값 대비 추가 렌즈(D) → 마이너스 방향\u003c/text>\u003ctext x=\"16.0\" y=\"130.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >시력\u003c/text>\u003ctext x=\"200.0\" y=\"24.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >※ 예시 값(개인차 큼): −0.25 D마다 약 한 줄 좋아짐\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-6.\u003c/b> 운무법과 MPMVA: 플러스 쪽에서 0.25 D씩 줄이며 시력이 멈추는 지점 찾기\u003c/figcaption>\u003c/figure>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>운무 후 시력이 충분히 흐려졌는지 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>0.25D 단계로 천천히 줄였다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>시력이 더 늘지 않는 지점에서 멈췄다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>&#x27;진해 보임&#x27;과 &#x27;더 많이 읽음&#x27;을 구분했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>단안 검사 시 반대 눈을 가렸다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s3-8","title":"3.8 난시 검출: 난시표(방사선 시표)와 운무","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>난시 유무와 대략의 축 방향 파악(보조 방법)\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>운무 상태(모든 선이 약간 흐린 상태)에서 방사선(시계 모양) 난시표 제시\u003c/li>\u003cli>&quot;가장 진하고 선명한 선이 몇 시 방향인가요?&quot; 질문\u003c/li>\u003cli>마이너스 원주 사용 시 &#x27;30 법칙&#x27;: 가장 진한 선의 양 끝 시각 중 \u003cb>작은 숫자 × 30 = 마이너스 원주 축\u003c/b> 근사값. 예) 12–6시 선이 가장 진함 → 6×30 = 180° / 3–9시 선 → 3×30 = 90°. 난시표 디자인에 따라 다를 수 있으므로 매장 장비 설명서를 함께 확인\u003c/li>\u003cli>모든 선이 같게 보일 때까지 원주를 추가 → 이후 JCC로 정밀화\u003c/li>\u003c/ol>\u003cfigure class=\"gf\" id=\"fig3-7\">\u003csvg class=\"fig\" viewBox=\"0 0 380 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"난시표(방사선 시표)와 30 법칙\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cline x1=\"110.0\" y1=\"213.0\" x2=\"110.0\" y2=\"37.0\" stroke=\"#111\" stroke-width=\"5\" />\u003cline x1=\"66.0\" y1=\"201.2\" x2=\"154.0\" y2=\"48.8\" stroke=\"#9aa3b0\" stroke-width=\"3\" />\u003cline x1=\"33.8\" y1=\"169.0\" x2=\"186.2\" y2=\"81.0\" stroke=\"#9aa3b0\" stroke-width=\"3\" />\u003cline x1=\"22.0\" y1=\"125.0\" x2=\"198.0\" y2=\"125.0\" stroke=\"#9aa3b0\" stroke-width=\"3\" />\u003cline x1=\"33.8\" y1=\"81.0\" x2=\"186.2\" y2=\"169.0\" stroke=\"#9aa3b0\" stroke-width=\"3\" />\u003cline x1=\"66.0\" y1=\"48.8\" x2=\"154.0\" y2=\"201.2\" stroke=\"#9aa3b0\" stroke-width=\"3\" />\u003ctext x=\"160.0\" y=\"42.4\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >1\u003c/text>\u003ctext x=\"196.6\" y=\"79.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >2\u003c/text>\u003ctext x=\"210.0\" y=\"129.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >3\u003c/text>\u003ctext x=\"196.6\" y=\"179.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >4\u003c/text>\u003ctext x=\"160.0\" y=\"215.6\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >5\u003c/text>\u003ctext x=\"110.0\" y=\"229.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >6\u003c/text>\u003ctext x=\"60.0\" y=\"215.6\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >7\u003c/text>\u003ctext x=\"23.4\" y=\"179.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >8\u003c/text>\u003ctext x=\"10.0\" y=\"129.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >9\u003c/text>\u003ctext x=\"23.4\" y=\"79.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >10\u003c/text>\u003ctext x=\"60.0\" y=\"42.4\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >11\u003c/text>\u003ctext x=\"110.0\" y=\"29.0\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >12\u003c/text>\u003ccircle cx=\"110.0\" cy=\"125.0\" r=\"6.0\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1\" />\u003crect x=\"225.0\" y=\"40.0\" width=\"150.0\" height=\"170.0\" rx=\"10\" fill=\"#fff8ec\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003ctext x=\"300.0\" y=\"62.0\" font-size=\"13\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >30 법칙(− 원주)\u003c/text>\u003ctext x=\"300.0\" y=\"86.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >가장 진한 선의 작은\u003c/text>\u003ctext x=\"300.0\" y=\"102.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >시각 숫자 × 30 = 축\u003c/text>\u003ctext x=\"300.0\" y=\"130.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >12–6시 진함\u003c/text>\u003ctext x=\"300.0\" y=\"146.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"normal\" >→ 6 × 30 = 180°\u003c/text>\u003ctext x=\"300.0\" y=\"172.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >3–9시 진함\u003c/text>\u003ctext x=\"300.0\" y=\"188.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"normal\" >→ 3 × 30 = 90°\u003c/text>\u003ctext x=\"110.0\" y=\"240.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >운무 상태에서 \"가장 진한 선은 몇 시?\"\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-7.\u003c/b> 난시표(방사선 시표)와 30 법칙\u003c/figcaption>\u003c/figure>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>운무로 두 초선(앞초선·뒤초선)을 모두 망막 앞에 두면, 망막에 더 가까운 초선 방향의 선이 가장 진하게 보임 → 이를 이용해 축 방향을 추정.\u003c/li>\u003cli>Moran CORE 자료: 난시표 방법은 상대적으로 덜 쓰이고 JCC가 가장 일반적인 방법.\u003c/li>\u003c/ul>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>난시표 제시 전에 운무했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>&#x27;선명/진함&#x27; 질문을 일관되게 했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>추정 축을 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>JCC로 확인할 계획을 세웠다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s3-9","title":"3.9 크로스실린더(JCC)로 난시 축·도수 정밀화","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>난시 축을 먼저, 그다음 원주도수를 정밀하게 결정\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>구면을 MPMVA로 맞춘 상태, 최고 시력보다 1~2줄 큰 둥근 시표(또는 점군 시표) 제시\u003c/li>\u003cli>\u003cb>축 정밀화\u003c/b>: JCC의 손잡이(축)를 원주 축과 일치시킴 → JCC의 주경선이 원주 축에서 45° 떨어짐. &quot;1번과 2번 중 어느 쪽이 더 선명한가요(혹은 같나요)?&quot; 마이너스 원주 사용 시 고객이 고른 쪽의 \u003cb>빨간 점(−) 방향으로 축을 돌림\u003c/b>(처음 15° 정도, 점점 5°까지 작게). 응답이 뒤집히면(왕복) 그 가운데가 축\u003c/li>\u003cli>\u003cb>도수 정밀화\u003c/b>: JCC 주경선을 원주 축에 일치(빨간 점이 축과 평행 vs 흰 점이 평행). 빨간 점 평행이 선명하면 −0.25D 원주 추가, 흰 점 평행이 선명하면 −0.25D 원주 감소. 두 면이 같으면 종료\u003c/li>\u003cli>\u003cb>구면등가 유지\u003c/b>: 원주를 −0.50D 바꿀 때마다 구면을 +0.25D(반대 방향) 보정\u003c/li>\u003cli>원주나 축이 크게 바뀌었으면 구면 재확인(MPMVA·적록)\u003c/li>\u003c/ol>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>JCC(예: ±0.25D)는 한 경선에 +, 직각 경선에 −를 가진 렌즈로, 뒤집어도 구면등가는 0 → 최소착란원 위치는 그대로 두고 &#x27;흐림의 모양&#x27;만 바꾸어 비교하게 함.\u003c/li>\u003cli>축이 틀린 경우 두 면을 대면 잔여 난시가 한쪽은 커지고 한쪽은 작아짐 → 더 선명한 쪽 방향으로 축을 움직이면 잔여 난시가 줄어듦.\u003c/li>\u003cli>축 정밀화를 먼저 하는 이유: 축은 도수가 정확하지 않아도 찾을 수 있지만, 축이 틀리면 도수가 정확히 찾아지지 않음(Clinical Optics).\u003c/li>\u003cli>구면등가 유지 이유: 원주 변경 시 최소착란원이 망막에서 벗어나지 않게 하여 비교가 공정해짐.\u003c/li>\u003c/ul>\u003cfigure class=\"gf\" id=\"fig3-8\">\u003csvg class=\"fig\" viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"잭슨 크로스실린더(JCC) 구조와 축·도수 정밀화\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003ccircle cx=\"80.0\" cy=\"105.0\" r=\"52.0\" fill=\"#cfe6ff\" stroke=\"#1f3a5f\" stroke-width=\"2.5\" />\u003cline x1=\"116.8\" y1=\"68.2\" x2=\"152.1\" y2=\"32.9\" stroke=\"#555\" stroke-width=\"8\" />\u003ccircle cx=\"112.0\" cy=\"105.0\" r=\"6.0\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003ccircle cx=\"48.0\" cy=\"105.0\" r=\"6.0\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003ccircle cx=\"80.0\" cy=\"73.0\" r=\"6.0\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\" />\u003ccircle cx=\"80.0\" cy=\"137.0\" r=\"6.0\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\" />\u003ctext x=\"80.0\" y=\"177.0\" font-size=\"10.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >빨강 = − 원주축\u003c/text>\u003ctext x=\"80.0\" y=\"209.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >흰색 = + 원주축\u003c/text>\u003ctext x=\"80.0\" y=\"193.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >손잡이 = 점 사이 45°\u003c/text>\u003ctext x=\"80.0\" y=\"22.0\" font-size=\"13\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >JCC ±0.25 D\u003c/text>\u003crect x=\"150.0\" y=\"30.0\" width=\"120.0\" height=\"210.0\" rx=\"10\" fill=\"#fff\" stroke=\"#d7deea\" stroke-width=\"1\" />\u003ctext x=\"210.0\" y=\"50.0\" font-size=\"12.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >① 축 정밀화\u003c/text>\u003ccircle cx=\"210.0\" cy=\"120.0\" r=\"40.0\" fill=\"#f7f9fc\" stroke=\"#9aa3b0\" stroke-width=\"1.5\" />\u003cline x1=\"210.0\" y1=\"168.0\" x2=\"210.0\" y2=\"72.0\" stroke=\"#1b7a43\" stroke-width=\"2\" stroke-dasharray=\"5 3\" />\u003cline x1=\"210.0\" y1=\"80.0\" x2=\"210.0\" y2=\"54.0\" stroke=\"#555\" stroke-width=\"6\" />\u003ccircle cx=\"191.6\" cy=\"101.6\" r=\"5.0\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003ccircle cx=\"228.4\" cy=\"138.4\" r=\"5.0\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003ccircle cx=\"228.4\" cy=\"101.6\" r=\"5.0\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.3\" />\u003ccircle cx=\"191.6\" cy=\"138.4\" r=\"5.0\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.3\" />\u003ctext x=\"210.0\" y=\"182.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >손잡이 = 원주축\u003c/text>\u003ctext x=\"210.0\" y=\"198.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >선명한 면의 빨간 점\u003c/text>\u003ctext x=\"210.0\" y=\"214.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >쪽으로 축 돌리기\u003c/text>\u003ctext x=\"210.0\" y=\"230.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >15° → 5°\u003c/text>\u003crect x=\"276.0\" y=\"30.0\" width=\"120.0\" height=\"210.0\" rx=\"10\" fill=\"#fff\" stroke=\"#d7deea\" stroke-width=\"1\" />\u003ctext x=\"336.0\" y=\"50.0\" font-size=\"12.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >② 도수 정밀화\u003c/text>\u003ccircle cx=\"336.0\" cy=\"120.0\" r=\"40.0\" fill=\"#f7f9fc\" stroke=\"#9aa3b0\" stroke-width=\"1.5\" />\u003cline x1=\"336.0\" y1=\"168.0\" x2=\"336.0\" y2=\"72.0\" stroke=\"#1b7a43\" stroke-width=\"2\" stroke-dasharray=\"5 3\" />\u003cline x1=\"307.7\" y1=\"91.7\" x2=\"289.3\" y2=\"73.3\" stroke=\"#555\" stroke-width=\"6\" />\u003ccircle cx=\"336.0\" cy=\"94.0\" r=\"5.0\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003ccircle cx=\"336.0\" cy=\"146.0\" r=\"5.0\" fill=\"#c0392b\" stroke=\"#c0392b\" stroke-width=\"1\" />\u003ccircle cx=\"310.0\" cy=\"120.0\" r=\"5.0\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.3\" />\u003ccircle cx=\"362.0\" cy=\"120.0\" r=\"5.0\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.3\" />\u003ctext x=\"336.0\" y=\"182.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >점 = 원주축\u003c/text>\u003ctext x=\"336.0\" y=\"198.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >빨강 평행 선명 → −0.25\u003c/text>\u003ctext x=\"336.0\" y=\"214.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >흰색 평행 선명 → +0.25\u003c/text>\u003ctext x=\"336.0\" y=\"230.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >−0.50 C마다 S +0.25\u003c/text>\u003ctext x=\"200.0\" y=\"262.0\" font-size=\"11\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"normal\" >초록 점선 = 현재 원주축(예: 90°). 뒤집어 1번·2번 비교\u003c/text>\u003ctext x=\"200.0\" y=\"282.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >뒤집어도 구면등가 0 → 최소착란원은 그대로, 흐림 모양만 바뀜\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-8.\u003c/b> 잭슨 크로스실린더(JCC) 구조와 축·도수 정밀화\u003c/figcaption>\u003c/figure>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>MPMVA 후 JCC를 시작했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>축 먼저, 도수 나중 순서를 지켰다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>&#x27;1번/2번/같음&#x27; 선택지를 모두 안내했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>각 면 제시 시간을 비슷하게 했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>원주 −0.50D 변화마다 구면 +0.25D 보정했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>원주·축이 크게 바뀌면 구면을 재확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>원주가 낮고 응답이 불명확하면 기존 값 유지를 고려했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s3-10","title":"3.10 적록검사(Duochrome)와 양안균형(Binocular balance)","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>적록: 구면 최종 확인, 과교정·저교정 판별\u003c/li>\u003cli>양안균형: 두 눈의 조절 이완 상태를 같게 맞춤\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>\u003cb>적록검사\u003c/b>: 단안으로 빨강·초록 바탕 글자 제시 → &quot;어느 쪽 글자가 더 \u003cb>검고 진하게\u003c/b> 보이나요?&quot; (선명도가 아니라 &#x27;검은 정도&#x27;를 묻기)\u003c/li>\u003cli>초록이 진함 → +0.25D 추가 / 빨강이 진함 → −0.25D 추가 / 같으면 종료(같아지지 않으면 빨강이 약간 진한 마지막 단계로 끝내는 방식이 흔함). 암기: &#x27;RAM-GAP(Red Add Minus, Green Add Plus)&#x27;\u003c/li>\u003cli>\u003cb>양안균형\u003c/b>: 두 눈을 모두 뜬 상태에서 양안에 +0.75D 운무(시력 약 0.5~0.6 수준) → 프리즘 분리(예: 오른눈 3Δ BU, 왼눈 3Δ BD) 또는 교대 가림\u003c/li>\u003cli>&quot;위·아래 중 어느 쪽이 더 선명한가요?&quot; → 더 선명한 눈에 +0.25D 추가, 같아질 때까지 반복. 같아지지 않으면 \u003cb>우세안이 약간 선명한 상태\u003c/b>로 종료\u003c/li>\u003cli>프리즘 제거 후 양안 동시에 −0.25D씩 줄여 최고 양안시력(MPMVA)까지 → 최종 원용 처방\u003c/li>\u003c/ol>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>\u003cb>적록의 원리(종색수차)\u003c/b>: 짧은 파장(초록)은 긴 파장(빨강)보다 더 많이 굴절되어 눈 안에서 더 앞에 초점이 맺힘. 노란빛이 망막에 맺히도록 정확히 교정되면 초록(앞)과 빨강(뒤)이 망막에서 같은 정도로 흐려져 같은 진하기로 보임. 초록이 진하면 → 초점이 뒤쪽(저교정 원시/과교정 근시) → 플러스 추가.\u003c/li>\u003cli>적록검사는 색 이름이 아니라 대비(진하기)를 비교하므로 색각 이상이 있어도 활용 가능하다고 흔히 설명됨(응답이 불확실하면 MPMVA 결과 우선).\u003c/li>\u003cli>\u003cb>양안균형의 이유\u003c/b>: 조절은 두 눈에 똑같은 양으로 일어나므로, 한 눈에 플러스가 더 남아 있으면 두 눈이 동시에 선명할 수 없음. 운무 상태로 우세안 효과를 줄이고 비교해야 비우세안의 과마이너스를 막을 수 있음(Iowa 자료).\u003c/li>\u003cli>양안균형은 두 눈의 최대교정시력이 비슷할 때만 의미가 있음. 차이가 크면 각 눈의 MPMVA 값을 유지.\u003c/li>\u003c/ul>\u003cfigure class=\"gf\" id=\"fig3-9\">\u003csvg class=\"fig\" viewBox=\"0 0 400 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"적록검사 원리: 초록은 앞, 빨강은 뒤에 초점(종색수차)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003ctext x=\"10.0\" y=\"2 ddle\" font-weight=\"bold\" >E\u003c/text>\u003ctext x=\"345.0\" y=\"288.0\" font-size=\"11\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >초록이 진함 → + 추가\u003c/text>\u003ctext x=\"200.0\" y=\"322.0\" font-size=\"11\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"normal\" >암기: RAM-GAP (Red Add Minus, Green Add Plus) · '검고 진한 쪽'을 물어요\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-9.\u003c/b> 적록검사 원리: 초록은 앞, 빨강은 뒤에 초점(종색수차)\u003c/figcaption>\u003c/figure>\u003cfigure class=\"gf\" id=\"fig3-10\">\u003csvg class=\"fig\" viewBox=\"0 0 380 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"양안균형: 프리즘 분리(오른눈 3Δ BU, 왼눈 3Δ BD)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003ctext x=\"110.0\" y=\"24.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >검사자가 본 프리즘 배치\u003c/text>\u003ccircle cx=\"60.0\" cy=\"160.0\" r=\"20.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ccircle cx=\"60.0\" cy=\"160.0\" r=\"7.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cpath d=\"M42,122 L78,122 L60,90 Z\" stroke=\"#2a6fdb\" fill=\"#cfe6ff\" stroke-width=\"1.5\" />\u003ctext x=\"60.0\" y=\"200.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >오른눈 3Δ BU\u003c/text>\u003ccircle cx=\"160.0\" cy=\"160.0\" r=\"20.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ccircle cx=\"160.0\" cy=\"160.0\" r=\"7.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cpath d=\"M142,90 L178,90 L160,122 Z\" stroke=\"#2a6fdb\" fill=\"#cfe6ff\" stroke-width=\"1.5\" />\u003ctext x=\"160.0\" y=\"200.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >왼눈 3Δ BD\u003c/text>\u003ctext x=\"110.0\" y=\"56.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >상은 꼭짓점 쪽으로 이동\u003c/text>\u003ctext x=\"110.0\" y=\"72.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >→ BU 오른눈은 아래 줄을 봄\u003c/text>\u003ctext x=\"300.0\" y=\"24.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\" >고객이 보는 모습\u003c/text>\u003crect x=\"236.0\" y=\"34.0\" width=\"130.0\" height=\"156.0\" rx=\"8\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.5\" />\u003crect x=\"246.0\" y=\"46.0\" width=\"110.0\" height=\"46.0\" rx=\"4\" fill=\"#eef3fa\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" />\u003ctext x=\"301.0\" y=\"76.0\" font-size=\"18\" fill=\"#111\" text-anchor=\"middle\" font-weight=\"bold\" >E P\u003c/text>\u003ctext x=\"301.0\" y=\"106.0\" font-size=\"10.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"normal\" >↑ 위 줄 = 왼눈\u003c/text>\u003crect x=\"246.0\" y=\"124.0\" width=\"110.0\" height=\"46.0\" rx=\"4\" fill=\"#fff4e6\" stroke=\"#e07b00\" stroke-width=\"1.5\" />\u003ctext x=\"301.0\" y=\"154.0\" font-size=\"18\" fill=\"#111\" text-anchor=\"middle\" font-weight=\"bold\" >E P\u003c/text>\u003ctext x=\"301.0\" y=\"184.0\" font-size=\"10.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"normal\" >↑ 아래 줄 = 오른눈\u003c/text>\u003ctext x=\"190.0\" y=\"230.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >+0.75 D 운무 → 더 선명한 줄의 눈에 +0.25 D → 같아질 때까지\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-10.\u003c/b> 양안균형: 프리즘 분리(오른눈 3Δ BU, 왼눈 3Δ BD)\u003c/figcaption>\u003c/figure>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>적록: &#x27;검고 진한 쪽&#x27;으로 질문했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>적록 결과가 MPMVA와 크게 다르면 재확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>양안균형 전 운무로 시력이 충분히 떨어졌는지 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>프리즘 분리 또는 교대가림 중 하나를 일관되게 사용했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>선명한 눈에 +0.25D씩 추가했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>프리즘 제거 후 양안 MPMVA로 마무리했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>최종 시력과 고객의 편안함을 함께 확인했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"}],"questions":[{"id":"g05-q1","question":"운무 후 마이너스를 더했더니 '더 진해졌다'지만 읽는 줄은 같다. 어떻게?","choices":["마이너스 추가","추가하지 않음","+0.50 추가","난시 추가"],"answer_index":1,"explanation":"MPMVA 원칙: 시력 향상 없는 마이너스는 주지 않아요.","page":"g05.html"},{"id":"g05-q2","question":"JCC 정밀화 순서는?","choices":["도수 → 축","축 → 도수","구면 → 프리즘","아무 순서"],"answer_index":1,"explanation":"축은 도수가 틀려도 찾을 수 있지만, 축이 틀리면 도수가 정확히 안 나와요.","page":"g05.html"},{"id":"g05-q3","question":"적록검사에서 초록 쪽이 더 진하다면?","choices":["−0.25 추가","+0.25 추가","종료","원주 추가"],"answer_index":1,"explanation":"Green Add Plus. 초점이 뒤쪽(과마이너스) → + 추가.","page":"g05.html"},{"id":"g05-q4","question":"난시표에서 3–9시 선이 가장 진하다. − 원주 축 근사값은?","choices":["30°","90°","180°","45°"],"answer_index":1,"explanation":"작은 시각 숫자 3 × 30 = 90°.","page":"g05.html"}]},{"id":"g06","no":"3③","title":"검사 절차 ③ 양안시·처방 결정","page":"g06.html","intro":"","key_points":["가림-안가림 = 사시 여부, 교대 가림 = 총 편위. 드러난 눈이 안쪽으로 → 외편위.","마독스: 선이 막대 댄 눈 쪽 = 내사위(비교차), 반대쪽 = 외사위(교차).","처방은 굴절값 + 생활 거리 + 증상 + 착용 테스트로 결정. 최종 확인은 시험테.","'1번/2번/비슷함' 세 선택지, 중립 질문, 같은 제시 시간."],"sections":[{"id":"s3-11","title":"3.11 사위·사시 검사 (커버테스트, 마독스 등)","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>두 눈의 정렬 상태(사위·사시) 확인\u003c/li>\u003cli>눈 피로·복시 호소의 원인 파악, 프리즘 고려 여부 판단\u003c/li>\u003cli>사시·새로 생긴 복시 등 \u003cb>안과 의뢰 대상\u003c/b> 선별\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>\u003cb>가림-안가림 검사(cover-uncover)\u003c/b>: 고객이 원거리(이후 근거리) 작은 시표를 주시 → 한 눈을 가리면서 \u003cb>가리지 않은 눈\u003c/b>이 움직이는지 관찰. 움직이면 사시(현성 편위). 반대 눈도 반복\u003c/li>\u003cli>\u003cb>교대 가림 검사(alternate cover)\u003c/b>: 가림판을 두 눈 사이로 1~2초 간격 번갈아 이동해 융합을 끊고, 가림판이 옮겨질 때 \u003cb>새로 드러나는 눈\u003c/b>의 움직임 관찰 → 사위+사시의 총 편위\u003c/li>\u003cli>움직임 해석: 드러난 눈이 \u003cb>안쪽으로\u003c/b> 움직임 → 원래 바깥쪽에 있었음 = \u003cb>외(外)편위(exo)\u003c/b> / \u003cb>바깥쪽으로\u003c/b> 움직임 → \u003cb>내(內)편위(eso)\u003c/b> / 아래로 움직임 → 위쪽 편위(hyper)\u003c/li>\u003cli>필요 시 프리즘 바를 대어 움직임이 없어지는 프리즘 양 측정(프리즘 가림 검사)\u003c/li>\u003cli>\u003cb>마독스 막대(Maddox rod)\u003c/b>: 한 눈(예: 오른눈) 앞에 마독스 막대, 반대 눈은 점광원을 봄 → 오른눈은 &#x27;선&#x27;, 왼눈은 &#x27;점&#x27;을 보게 되어 융합이 깨짐. 수평 편위 측정 시 막대를 수평으로 두면 수직선이 보임. 선이 점을 지나면 정위, 막대를 댄 눈 쪽(같은 쪽)에 보이면 내사위(비교차), 반대쪽에 보이면 외사위(교차)\u003c/li>\u003cli>결과를 원/근 각각 방향(eso/exo/hyper)과 양(Δ)으로 기록\u003c/li>\u003c/ol>\u003cfigure class=\"gf\" id=\"fig3-11\">\u003csvg class=\"fig\" viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"커버테스트: 가림판을 옮길 때 드러나는 눈의 움직임으로 편위 판정\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g22c0392b\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"10.0\" y=\"20.0\" font-size=\"13\" fill=\"#1f3a5f\" text-anchor=\"start\" font-weight=\"bold\" >교대 가림 예: 외편위(exo)\u003c/text>\u003ctext x=\"10.0\" y=\"38.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"start\" font-weight=\"normal\" >검사자가 고객을 마주 본 모습(화면 왼쪽 = 고객 오른눈)\u003c/text>\u003cellipse cx=\"46.0\" cy=\"84.0\" rx=\"22.0\" ry=\"14.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" />\u003ccircle cx=\"46.0\" cy=\"84.0\" r=\"9.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"46.0\" cy=\"84.0\" r=\"3.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cellipse cx=\"100.0\" cy=\"84.0\" rx=\"22.0\" ry=\"14.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" />\u003ccircle cx=\"100.0\" cy=\"84.0\" r=\"9.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"100.0\" cy=\"84.0\" r=\"3.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cellipse cx=\"172.0\" cy=\"84.0\" rx=\"22.0\" ry=\"14.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" />\u003ccircle cx=\"163.0\" cy=\"84.0\" r=\"9.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"163.0\" cy=\"84.0\" r=\"3.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cellipse cx=\"226.0\" cy=\"84.0\" rx=\"22.0\" ry=\"14.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" />\u003ccircle cx=\"226.0\" cy=\"84.0\" r=\"9.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"226.0\" cy=\"84.0\" r=\"3.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003crect x=\"146.0\" y=\"62.0\" width=\"52.0\" height=\"44.0\" rx=\"8\" fill=\"#556\" stroke=\"#334\" stroke-width=\"1\" opacity=\".85\"/>\u003cellipse cx=\"298.0\" cy=\"84.0\" rx=\"22.0\" ry=\"14.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" />\u003ccircle cx=\"289.0\" cy=\"84.0\" r=\"9.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"289.0\" cy=\"84.0\" r=\"3.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cellipse cx=\"352.0\" cy=\"84.0\" rx=\"22.0\" ry=\"14.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"1.5\" />\u003ccircle cx=\"361.0\" cy=\"84.0\" r=\"9.0\" fill=\"#5b3a1e\" stroke=\"#3b2410\" stroke-width=\"1\" />\u003ccircle cx=\"361.0\" cy=\"84.0\" r=\"3.5\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003crect x=\"326.0\" y=\"62.0\" width=\"52.0\" height=\"44.0\" rx=\"8\" fill=\"#556\" stroke=\"#334\" stroke-width=\"1\" opacity=\".85\"/>\u003cline x1=\"286.0\" y1=\"108.0\" x2=\"308.0\" y2=\"108.0\" stroke=\"#c0392b\" stroke-width=\"2\" marker-end=\"url(#g22c0392b)\" />\u003ctext x=\"73.0\" y=\"126.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >① 두 눈 뜸\u003c/text>\u003ctext x=\"199.0\" y=\"126.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >② 오른눈 가림\u003c/text>\u003ctext x=\"325.0\" y=\"126.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >③ 왼눈으로 옮김\u003c/text>\u003ctext x=\"199.0\" y=\"142.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"middle\" font-weight=\"normal\" >가린 눈은 바깥으로\u003c/text>\u003ctext x=\"325.0\" y=\"142.0\" font-size=\"10.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >드러난 오른눈 → 안쪽\u003c/text>\u003crect x=\"10.0\" y=\"156.0\" width=\"380.0\" height=\"90.0\" rx=\"10\" fill=\"#fff8ec\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003ctext x=\"200.0\" y=\"176.0\" font-size=\"12.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >드러난 눈의 움직임 → 판정\u003c/text>\u003ctext x=\"200.0\" y=\"198.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >안쪽(코 쪽)으로 → 외편위(exo)\u003c/text>\u003ctext x=\"200.0\" y=\"217.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >바깥쪽(귀 쪽)으로 → 내편위(eso)\u003c/text>\u003ctext x=\"200.0\" y=\"236.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >아래로 → 위쪽 편위(hyper)\u003c/text>\u003crect x=\"10.0\" y=\"252.0\" width=\"380.0\" height=\"42.0\" rx=\"8\" fill=\"#eef5ff\" stroke=\"#2a6fdb\" stroke-width=\"1\" />\u003ctext x=\"200.0\" y=\"270.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >가림-안가림: 가리지 않은 눈이 움직이면 사시(현성)\u003c/text>\u003ctext x=\"200.0\" y=\"287.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >교대 가림: 융합을 끊어 사위+사시 총 편위\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-11.\u003c/b> 커버테스트: 가림판을 옮길 때 드러나는 눈의 움직임으로 편위 판정\u003c/figcaption>\u003c/figure>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>\u003cb>융합(fusion)\u003c/b>이 있으면 잠재된 편위(사위)는 숨겨짐. 가림판은 융합을 끊어 숨은 편위를 드러냄.\u003c/li>\u003cli>가림-안가림에서 가리지 않은 눈이 움직인다는 것은, 그 눈이 원래 시표를 보고 있지 않았다는 뜻(사시).\u003c/li>\u003cli>마독스 막대는 원주 렌즈 다발로 점광원을 선으로 바꿔, 두 눈이 서로 다른 모양을 보게 함 → 뇌가 하나로 합치지 못해(해리) 사위 양이 드러남.\u003c/li>\u003cli>사위는 대부분 정상 범위에서 증상이 없으나, 조절·폭주 이상과 함께 근거리 피로의 원인이 될 수 있음(AOA 조절·폭주 이상 지침).\u003c/li>\u003c/ul>\u003cfigure class=\"gf\" id=\"fig3-12\">\u003csvg class=\"fig\" viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"마독스 막대 검사(수평 편위): 고객에게 보이는 모습\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003ctext x=\"200.0\" y=\"20.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >오른눈에 마독스 막대(수평) → 오른눈은 세로 빨간 선, 왼눈은 흰 점\u003c/text>\u003crect x=\"10.0\" y=\"34.0\" width=\"122.0\" height=\"150.0\" rx=\"10\" fill=\"#1d2330\" stroke=\"#1d2330\" stroke-width=\"0\" />\u003ccircle cx=\"71.0\" cy=\"108.0\" r=\"6.0\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\" />\u003cline x1=\"71.0\" y1=\"44.0\" x2=\"71.0\" y2=\"172.0\" stroke=\"#ff5a5a\" stroke-width=\"4\" />\u003ctext x=\"71.0\" y=\"202.0\" font-size=\"12.5\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >정위\u003c/text>\u003ctext x=\"71.0\" y=\"220.0\" font-size=\"9.8\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >선이 점을 지남\u003c/text>\u003crect x=\"138.0\" y=\"34.0\" width=\"122.0\" height=\"150.0\" rx=\"10\" fill=\"#1d2330\" stroke=\"#1d2330\" stroke-width=\"0\" />\u003ccircle cx=\"199.0\" cy=\"108.0\" r=\"6.0\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\" />\u003cline x1=\"233.0\" y1=\"44.0\" x2=\"233.0\" y2=\"172.0\" stroke=\"#ff5a5a\" stroke-width=\"4\" />\u003ctext x=\"199.0\" y=\"202.0\" font-size=\"12.5\" fill=\"#2a6fdb\" text-anchor=\"middle\" font-weight=\"bold\" >내사위(eso)\u003c/text>\u003ctext x=\"199.0\" y=\"220.0\" font-size=\"9.8\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >선이 오른쪽(같은 쪽·비교차)\u003c/text>\u003crect x=\"266.0\" y=\"34.0\" width=\"122.0\" height=\"150.0\" rx=\"10\" fill=\"#1d2330\" stroke=\"#1d2330\" stroke-width=\"0\" />\u003ccircle cx=\"327.0\" cy=\"108.0\" r=\"6.0\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\" />\u003cline x1=\"293.0\" y1=\"44.0\" x2=\"293.0\" y2=\"172.0\" stroke=\"#ff5a5a\" stroke-width=\"4\" />\u003ctext x=\"327.0\" y=\"202.0\" font-size=\"12.5\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"bold\" >외사위(exo)\u003c/text>\u003ctext x=\"327.0\" y=\"220.0\" font-size=\"9.8\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >선이 왼쪽(반대쪽·교차)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-12.\u003c/b> 마독스 막대 검사(수평 편위): 고객에게 보이는 모습\u003c/figcaption>\u003c/figure>\u003cdiv class=\"box err\">\u003cb>주의\u003c/b>\u003cul>\u003cli>사시의 진단·치료는 안과 영역입니다. 안경원에서는 굴절 교정과 안경 처방(프리즘 포함) 판단에 필요한 범위에서 확인하고, 사시가 의심되면 안과로 안내합니다.\u003c/li>\u003cli>영국 College of Optometrists의 의뢰 긴급도 표(Annex 4)도 갑자기 생긴 복시·사시·안검하수·신경마비를 24시간 내 응급 의뢰 대상으로 분류합니다.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>고객이 작은 시표를 주시하게 했다(조절 자극)\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>cover-uncover로 사시 여부를 먼저 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>alternate cover로 총 편위를 확인했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>원거리·근거리를 모두 검사했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>방향과 양(Δ)을 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>새로 생긴 복시·눈꺼풀 처짐·갑작스런 사시는 즉시 안과 의뢰를 안내했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s3-12","title":"3.12 양안시 기능 검사","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>두 눈이 함께 편안하게 작동하는지(폭주·융합·입체시) 평가\u003c/li>\u003cli>근거리 피로·두통·글자 겹침 호소의 원인 파악\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>\u003cb>폭주근점(NPC)\u003c/b>: 작은 시표를 코 쪽으로 천천히 가져오며 &#x27;두 개로 보이는 지점&#x27;(분리점)과, 다시 멀리하며 &#x27;하나로 합쳐지는 지점&#x27;(회복점) 측정. 눈이 바깥으로 빠지는 것도 관찰\u003c/li>\u003cli>\u003cb>융합여력(vergence ranges)\u003c/b>: 포롭터 회전 프리즘으로 BI/BO를 서서히 늘리며 흐림점/분리점/회복점 측정(근·원)\u003c/li>\u003cli>\u003cb>입체시\u003c/b>: 편광 안경과 입체시 검사지로 입체 인지 확인\u003c/li>\u003cli>\u003cb>억제 검사(예: 워스 4점 검사)\u003c/b>: 적·녹 안경으로 보이는 점 개수로 융합/억제/복시 확인\u003c/li>\u003cli>고객 증상과 함께 해석(수치 단독으로 결론 내리지 않기)\u003c/li>\u003c/ol>\u003cfigure class=\"gf\" id=\"fig3-13\">\u003csvg class=\"fig\" viewBox=\"0 0 380 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"폭주근점(NPC): 분리점과 회복점\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003cmarker id=\"g24c0392b\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#c0392b\"/>\u003c/marker>\u003cmarker id=\"g24e07b00\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#e07b00\"/>\u003c/marker>\u003c/defs>\u003ccircle cx=\"330.0\" cy=\"60.0\" r=\"14.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ccircle cx=\"330.0\" cy=\"110.0\" r=\"14.0\" fill=\"#fff\" stroke=\"#1f3a5f\" stroke-width=\"2\" />\u003ccircle cx=\"324.0\" cy=\"60.0\" r=\"5.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003ccircle cx=\"324.0\" cy=\"110.0\" r=\"5.0\" fill=\"#111\" stroke=\"#111\" stroke-width=\"0\" />\u003cline x1=\"320.0\" y1=\"60.0\" x2=\"140.0\" y2=\"85.0\" stroke=\"#666\" stroke-width=\"1\" stroke-dasharray=\"3 3\" />\u003cline x1=\"320.0\" y1=\"110.0\" x2=\"140.0\" y2=\"85.0\" stroke=\"#666\" stroke-width=\"1\" stroke-dasharray=\"3 3\" />\u003crect x=\"130.0\" y=\"77.0\" width=\"10.0\" height=\"16.0\" rx=\"2\" fill=\"#e07b00\" stroke=\"#e07b00\" stroke-width=\"0\" />\u003cline x1=\"40.0\" y1=\"85.0\" x2=\"126.0\" y2=\"85.0\" stroke=\"#e07b00\" stroke-width=\"2\" marker-end=\"url(#g24e07b00)\" />\u003ctext x=\"70.0\" y=\"76.0\" font-size=\"11\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"normal\" >코 쪽으로 천천히\u003c/text>\u003cline x1=\"140.0\" y1=\"130.0\" x2=\"316.0\" y2=\"130.0\" stroke=\"#c0392b\" stroke-width=\"1.2\" marker-end=\"url(#g24c0392b)\" marker-start=\"url(#g24c0392b)\" />\u003ctext x=\"228.0\" y=\"146.0\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"middle\" font-weight=\"normal\" >분리점: 두 개로 보이는 거리\u003c/text>\u003ctext x=\"190.0\" y=\"164.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >다시 멀리하며 하나로 합쳐지는 점 = 회복점\u003c/text>\u003ctext x=\"10.0\" y=\"20.0\" font-size=\"11\" fill=\"#666\" text-anchor=\"start\" font-weight=\"normal\" >위에서 본 모습\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-13.\u003c/b> 폭주근점(NPC): 분리점과 회복점\u003c/figcaption>\u003c/figure>\u003cfigure class=\"gf\" id=\"fig3-14\">\u003csvg class=\"fig\" viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"워스 4점 검사(적·녹 안경: 오른눈 빨강, 왼눈 초록 예)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003crect x=\"4.0\" y=\"40.0\" width=\"92.0\" height=\"130.0\" rx=\"10\" fill=\"#1d2330\" stroke=\"#1d2330\" stroke-width=\"0\" />\u003ccircle cx=\"50.0\" cy=\"70.0\" r=\"9.0\" fill=\"#d63b3b\" stroke=\"#a00\" stroke-width=\"1\" />\u003ccircle cx=\"20.0\" cy=\"100.0\" r=\"9.0\" fill=\"#2fa84f\" stroke=\"#176\" stroke-width=\"1\" />\u003ccircle cx=\"80.0\" cy=\"100.0\" r=\"9.0\" fill=\"#2fa84f\" stroke=\"#176\" stroke-width=\"1\" />\u003ccircle cx=\"50.0\" cy=\"130.0\" r=\"9.0\" fill=\"#e8e8e8\" stroke=\"#999\" stroke-width=\"1\" />\u003ctext x=\"50.0\" y=\"190.0\" font-size=\"12\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >4개\u003c/text>\u003ctext x=\"50.0\" y=\"208.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >융합 정상\u003c/text>\u003crect x=\"103.0\" y=\"40.0\" width=\"92.0\" height=\"130.0\" rx=\"10\" fill=\"#1d2330\" stroke=\"#1d2330\" stroke-width=\"0\" />\u003ccircle cx=\"149.0\" cy=\"70.0\" r=\"9.0\" fill=\"#d63b3b\" stroke=\"#a00\" stroke-width=\"1\" />\u003ccircle cx=\"149.0\" cy=\"130.0\" r=\"9.0\" fill=\"#d63b3b\" stroke=\"#a00\" stroke-width=\"1\" />\u003ctext x=\"149.0\" y=\"190.0\" font-size=\"12\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >2개(빨강)\u003c/text>\u003ctext x=\"149.0\" y=\"208.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >왼눈 억제\u003c/text>\u003crect x=\"202.0\" y=\"40.0\" width=\"92.0\" height=\"130.0\" rx=\"10\" fill=\"#1d2330\" stroke=\"#1d2330\" stroke-width=\"0\" />\u003ccircle cx=\"218.0\" cy=\"100.0\" r=\"9.0\" fill=\"#2fa84f\" stroke=\"#176\" stroke-width=\"1\" />\u003ccircle cx=\"278.0\" cy=\"100.0\" r=\"9.0\" fill=\"#2fa84f\" stroke=\"#176\" stroke-width=\"1\" />\u003ccircle cx=\"248.0\" cy=\"130.0\" r=\"9.0\" fill=\"#2fa84f\" stroke=\"#176\" stroke-width=\"1\" />\u003ctext x=\"248.0\" y=\"190.0\" font-size=\"12\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >3개(초록)\u003c/text>\u003ctext x=\"248.0\" y=\"208.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >오른눈 억제\u003c/text>\u003crect x=\"301.0\" y=\"40.0\" width=\"92.0\" height=\"130.0\" rx=\"10\" fill=\"#1d2330\" stroke=\"#1d2330\" stroke-width=\"0\" />\u003ccircle cx=\"347.0\" cy=\"70.0\" r=\"9.0\" fill=\"#d63b3b\" stroke=\"#a00\" stroke-width=\"1\" />\u003ccircle cx=\"317.0\" cy=\"100.0\" r=\"9.0\" fill=\"#2fa84f\" stroke=\"#176\" stroke-width=\"1\" />\u003ccircle cx=\"377.0\" cy=\"100.0\" r=\"9.0\" fill=\"#2fa84f\" stroke=\"#176\" stroke-width=\"1\" />\u003ccircle cx=\"347.0\" cy=\"130.0\" r=\"9.0\" fill=\"#d63b3b\" stroke=\"#a00\" stroke-width=\"1\" />\u003ccircle cx=\"363.0\" cy=\"142.0\" r=\"9.0\" fill=\"#2fa84f\" stroke=\"#176\" stroke-width=\"1\" />\u003ctext x=\"347.0\" y=\"190.0\" font-size=\"12\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >5개\u003c/text>\u003ctext x=\"347.0\" y=\"208.0\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >복시\u003c/text>\u003ctext x=\"200.0\" y=\"24.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"normal\" >고객이 보는 점의 개수로 판정\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 3-14.\u003c/b> 워스 4점 검사(적·녹 안경: 오른눈 빨강, 왼눈 초록 예)\u003c/figcaption>\u003c/figure>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>AOA 성인 지침은 연령·증상·예비검사 결과에 따라 안구 정렬·운동, 사위, 폭주 여력·용이성, 억제·입체시, 조절력·조절 용이성을 평가하도록 안내함.\u003c/li>\u003cli>Sheard 기준 등 처방 판단 규칙은 교과서마다 다르므로 매장 내 안경사 판단 기준을 문서화해 사용.\u003c/li>\u003c/ul>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>NPC 분리점·회복점을 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>융합여력은 흐림/분리/회복을 구분해 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>입체시·억제 결과를 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>증상과 결과를 연결해 해석했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>이상 소견이 크면 안과 또는 전문 검안 상담을 안내했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s3-13","title":"3.13 처방 결정 및 착용 테스트","html":"\u003cp>\u003cb>담당:\u003c/b> 안경사\u003c/p>\u003ch4 class=\"lbl\">목적\u003c/h4>\u003cul>\u003cli>측정된 &#x27;굴절값&#x27;을 고객이 실제로 편하게 쓸 수 있는 &#x27;처방&#x27;으로 전환\u003c/li>\u003cli>적응 문제를 사전에 발견\u003c/li>\u003c/ul>\u003ch4 class=\"lbl\">방법\u003c/h4>\u003col>\u003cli>최종 굴절값, 기존 안경 도수, 나이, 생활 거리, 증상을 종합\u003c/li>\u003cli>변화량이 큰 경우(특히 원주도수 증가·축 변화·첫 난시 교정) 단계적 처방 검토: 구면등가를 유지하며 원주를 일부만 넣는 방법 등\u003c/li>\u003cli>\u003cb>시험테\u003c/b>에 처방 렌즈를 넣고(정점간거리·경사각·PD 맞춤) 원거리 → 근거리 → 매장 내 보행(바닥·계단·진열대 직선) 확인 5~10분\u003c/li>\u003cli>확인 질문: 선명함, 바닥 기울어짐·울렁임, 어지러움, 두 눈 편안함, 근거리 거리감\u003c/li>\u003cli>불편 시 원인별 조정(과마이너스 → 구면 +0.25D, 왜곡 → 원주 감량/축 확인, 근거리 불편 → ADD·근용 PD 조정)\u003c/li>\u003cli>최종 처방과 상담 내용(적응 기간 안내, 재방문 기준)을 기록\u003c/li>\u003c/ol>\u003ch4 class=\"lbl\">이론적 근거 (왜 이렇게 하는가)\u003c/h4>\u003cul>\u003cli>AOA 지침: 굴절 결과만으로 처방이 결정되지 않으며 다른 검사 결과와 고객의 시각 요구를 함께 분석해 처방 여부와 양을 정한다.\u003c/li>\u003cli>원주렌즈는 경선마다 배율이 달라(경선별 배율 차이) 공간이 기울거나 늘어나 보일 수 있음 → 특히 사난시·고도 원주·처음 교정 시 착용 테스트가 중요.\u003c/li>\u003cli>포롭터는 렌즈가 눈에서 멀고 기울기가 없으므로, 실제 안경과 가까운 시험테에서 최종 확인.\u003c/li>\u003c/ul>\u003cdiv class=\"chkt\">☑ 체크리스트 (실습 평가표로 사용 가능)\u003c/div>\u003cul class=\"chk\">\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>굴절값과 처방값의 차이(조정 이유)를 기록했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>시험테 PD·정점간거리를 맞췄다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>원·근·보행 테스트를 모두 했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>어지러움/왜곡 여부를 질문했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>적응 기간과 재방문 기준을 안내했다\u003c/span>\u003c/label>\u003c/li>\u003cli>\u003clabel>\u003cinput type=\"checkbox\"> \u003cspan>고객이 처방 변화를 이해했는지 확인했다\u003c/span>\u003c/label>\u003c/li>\u003c/ul>"},{"id":"s3-14","title":"3.14 자각적 굴절검사의 심리·정신물리학적 배경","html":"\u003cp>자각적 검사는 &#x27;고객의 판단&#x27;이라는 측정 도구를 쓰는 검사입니다. 사람의 판단은 피로·기대·질문 방식에 따라 흔들리므로, 검사자는 이를 이해하고 \u003cb>검사 방법으로 오차를 줄여야\u003c/b> 합니다.\u003c/p>\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>현상/개념\u003c/th>\u003cth>설명\u003c/th>\u003cth>현장 대응\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>강제선택(forced choice)과 &#x27;같음&#x27; 응답\u003c/td>\u003ctd>정신물리학에서는 두 자극 중 하나를 고르게 해 미세한 차이를 판별함. 그러나 차이가 판별 한계(역치) 아래면 고객은 &#x27;찍게&#x27; 됨\u003c/td>\u003ctd>&quot;1번, 2번, 혹은 비슷하다&quot; 세 가지 선택지를 처음부터 알려 줌. &#x27;비슷하다&#x27;는 정답(종료점)일 수 있음을 안내\u003c/td>\u003c/tr>\u003ctr>\u003ctd>반응 편향(response bias)\u003c/td>\u003ctd>고객이 &#x27;더 진하고 작고 또렷한&#x27; 쪽(마이너스 추가 시 상이 작고 대비가 높아짐)을 선호하거나, 검사자를 기쁘게 하려고 &#x27;좋아졌다&#x27;고 답하는 경향\u003c/td>\u003ctd>&#x27;더 진하다&#x27;가 아니라 &#x27;더 많이 읽히는가&#x27;로 판단(MPMVA). 마이너스 추가 후에는 반드시 한 줄 더 읽는지 확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>순서·시간 효과\u003c/td>\u003ctd>먼저/나중에 본 렌즈, 더 오래 본 렌즈가 유리하게 판단될 수 있음\u003c/td>\u003ctd>1번과 2번 제시 시간 비슷하게(각 1~2초), 애매하면 순서를 바꿔 반복\u003c/td>\u003c/tr>\u003ctr>\u003ctd>유도 질문\u003c/td>\u003ctd>&quot;이게 더 좋죠?&quot;처럼 기대를 담은 질문은 답을 유도\u003c/td>\u003ctd>중립 질문: &quot;어느 쪽이 더 선명한가요, 아니면 비슷한가요?&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>피로·집중력 저하\u003c/td>\u003ctd>검사가 길어지면 판단 일관성이 떨어지고 &#x27;아무거나&#x27; 답함\u003c/td>\u003ctd>핵심 단계 우선, 응답이 흔들리면 잠시 휴식, 같은 단계 반복 횟수 제한\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조절 개입\u003c/td>\u003ctd>젊은 고객은 마이너스를 추가해도 조절로 보상해 &#x27;똑같이 잘 보임&#x27; → 과마이너스로 끝나기 쉬움\u003c/td>\u003ctd>운무 후 플러스 쪽에서 접근, MPMVA·적록·양안균형으로 재확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>역치와 단계 크기\u003c/td>\u003ctd>0.25D 차이를 구분 못 하는 고객도 있음(동공 크기, 시력 수준, 원주가 낮을 때)\u003c/td>\u003ctd>응답이 불명확하면 0.50D 단계로 크게 비교한 뒤 좁혀 가기(bracketing)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기대·불안\u003c/td>\u003ctd>&#x27;도수가 올라가면 눈이 나빠진다&#x27;는 걱정이 응답에 영향\u003c/td>\u003ctd>검사 목적과 방법을 미리 설명해 불안을 낮춤\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"box term\">\u003cb>&#x27;1번이 좋아요, 2번이 좋아요?&#x27; 기법 – 표준 대사\u003c/b>\u003cul>\u003cli>시작 전: &quot;렌즈를 두 개씩 보여드릴게요. 더 선명한 쪽 번호를 말씀해 주시고, 차이가 없으면 &#x27;비슷하다&#x27;고 해 주세요. 정답은 없으니 편하게 답하시면 됩니다.&quot;\u003c/li>\u003cli>제시: &quot;1번…(1~2초) 2번…(1~2초). 어느 쪽이 더 선명한가요, 아니면 비슷한가요?&quot;\u003c/li>\u003cli>망설이면: &quot;다시 한 번 보여드릴게요. 1번… 2번…&quot; (순서를 바꿔 제시해도 좋음)\u003c/li>\u003cli>과마이너스 방지: &quot;글자가 더 진해 보이는 것 말고, 한 줄 아래 글자가 더 읽히나요?&quot;\u003c/li>\u003cli>적록: &quot;빨간 쪽과 초록 쪽 중 글자가 어느 쪽이 더 검고 진하게 보이나요?&quot;\u003c/li>\u003c/ul>\u003c/div>"}],"questions":[{"id":"g06-q1","question":"교대 가림에서 가림판을 옮길 때 드러난 눈이 안쪽(코 쪽)으로 움직였다.","choices":["내편위","외편위","위쪽 편위","정위"],"answer_index":1,"explanation":"원래 바깥쪽에 있던 눈이 돌아오는 것 → 외편위(exo).","page":"g06.html"},{"id":"g06-q2","question":"오른눈에 마독스 막대, 빨간 선이 점의 오른쪽에 보인다.","choices":["외사위(교차)","내사위(비교차)","정위","상사위"],"answer_index":1,"explanation":"막대 댄 눈과 같은 쪽 = 비교차 = 내사위.","page":"g06.html"},{"id":"g06-q3","question":"워스 4점에서 빨간 점 2개만 보인다(오른눈 빨간 필터).","choices":["융합","왼눈 억제","오른눈 억제","복시"],"answer_index":1,"explanation":"빨간 필터의 오른눈만 보고 있으니 왼눈이 억제된 상태.","page":"g06.html"},{"id":"g06-q4","question":"자각 검사 중 바람직한 질문은?","choices":["이게 더 좋죠?","1번, 2번 중 어느 쪽이 더 선명한가요, 아니면 비슷한가요?","2번이 맞죠?","빨리 골라 주세요"],"answer_index":1,"explanation":"중립 질문과 '비슷함' 선택지로 반응 편향을 줄여요.","page":"g06.html"}]},{"id":"g07","no":"4","title":"근시·원시·난시 구분(처방 읽기)","page":"g07.html","intro":"\u003cdiv class=\"box star\">\u003cb>핵심: 따로 검사하지 않는다\u003c/b>\u003cul>\u003cli>근시·원시·난시는 별개 검사로 찾는 것이 아니라, 하나의 통합 굴절검사(타각적+자각적)로 얻은 처방값(S, C, Ax)에서 &#x27;읽어내는&#x27; 것입니다.\u003c/li>\u003cli>AOA도 굴절검사를 &#x27;근시·원시·난시를 보정하는 데 필요한 렌즈 도수를 결정하는 검사&#x27;로 설명합니다.\u003c/li>\u003c/ul>\u003c/div>","key_points":["축 경선 = S, 90° 경선 = S + C. 둘의 부호로 근시성/원시성/혼합 판정.","축 범위: 직 180±30, 도 90±30, 사 그 외(마이너스 원주 기준).","플러스 원주는 먼저 변환: 새 S = S + C, 새 C = −C, 축 ± 90.","SE가 0이어도 혼합난시는 흐리다."],"sections":[{"id":"s4-1","title":"4.1 처방 표기 읽는 법","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>표기\u003c/th>\u003cth>의미\u003c/th>\u003cth>읽는 법\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R / L (OD / OS)\u003c/td>\u003ctd>오른눈 / 왼눈\u003c/td>\u003ctd>OU = 양안\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S (SPH, 구면도수)\u003c/td>\u003ctd>모든 방향에 같은 굴절력\u003c/td>\u003ctd>− = 근시 교정, + = 원시 교정, 0.00(PL, 플라노) = 구면 이상 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C (CYL, 원주도수)\u003c/td>\u003ctd>특정 방향(경선)에만 작용하는 도수 = 난시 교정량\u003c/td>\u003ctd>한국 안경원은 주로 마이너스(−) 원주 표기. 크기가 클수록 난시가 큼\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ax (AXIS, 축)\u003c/td>\u003ctd>원주렌즈의 축 방향(0~180°)\u003c/td>\u003ctd>도수가 &#x27;없는&#x27; 방향. 원주 굴절력은 축과 90° 방향에 작용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ADD (가입도)\u003c/td>\u003ctd>근거리용으로 원용 도수에 더하는 플러스\u003c/td>\u003ctd>노안 교정. 항상 +로 표기\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prism / Base\u003c/td>\u003ctd>프리즘 양(Δ)과 기저 방향\u003c/td>\u003ctd>BI(안쪽)/BO(바깥)/BU(위)/BD(아래)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PD\u003c/td>\u003ctd>동공간거리(mm)\u003c/td>\u003ctd>원용/근용, 단안 PD\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig4-1\">\u003csvg class=\"fig\" viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"처방전 읽는 법: 예시 처방의 각 칸 의미\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003crect x=\"12.0\" y=\"40.0\" width=\"40.0\" height=\"34.0\" rx=\"0\" fill=\"#e9eff8\" stroke=\"#9fb0c8\" stroke-width=\"1\" />\u003ctext x=\"32.0\" y=\"62.0\" font-size=\"11.5\" fill=\"#111\" text-anchor=\"middle\" font-weight=\"bold\" >\u003c/text>\u003crect x=\"52.0\" y=\"40.0\" width=\"68.0\" height=\"34.0\" rx=\"0\" fill=\"#e9eff8\" stroke=\"#9fb0c8\" stroke-width=\"1\" />\u003ctext x=\"86.0\" y=\"62.0\" font-size=\"11.5\" fill=\"#111\" text-anchor=\"middle\" font-weight=\"bold\" >S(구면)\u003c/text>\u003crect x=\"120.0\" y=\"40.0\" width=\"68.0\" height=\"34.0\" rx=\"0\" fill=\"#e9eff8\" stroke=\"#9fb0c8\" stroke-width=\"1\" />\u003ctext x=\"154.0\" y=\"62.0\" font-size=\"11.5\" fill=\"#111\" text-anchor=\"middle\" font-weight=\"bold\" >C(원주)\u003c/text>\u003crect x=\"188.0\" y=\"40.0\" width=\"60.0\" height=\"34.0\" rx=\"0\" fill=\"#e9eff8\" stroke=\"#9fb0c8\" stroke-width=\"1\" />\u003ctext x=\"218.0\" y=\"62.0\" font-size=\"11.5\" fill=\"#111\" text-anchor=\"middle\" font-weight=\"bold\" >AX(축)\u003c/text>\u003crect x=\"248.0\" y=\"40.0\" width=\"58.0\" height=\"34.0\" rx=\"0\" fill=\"#e9eff8\" stroke=\"#9fb0c8\" stroke-width=\"1\" />\u003ctext x=\"277.0\" y=\"62.0\" font-size=\"11.5\" fill=\"#111\" text-anchor=\"middle\" font-weight=\"bold\" >ADD\u003c/text>\u003crect x=\"306.0\ =\"164.0\" font-size=\"13\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >⑤\u003c/text>\u003ctext x=\"335.0\" y=\"164.0\" font-size=\"13\" fill=\"#1b7a43\" text-anchor=\"middle\" font-weight=\"bold\" >⑥\u003c/text>\u003ctext x=\"40.0\" y=\"196.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"start\" font-weight=\"normal\" >① R/L = 오른눈/왼눈 (OD/OS)\u003c/text>\u003ctext x=\"40.0\" y=\"213.0\" font-size=\"11.5\" fill=\"#2a6fdb\" text-anchor=\"start\" font-weight=\"normal\" >② S: − 근시 교정 / + 원시 교정\u003c/text>\u003ctext x=\"40.0\" y=\"230.0\" font-size=\"11.5\" fill=\"#7b3fb5\" text-anchor=\"start\" font-weight=\"normal\" >③ C: 난시 교정량(한국은 주로 − 표기)\u003c/text>\u003ctext x=\"40.0\" y=\"247.0\" font-size=\"11.5\" fill=\"#c0392b\" text-anchor=\"start\" font-weight=\"normal\" >④ AX: 원주 방향 0~180° (도수 없는 방향)\u003c/text>\u003ctext x=\"40.0\" y=\"264.0\" font-size=\"11.5\" fill=\"#e07b00\" text-anchor=\"start\" font-weight=\"normal\" >⑤ ADD: 근용으로 더하는 + 도수\u003c/text>\u003ctext x=\"40.0\" y=\"281.0\" font-size=\"11.5\" fill=\"#1b7a43\" text-anchor=\"start\" font-weight=\"normal\" >⑥ PD: 단안 동공간거리(mm)\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 4-1.\u003c/b> 처방전 읽는 법: 예시 처방의 각 칸 의미\u003c/figcaption>\u003c/figure>\u003ch3>두 주경선 도수로 바꾸어 생각하기 (가장 확실한 판별법)\u003c/h3>\u003cp>마이너스 원주 표기 \u003cb>S / C × Ax\u003c/b>에서 두 주경선의 도수는 다음과 같습니다.\u003c/p>\u003cul>\u003cli>\u003cb>축 방향 경선의 도수 = S\u003c/b>\u003c/li>\u003cli>\u003cb>축과 90° 방향 경선의 도수 = S + C\u003c/b>\u003c/li>\u003cli>두 값이 \u003cb>모두 0 이하(−)\u003c/b> → 근시성 난시 (하나가 0이면 &#x27;단순&#x27;, 둘 다 −이면 &#x27;복합(복성)&#x27;)\u003c/li>\u003cli>두 값이 \u003cb>모두 0 이상(+)\u003c/b> → 원시성 난시 (하나가 0이면 &#x27;단순&#x27;, 둘 다 +이면 &#x27;복합&#x27;)\u003c/li>\u003cli>두 값의 \u003cb>부호가 서로 다름(+와 −)\u003c/b> → \u003cb>혼합난시\u003c/b>\u003c/li>\u003cli>C = 0 → 난시 없음: S가 −면 근시, +면 원시\u003c/li>\u003c/ul>\u003cfigure class=\"gf\" id=\"fig4-2\">\u003csvg class=\"fig\" viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"마이너스 원주 처방을 두 주경선 도수로 바꾸기(파워 크로스)\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003ctext x=\"200.0\" y=\"22.0\" font-size=\"14\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"bold\" >S −2.00  C −1.00 × 90\u003c/text>\u003cline x1=\"110.0\" y1=\"60.0\" x2=\"110.0\" y2=\"220.0\" stroke=\"#2a6fdb\" stroke-width=\"4\" />\u003cline x1=\"30.0\" y1=\"140.0\" x2=\"190.0\" y2=\"140.0\" stroke=\"#c0392b\" stroke-width=\"4\" />\u003ctext x=\"110.0\" y=\"54.0\" font-size=\"11\" fill=\"#2a6fdb\" text-anchor=\"middle\" font-weight=\"normal\" >90° 경선(축)\u003c/text>\u003ctext x=\"118.0\" y=\"82.0\" font-size=\"12\" fill=\"#2a6fdb\" text-anchor=\"start\" font-weight=\"bold\" >−2.00 = S\u003c/text>\u003ctext x=\"194.0\" y=\"132.0\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"start\" font-weight=\"normal\" >180° 경선\u003c/text>\u003ctext x=\"194.0\" y=\"154.0\" font-size=\"12\" fill=\"#c0392b\" text-anchor=\"start\" font-weight=\"bold\" >−3.00\u003c/text>\u003ctext x=\"194.0\" y=\"170.0\" font-size=\"11\" fill=\"#c0392b\" text-anchor=\"start\" font-weight=\"normal\" >= S + C\u003c/text>\u003crect x=\"236.0\" y=\"60.0\" width=\"156.0\" height=\"170.0\" rx=\"10\" fill=\"#fff8ec\" stroke=\"#e07b00\" stroke-width=\"1.2\" />\u003ctext x=\"314.0\" y=\"82.0\" font-size=\"12.5\" fill=\"#e07b00\" text-anchor=\"middle\" font-weight=\"bold\" >판정 순서\u003c/text>\u003ctext x=\"246.0\" y=\"106.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >축 방향 경선 = S\u003c/text>\u003ctext x=\"246.0\" y=\"126.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >축 + 90° 경선 = S + C\u003c/text>\u003ctext x=\"246.0\" y=\"146.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >둘 다 − → 근시성 난시\u003c/text>\u003ctext x=\"246.0\" y=\"166.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >둘 다 + → 원시성 난시\u003c/text>\u003ctext x=\"246.0\" y=\"186.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >부호가 다름 → 혼합난시\u003c/text>\u003ctext x=\"246.0\" y=\"206.0\" font-size=\"11.5\" fill=\"#333\" text-anchor=\"start\" font-weight=\"normal\" >하나가 0 → '단순'\u003c/text>\u003ctext x=\"160.0\" y=\"250.0\" font-size=\"11.5\" fill=\"#1f3a5f\" text-anchor=\"middle\" font-weight=\"normal\" >→ 이 예: 둘 다 − = 복합(복성) 근시성 난시, 축 90° = 도난시\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 4-2.\u003c/b> 마이너스 원주 처방을 두 주경선 도수로 바꾸기(파워 크로스)\u003c/figcaption>\u003c/figure>\u003ch3>난시 축에 따른 분류 (마이너스 원주 기준)\u003c/h3>\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>분류\u003c/th>\u003cth>마이너스 원주 축 범위\u003c/th>\u003cth>의미\u003c/th>\u003cth>참고\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>직난시 (WTR, with-the-rule)\u003c/td>\u003ctd>180° ± 30° (0~30°, 150~180°)\u003c/td>\u003ctd>수직 경선의 굴절력이 더 강함\u003c/td>\u003ctd>젊은 층에 흔하다고 알려짐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>도난시 (ATR, against-the-rule)\u003c/td>\u003ctd>90° ± 30° (60~120°)\u003c/td>\u003ctd>수평 경선의 굴절력이 더 강함\u003c/td>\u003ctd>나이가 들며 증가 경향\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사난시 (oblique)\u003c/td>\u003ctd>31~59°, 121~149°\u003c/td>\u003ctd>주경선이 비스듬함\u003c/td>\u003ctd>적응이 상대적으로 어려울 수 있어 착용 테스트 중요\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig4-3\">\u003csvg class=\"fig\" viewBox=\"0 0 380 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"마이너스 원주 축 범위로 보는 직난시·도난시·사난시\" font-family=\"'NG','Sym','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif\">\u003cdefs>\u003c/defs>\u003cpath d=\"M190,190 L340.0,190.0 A150,150 0 0 0 319.9,115.0 Z\" stroke=\"#fff\" fill=\"#1b7a43\" stroke-width=\"1\" fill-opacity=\".85\" stroke-width=\"1\"/>\u003cpath d=\"M190,190 L340.0,190.0 A150,150 0 0 0 319.9,115.0 Z\" fill=\"#1b7a43\" fill-opacity=\".25\" stroke=\"none\"/>\u003cpath d=\"M190,190 L60.1,115.0 A150,150 0 0 0 40.0,190.0 Z\" str " >← 앞(각막 쪽)\u003c/text>\u003ctext x=\"392.0\" y=\"314.0\" font-size=\"10.5\" fill=\"#666\" text-anchor=\"end\" font-weight=\"normal\" >뒤 →\u003c/text>\u003ctext x=\"394.0\" y=\"18.0\" font-size=\"10.5\" fill=\"#333\" text-anchor=\"end\" font-weight=\"normal\" >파랑 = 앞초선, 주황 점선 = 뒤초선\u003c/text>\u003c/svg>\u003cfigcaption>\u003cb>그림 4-5.\u003c/b> 두 초선의 위치로 보는 난시 5종류(조절 휴식 상태)\u003c/figcaption>\u003c/figure>\u003cdiv class=\"box term\">\u003cb>🧪 직접 해 보기: 처방 판별기\u003c/b>\u003cp>숫자를 바꿔 보는 실습은 교재 페이지에서 할 수 있어요.\u003c/p>\u003cp>\u003ca class=\"btn l\" href=\"g07.html#lab-rx\">교재 페이지에서 실습 열기 →\u003c/a>\u003c/p>\u003c/div>"},{"id":"s4-3","title":"4.3 증상 비교 표","html":"\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>먼 곳\u003c/th>\u003cth>가까운 곳\u003c/th>\u003cth>흔한 호소\u003c/th>\u003cth>검사 시 특징\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>근시\u003c/td>\u003ctd>흐림\u003c/td>\u003ctd>상대적으로 잘 보임(벗으면)\u003c/td>\u003ctd>눈 찡그림, 칠판·자막 안 보임, 야간 운전 불편\u003c/td>\u003ctd>운무 시 플러스에 민감, 과마이너스 위험\u003c/td>\u003c/tr>\u003ctr>\u003ctd>원시(경도·젊은층)\u003c/td>\u003ctd>대체로 잘 보임\u003c/td>\u003ctd>피로·흐림 가능\u003c/td>\u003ctd>근거리 피로, 두통, 집중 저하\u003c/td>\u003ctd>조절로 숨겨져(잠복원시) 측정값이 작게 나올 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>원시(고도·중년 이상)\u003c/td>\u003ctd>흐림 가능\u003c/td>\u003ctd>흐림\u003c/td>\u003ctd>원·근 모두 불편, 노안 증상 조기 발생\u003c/td>\u003ctd>플러스를 잘 받아들이는지 단계적 확인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>난시\u003c/td>\u003ctd>흐림·번짐\u003c/td>\u003ctd>흐림·번짐\u003c/td>\u003ctd>글자 겹침, 빛 번짐, 눈 피로, 두통\u003c/td>\u003ctd>방향에 따라 선명도 다름(난시표), JCC 응답\u003c/td>\u003c/tr>\u003ctr>\u003ctd>혼합난시\u003c/td>\u003ctd>흐림\u003c/td>\u003ctd>흐림\u003c/td>\u003ctd>전반적 흐림, 구면만 바꿔서는 개선 적음\u003c/td>\u003ctd>구면등가가 작아도 원주 교정 시 크게 개선\u003c/td>\u003c/tr>\u003ctr>\u003ctd>노안\u003c/td>\u003ctd>(원용 교정되어 있으면) 잘 보임\u003c/td>\u003ctd>흐림, 멀리 떼어 봄\u003c/td>\u003ctd>폰 글씨 멀리 봄, 어두우면 더 불편\u003c/td>\u003ctd>근점 멀어짐, 조절력 감소\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"questions":[{"id":"g07-q1","question":"S +1.00 C −2.00 × 180의 판정은?","choices":["단순 근시성 난시","혼합난시","복합 원시성 난시","원시"],"answer_index":1,"explanation":"축 경선 +1.00, 90° 경선 −1.00 → 부호가 달라 혼합난시.","page":"g07.html"},{"id":"g07-q2","question":"마이너스 원주 축 90°는?","choices":["직난시","도난시","사난시","난시 없음"],"answer_index":1,"explanation":"90 ± 30° = 도난시(수평 경선이 더 강함).","page":"g07.html"},{"id":"g07-q3","question":"+1.00 +2.00 × 90을 마이너스 원주로 바꾸면?","choices":["+3.00 −2.00 × 180","−1.00 +2.00 × 180","+1.00 −2.00 × 90","+3.00 −2.00 × 90"],"answer_index":0,"explanation":"새 S = 1 + 2 = +3.00, 새 C = −2.00, 축 90 + 90 = 180.","page":"g07.html"},{"id":"g07-q4","question":"처방의 ADD는?","choices":["원주 축 방향","근거리용으로 더하는 + 도수","동공 거리","프리즘 방향"],"answer_index":1,"explanation":"ADD = 원용에 더하는 근용 + 도수, 항상 +.","page":"g07.html"}]},{"id":"g08","no":"5","title":"노안과 조절 검사","page":"g08.html","intro":"","key_points":["Hofstetter: 최소 15 − 0.25×나이, 평균 18.5 − 0.3×나이, 최대 25 − 0.4×나이.","푸시업: 조절력 = 100 ÷ 근점(cm). 과대평가 경향, 방법을 기록.","ADD = 1/작업거리 − 조절력/2. '필요한 만큼'만, 선명 범위 확인."],"sections":[{"id":"s5-1","title":"5.1 이론: 조절력과 나이","html":"\u003cp>조절력은 나이가 들면서 점차 줄어듭니다. 임상에서는 Hofstetter(1950)가 제시한 공식을 연령별 기대값의 기준으로 널리 사용합니다.\u003c/p>\u003cdiv class=\"tblw\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>공식\u003c/th>\u003cth>40세 예\u003c/th>\u003cth>50세 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>최소 조절력\u003c/td>\u003ctd>15 − 0.25 × 나이\u003c/td>\u003ctd>5.0D\u003c/td>\u003ctd>2.5D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>평균 조절력\u003c/td>\u003ctd>18.5 − 0.3 × 나이\u003c/td>\u003ctd>6.5D\u003c/td>\u003ctd>3.5D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>최대 조절력\u003c/td>\u003ctd>25 − 0.4 × 나이\u003c/td>\u003ctd>9.0D\u003c/td>\u003ctd>5.0D\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"gf\" id=\"fig5-1\">\u003csvg class=\"fig\" viewBox=\"0 0 380 280\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Hofstetter 공식에 따른 나이별 조절력 기대값\" font-family=\"'NG','Sym
